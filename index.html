<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WASTAMA EILAND</title>
<style>
body{margin:0;overflow:hidden;background:black;font-family:Arial;color:white;}
#nameMenu,#difficultyMenu,#characterMenu,#gameOver{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);text-align:center;}
#characterMenu,#difficultyMenu,#nameMenu{display:none;}
#hud{position:absolute;top:60px;left:20px;display:none;}
#stats{position:absolute;top:10px;left:20px;}
#shopButton{position:absolute;top:10px;right:20px;background:#444;padding:10px;cursor:pointer;}
#shopMenu{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:400px;background:#111;border:3px solid white;padding:20px;}
button{padding:12px;margin:5px;font-size:16px;cursor:pointer;}
#chatBox{position:absolute;bottom:10px;left:10px;width:250px;}
#messages{height:150px;overflow-y:auto;border:1px solid white;padding:5px;margin-bottom:5px;}
#chatInput{width:100%;padding:5px;}
</style>
</head>
<body>

<div id="stats">
<div>Games gespeeld: <span id="played">0</span></div>
<div>Games gewonnen: <span id="won">0</span></div>
<div>Munten totaal: <span id="coinsTotal">0</span></div>
</div>

<div id="shopButton">SHOP</div>

<div id="nameMenu">
<h1>Typ je naam</h1>
<input id="nameInput" placeholder="Je naam...">
<button onclick="setName()">Start</button>
<p id="nameError" style="color:red;"></p>
</div>

<div id="difficultyMenu">
<h1>Kies moeilijkheid</h1>
<button onclick="chooseDifficulty('easy')">🙂 Makkelijk</button>
<button onclick="chooseDifficulty('hard')">😈 Moeilijk</button>
<button onclick="chooseDifficulty('impossible')">💀 Impossible</button>
</div>

<div id="characterMenu">
<h1>Kies je mannetje</h1>
<button onclick="startGame('ice')">❄ IJs</button>
<button onclick="startGame('fire')">🔥 Vuur</button>
<button onclick="startGame('lightning')">⚡ Bliksem</button>
</div>

<div id="hud">
<div>Hits: <span id="hp">0</span> / 3</div>
<div>Gedood: <span id="kills">0</span></div>
<div>Munten: <span id="coins">0</span></div>
</div>

<div id="gameOver" style="display:none">
<h1 id="endText"></h1>
<button onclick="location.reload()">Opnieuw spelen</button>
</div>

<div id="shopMenu">
<div style="position:absolute;right:10px;top:10px;cursor:pointer;font-size:20px" onclick="closeShop()">✖</div>
<h2>SHOP</h2>
<button onclick="buySkin('red',10)">Rode skin - 10 munten</button>
<button onclick="buySkin('blue',10)">Blauwe skin - 10 munten</button>
<button onclick="buySkin('gold',20)">Gouden skin - 20 munten</button>
</div>

<div id="chatBox">
<div id="messages"></div>
<input id="chatInput" placeholder="Typ bericht...">
</div>

<iframe width="0" height="0" src="https://www.youtube.com/embed/7MeRV4YxjOM?autoplay=1&loop=1&playlist=7MeRV4YxjOM&controls=0" frameborder="0" allow="autoplay"></iframe>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<script>
// --- STATS ---
let gamesPlayed = parseInt(localStorage.getItem("played")) || 0;
let gamesWon = parseInt(localStorage.getItem("won")) || 0;
let totalCoins = parseInt(localStorage.getItem("coins")) || 0;
document.getElementById("played").innerText = gamesPlayed;
document.getElementById("won").innerText = gamesWon;
document.getElementById("coinsTotal").innerText = totalCoins;

// --- VARIABLES ---
let difficulty="easy", powerType="ice";
let scene,camera,renderer,player;
let enemies=[],bullets=[],enemyBullets=[],coinObjects=[],healthPacks=[];
let keys={},yaw=0,hits=0,kills=0,coins=0;
let gameActive=false,shootTimer=0,aPressed=false,abilityCooldown=0;
let ownedSkins = JSON.parse(localStorage.getItem("skins"))||["default"];
let currentSkin="default";
let playerName="";
let socket,otherPlayers={};

// --- NAME VERIFICATION ---
const allowedNames = ["josse","max","thibuat","warre","staf","william","sep","jasper","maria","marc","jean","michel","luc","marie","patrick","jan","philippe","paul","nathalie","joseph","monique","pierre","roger","willy","anne","dirk","eric","peter","johan","daniel","jacques","robert","marcel","alain","isabelle","christine","nicole","jozef","guy","christiane","bart","jacqueline","rita","andre","elisabeth","christian","ann","dominique","thomas","david","chantal","carine","olivier","christophe","frans","geert","eddy","georges","anna","pascal","annie","patricia","catherine","caroline","marleen","bernard","hilde","thierry","yves","wim","nadine","louis","ingrid","brigitte","liliane","vincent","henri","sophie","jeannine","nancy","frank","linda","albert","freddy","sabine","laurent","claude","steven","koen","denise","nicolas","guido","francis","sandra","myriam","danny","godelieve","francine","veronique","katrien","julien","etienne","fabienne","didier","michael","walter","cindy","sylvie","bruno","rene","annick","serge","roland","jeanne","sofie","julie","rudy","claudine","gilbert","sarah","filip","herman","erik","kris","paula","raymond","yvonne","maurice","inge","agnes","christel","suzanne","pascale","els","tom","lieve","karine","benoit","leo","charlotte","arnaud","mathilde","axel","helene","joel","evelyne","dany","therese","camille","emilie","laurent","sebastien","aline","didier","celine","frederic","aurelie","quentin","manon","jonathan","kevin","deborah","melissa","gregory","vanessa","gaetan","laetitia","olivier","kim","bjorn","anja","tine","femke","jelle","glenn","niels","robbe","lotte","emma","louise","olivia","noah","liam","arthur","mila","lina","nora","alice","louis","jules","victor","adam","lucas","elias","finn","leon","matteo","oscar"];

function setName(){
    let input = document.getElementById("nameInput").value.toLowerCase();
    if(!allowedNames.includes(input)){document.getElementById("nameError").innerText="Naam niet toegestaan!";return;}
    playerName = input;
    document.getElementById("nameMenu").style.display="none";
    document.getElementById("difficultyMenu").style.display="block";
}

// --- SHOP ---
document.getElementById("shopButton").onclick = () => shopMenu.style.display="block";
function closeShop(){ shopMenu.style.display="none"; }
function buySkin(color,cost){
    if(totalCoins<cost){alert("Niet genoeg munten");return;}
    totalCoins-=cost;
    document.getElementById("coinsTotal").innerText=totalCoins;
    localStorage.setItem("coins",totalCoins);
    ownedSkins.push(color);
    localStorage.setItem("skins",JSON.stringify(ownedSkins));
    currentSkin=color;
    alert("Skin gekocht!");
}

// --- MENU ---
function chooseDifficulty(mode){difficulty=mode;difficultyMenu.style.display="none";characterMenu.style.display="block";}

// --- MULTIPLAYER CONNECT ---
function connectMultiplayer(){
    socket = io("http://localhost:3000");
    socket.emit("join", playerName);
    socket.on("players", data => {updatePlayers(data);});
    socket.on("chat", msg => {addChat(msg);});
}
document.getElementById("chatInput").addEventListener("keydown", e=>{
    if(e.key==="Enter"){let msg=playerName+": "+e.target.value;socket.emit("chat",msg);e.target.value="";}
});
function addChat(msg){let div=document.createElement("div");div.innerText=msg;document.getElementById("messages").appendChild(div);document.getElementById("messages").scrollTop=document.getElementById("messages").scrollHeight;}
function updatePlayers(data){
    for(let id in data){
        if(id===socket.id) continue;
        if(!otherPlayers[id]){
            let mesh=new THREE.Mesh(new THREE.BoxGeometry(8,12,8),new THREE.MeshBasicMaterial({color:0xff00ff}));
            scene.add(mesh);
            otherPlayers[id]=mesh;
        }
        otherPlayers[id].position.x=data[id].x;
        otherPlayers[id].position.z=data[id].z;
    }
}

// --- START GAME ---
function startGame(type){
    powerType=type;gamesPlayed++;localStorage.setItem("played",gamesPlayed);document.getElementById("played").innerText=gamesPlayed;
    characterMenu.style.display="none";hud.style.display="block";gameActive=true;
    connectMultiplayer();

    scene=new THREE.Scene();
    camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,2000);
    renderer=new THREE.WebGLRenderer();renderer.setSize(window.innerWidth,window.innerHeight);
    document.body.appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff,1));

    let sea=new THREE.Mesh(new THREE.CircleGeometry(2000,64),new THREE.MeshBasicMaterial({color:0x1e90ff}));
    sea.rotation.x=-Math.PI/2;scene.add(sea);
    let island=new THREE.Mesh(new THREE.CircleGeometry(600,64),new THREE.MeshBasicMaterial({color:0x228B22}));
    island.rotation.x=-Math.PI/2;island.position.y=0.1;scene.add(island);

    for(let i=0;i<25;i++){let trunk=new THREE.Mesh(new THREE.CylinderGeometry(2,2,20),new THREE.MeshBasicMaterial({color:0x8b4513}));let leaves=new THREE.Mesh(new THREE.ConeGeometry(10,25,8),new THREE.MeshBasicMaterial({color:0x228B22}));trunk.position.set((Math.random()-0.5)*900,10,(Math.random()-0.5)*900);leaves.position.set(trunk.position.x,25,trunk.position.z);scene.add(trunk);scene.add(leaves);}
    for(let i=0;i<15;i++){let rock=new THREE.Mesh(new THREE.DodecahedronGeometry(15),new THREE.MeshBasicMaterial({color:0x777777}));rock.position.set((Math.random()-0.5)*900,8,(Math.random()-0.5)*900);scene.add(rock);}

    let color=0x00ffff;if(currentSkin==="red") color=0xff0000;if(currentSkin==="blue") color=0x0066ff;if(currentSkin==="gold") color=0xffcc00;
    player=new THREE.Mesh(new THREE.BoxGeometry(8,12,8),new THREE.MeshBasicMaterial({color:color}));player.position.y=6;scene.add(player);

    let botCount=5;if(difficulty==="hard") botCount=10;if(difficulty==="impossible") botCount=18;
    for(let i=0;i<botCount;i++){let bot=new THREE.Mesh(new THREE.BoxGeometry(8,12,8),new THREE.MeshBasicMaterial({color:0xffffff}));bot.position.set((Math.random()-0.5)*500,6,(Math.random()-0.5)*500);bot.userData.moveDir=new THREE.Vector3(Math.random()-0.5,0,Math.random()-0.5).normalize();bot.userData.freeze=0;bot.userData.noShoot=0;bot.userData.permaFreeze=false;scene.add(bot);enemies.push(bot);}

    let coinCount=5;if(difficulty==="hard") coinCount=7;if(difficulty==="impossible") coinCount=10;
    for(let i=0;i<coinCount;i++){let coin=new THREE.Mesh(new THREE.CylinderGeometry(4,4,2,16),new THREE.MeshBasicMaterial({color:0xffff00}));coin.rotation.x=Math.PI/2;coin.position.set((Math.random()-0.5)*500,6,(Math.random()-0.5)*500);scene.add(coin);coinObjects.push(coin);}

    for(let i=0;i<3;i++){let hp=new THREE.Mesh(new THREE.BoxGeometry(6,6,6),new THREE.MeshBasicMaterial({color:0xff00ff}));hp.position.set((Math.random()-0.5)*500,6,(Math.random()-0.5)*500);scene.add(hp);healthPacks.push(hp);}

    document.addEventListener("keydown", e=>{keys[e.key.toLowerCase()]=true;if(e.code==="Space") shoot();if(e.key.toLowerCase()==="a") aPressed=true;if(e.key.toLowerCase()==="m") keys["m"]=true;if(e.key.toLowerCase()==="e") useAbility();});
    document.addEventListener("keyup", e=>{keys[e.key.toLowerCase()]=false;if(e.key.toLowerCase()==="a") aPressed=false;if(e.key.toLowerCase()==="m") keys["m"]=false;});
    document.addEventListener("click", shoot);
    document.addEventListener("mousemove", e=>{yaw-=e.movementX*0.002;});
    animate();
}

// --- GAME FUNCTIONS ---
function explode(pos){let boom=new THREE.Mesh(new THREE.SphereGeometry(6),new THREE.MeshBasicMaterial({color:0xff6600}));boom.position.copy(pos);scene.add(boom);setTimeout(()=>{scene.remove(boom)},300);}
function shoot(){let bullet=new THREE.Mesh(new THREE.SphereGeometry(2),new THREE.MeshBasicMaterial({color:0xffffff}));bullet.position.copy(player.position);bullet.userData.dir=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));scene.add(bullet);bullets.push(bullet);}
function shootBot(bot){let dir=player.position.clone().sub(bot.position).normalize();let bullet=new THREE.Mesh(new THREE.SphereGeometry(2),new THREE.MeshBasicMaterial({color:0xff0000}));bullet.position.copy(bot.position);bullet.userData.dir=dir;scene.add(bullet);enemyBullets.push(bullet);}
function useAbility(){if(abilityCooldown>0)return;abilityCooldown=300;for(let i=enemies.length-1;i>=0;i--){if(player.position.distanceTo(enemies[i].position)<80){scene.remove(enemies[i]);enemies.splice(i,1);kills++;document.getElementById("kills").innerText=kills;}}}
function endGame(text){gameActive=false;document.getElementById("endText").innerText=text;gameOver.style.display="block";}

// --- ANIMATE ---
function animate(){
requestAnimationFrame(animate);
if(!gameActive) return;
let speed = keys["m"]?8:4;
if(keys["arrowup"]||keys["z"]) player.position.z-=speed;
if(keys["arrowdown"]||keys["s"]) player.position.z+=speed;
if(keys["arrowleft"]||keys["q"]) player.position.x-=speed;
if(keys["arrowright"]||keys["d"]) player.position.x+=speed;

// Coins
for(let i=coinObjects.length-1;i>=0;i--){if(player.position.distanceTo(coinObjects[i].position)<10){scene.remove(coinObjects[i]);coinObjects.splice(i,1);coins++;document.getElementById("coins").innerText=coins;}}

// Health
for(let i=healthPacks.length-1;i>=0;i--){if(player.position.distanceTo(healthPacks[i].position)<10){scene.remove(healthPacks[i]);healthPacks.splice(i,1);if(hits>0){hits--;document.getElementById("hp").innerText=hits;}}}

// Player bullets
for(let i=bullets.length-1;i>=0;i--){bullets[i].position.add(bullets[i].userData.dir.clone().multiplyScalar(10));for(let j=enemies.length-1;j>=0;j--){if(bullets[i].position.distanceTo(enemies[j].position)<8){explode(enemies[j].position);if(aPressed){if(powerType==="ice") enemies[j].userData.freeze=180;if(powerType==="fire") enemies[j].userData.noShoot=360;if(powerType==="lightning") enemies[j].userData.permaFreeze=true;}scene.remove(enemies[j]);enemies.splice(j,1);kills++;document.getElementById("kills").innerText=kills;scene.remove(bullets[i]);bullets.splice(i,1);if(enemies.length===0){gamesWon++;localStorage.setItem("won",gamesWon);totalCoins+=coins;localStorage.setItem("coins",totalCoins);endGame("GEWONNEN!");}break;}}}

// Bots
for(let bot of
