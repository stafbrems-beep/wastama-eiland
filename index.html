<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WASTAMA EILAND</title>

<style>
body{margin:0;overflow:hidden;background:black;font-family:Arial;color:white;}

#difficultyMenu,#characterMenu,#gameOver{
position:absolute;
top:40%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

#characterMenu{display:none;}

#hud{
position:absolute;
top:60px;
left:20px;
display:none;
}

#stats{
position:absolute;
top:10px;
left:20px;
}

#shopButton{
position:absolute;
top:10px;
right:20px;
background:#444;
padding:10px;
cursor:pointer;
}

#shopMenu{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:650px;
height:500px;
background:#111;
border:3px solid white;
padding:20px;
overflow:auto;
}

button{
padding:12px;
margin:5px;
font-size:16px;
cursor:pointer;
}
</style>
</head>

<body>

<div id="stats">
<div>Games gespeeld: <span id="played">0</span></div>
<div>Games gewonnen: <span id="won">0</span></div>
<div>Munten totaal: <span id="coinsTotal">0</span></div>
</div>

<div id="shopButton">SHOP</div>

<div id="difficultyMenu">
<h1>Kies moeilijkheid</h1>
<button onclick="chooseDifficulty('easy')">🙂 Makkelijk</button>
<button onclick="chooseDifficulty('hard')">😈 Moeilijk</button>
<button onclick="chooseDifficulty('impossible')">💀 Impossible</button>
</div>

<div id="characterMenu">
<h1>Kies je power</h1>
<button onclick="startGame('ice')">❄ IJs</button>
<button onclick="startGame('fire')">🔥 Vuur</button>
<button onclick="startGame('lightning')">⚡ Bliksem</button>
</div>

<div id="hud">
<div>Hits: <span id="hp">0</span> / 3</div>
<div>Gedood: <span id="kills">0</span></div>
<div>Munten: <span id="coins">0</span></div>
</div>

<div id="gameOver" style="display:none">
<h1 id="endText"></h1>
<button onclick="location.reload()">Opnieuw spelen</button>
</div>

<div id="shopMenu">
<div style="position:absolute;right:10px;top:10px;cursor:pointer;font-size:20px"
onclick="closeShop()">✖</div>

<h2>SHOP</h2>
<div id="skinButtons"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

let gamesPlayed=parseInt(localStorage.getItem("played"))||0
let gamesWon=parseInt(localStorage.getItem("won"))||0
let totalCoins=parseInt(localStorage.getItem("coins"))||0

played.innerText=gamesPlayed
won.innerText=gamesWon
coinsTotal.innerText=totalCoins

let ownedSkins=JSON.parse(localStorage.getItem("skins"))||["default"]
let currentSkin=localStorage.getItem("currentSkin")||"default"

let skinsData=[

{name:"Default blok",id:"default",geom:"box",color:0x00ffff,cost:0},

{name:"Rode kubus",id:"red",geom:"box",color:0xff0000,cost:10},

{name:"Blauwe cilinder",id:"blue",geom:"cylinder",color:0x0066ff,cost:10},

{name:"Gouden kegel",id:"gold",geom:"cone",color:0xffcc00,cost:20},

{name:"Paarse bol",id:"purple",geom:"sphere",color:0x800080,cost:15},

{name:"Neon ster",id:"star",geom:"ico",color:0x00ffea,cost:25},

{name:"Diamant",id:"diamond",geom:"oct",color:0x00ffff,cost:40},

{name:"Kristal",id:"crystal",geom:"tetra",color:0x66ffff,cost:50},

{name:"Kroon",id:"crown",geom:"torus",color:0xffdd00,cost:80},

{name:"Alien",id:"alien",geom:"dodeca",color:0x00ff00,cost:120},

{name:"Super ster",id:"superstar",geom:"ico",color:0xffff00,cost:200}

]

function updateShop(){

let container=document.getElementById("skinButtons")
container.innerHTML=""

for(let s of skinsData){

let btn=document.createElement("button")

if(!ownedSkins.includes(s.id) && s.cost>0){

btn.innerText=s.name+" - "+s.cost+" munten"
btn.onclick=()=>buySkin(s.id,s.cost)

}else{

btn.innerText="Gebruik "+s.name
btn.onclick=()=>{
currentSkin=s.id
localStorage.setItem("currentSkin",s.id)
alert(s.name+" geselecteerd!")
}

}

container.appendChild(btn)

}

}

updateShop()

shopButton.onclick=function(){shopMenu.style.display="block"}

function closeShop(){shopMenu.style.display="none"}

function buySkin(id,cost){

if(totalCoins<cost){
alert("Niet genoeg munten")
return
}

totalCoins-=cost
coinsTotal.innerText=totalCoins
localStorage.setItem("coins",totalCoins)

ownedSkins.push(id)
localStorage.setItem("skins",JSON.stringify(ownedSkins))

currentSkin=id
localStorage.setItem("currentSkin",id)

alert("Skin gekocht!")

updateShop()

}

let difficulty="easy"
let powerType="ice"

let scene,camera,renderer,player
let enemies=[],bullets=[],enemyBullets=[]
let coinObjects=[]

let keys={}
let yaw=0
let hits=0
let kills=0
let coins=0
let gameActive=false

function chooseDifficulty(mode){
difficulty=mode
difficultyMenu.style.display="none"
characterMenu.style.display="block"
}

function startGame(type){

powerType=type

gamesPlayed++
localStorage.setItem("played",gamesPlayed)
played.innerText=gamesPlayed

characterMenu.style.display="none"
hud.style.display="block"

gameActive=true

scene=new THREE.Scene()

camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,2000)

renderer=new THREE.WebGLRenderer()
renderer.setSize(window.innerWidth,window.innerHeight)
document.body.appendChild(renderer.domElement)

scene.add(new THREE.AmbientLight(0xffffff,1))

let sea=new THREE.Mesh(
new THREE.CircleGeometry(2000,64),
new THREE.MeshBasicMaterial({color:0x1e90ff})
)

sea.rotation.x=-Math.PI/2
scene.add(sea)

let island=new THREE.Mesh(
new THREE.CircleGeometry(600,64),
new THREE.MeshBasicMaterial({color:0x228B22})
)

island.rotation.x=-Math.PI/2
island.position.y=0.1
scene.add(island)

let s=skinsData.find(x=>x.id===currentSkin)

let geom

switch(s.geom){

case "box": geom=new THREE.BoxGeometry(8,12,8);break
case "cylinder": geom=new THREE.CylinderGeometry(6,6,12,16);break
case "cone": geom=new THREE.ConeGeometry(8,16,16);break
case "sphere": geom=new THREE.SphereGeometry(7,16,16);break
case "ico": geom=new THREE.IcosahedronGeometry(8);break
case "oct": geom=new THREE.OctahedronGeometry(8);break
case "tetra": geom=new THREE.TetrahedronGeometry(8);break
case "torus": geom=new THREE.TorusGeometry(6,2,16,100);break
case "dodeca": geom=new THREE.DodecahedronGeometry(8);break

}

player=new THREE.Mesh(
geom,
new THREE.MeshBasicMaterial({color:s.color})
)

player.position.y=6
scene.add(player)

animate()

}

function animate(){

requestAnimationFrame(animate)

if(!gameActive)return

renderer.render(scene,camera)

}

</script>

</body>
</html>
