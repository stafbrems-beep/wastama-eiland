<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijn 2D Platform Game</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,sans-serif;
}
canvas{
    display:block;
    margin:auto;
    background:#87ceeb;
}
#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:24px;
    font-weight:bold;
}
</style>
</head>
<body>

<div id="ui">Level: 1 | Coins: 0</div>
<canvas id="game" width="1000" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const ui = document.getElementById("ui");

const gravity = 0.7;

const player = {
    x:50,
    y:100,
    w:40,
    h:50,
    dx:0,
    dy:0,
    speed:5,
    jump:-14,
    grounded:false
};

const keys = {};

document.addEventListener("keydown",e=>{
    keys[e.key]=true;
});

document.addEventListener("keyup",e=>{
    keys[e.key]=false;
});

let levelIndex = 0;
let score = 0;

const levels = [
{
platforms:[
{x:0,y:450,w:1000,h:50},
{x:200,y:350,w:200,h:20},
{x:500,y:300,w:200,h:20}
],
coins:[
{x:250,y:300},
{x:550,y:250},
{x:650,y:250}
]
},
{
platforms:[
{x:0,y:450,w:1000,h:50},
{x:150,y:380,w:120,h:20},
{x:350,y:320,w:120,h:20},
{x:550,y:260,w:120,h:20}
],
coins:[
{x:180,y:330},
{x:380,y:270},
{x:580,y:210}
]
},
{
platforms:[
{x:0,y:450,w:1000,h:50},
{x:250,y:380,w:150,h:20},
{x:500,y:310,w:150,h:20},
{x:750,y:240,w:150,h:20}
],
coins:[
{x:280,y:330},
{x:530,y:260},
{x:780,y:190}
]
},
{
platforms:[
{x:0,y:450,w:1000,h:50},
{x:100,y:300,w:150,h:20},
{x:350,y:250,w:150,h:20},
{x:600,y:200,w:150,h:20}
],
coins:[
{x:150,y:250},
{x:400,y:200},
{x:650,y:150}
]
},
{
platforms:[
{x:0,y:450,w:1000,h:50},
{x:180,y:350,w:180,h:20},
{x:450,y:280,w:180,h:20},
{x:720,y:210,w:180,h:20}
],
coins:[
{x:230,y:300},
{x:500,y:230},
{x:770,y:160}
]
},
{
platforms:[
{x:0,y:450,w:1000,h:50},
{x:120,y:340,w:120,h:20},
{x:320,y:290,w:120,h:20},
{x:520,y:240,w:120,h:20},
{x:720,y:190,w:120,h:20}
],
coins:[
{x:150,y:290},
{x:350,y:240},
{x:550,y:190},
{x:750,y:140}
]
},
{
platforms:[
{x:0,y:450,w:1000,h:50},
{x:250,y:350,w:150,h:20},
{x:500,y:250,w:150,h:20},
{x:750,y:150,w:150,h:20}
],
coins:[
{x:280,y:300},
{x:530,y:200},
{x:780,y:100}
]
}
];

function resetPlayer(){
    player.x = 50;
    player.y = 100;
    player.dx = 0;
    player.dy = 0;
}

function update(){

    if(keys["ArrowLeft"] || keys["a"])
        player.dx = -player.speed;
    else if(keys["ArrowRight"] || keys["d"])
        player.dx = player.speed;
    else
        player.dx = 0;

    if((keys["ArrowUp"] || keys["w"] || keys[" "]) && player.grounded){
        player.dy = player.jump;
        player.grounded = false;
    }

    player.dy += gravity;
    player.x += player.dx;
    player.y += player.dy;

    player.grounded = false;

    const level = levels[levelIndex];

    level.platforms.forEach(p=>{

        if(
            player.x < p.x+p.w &&
            player.x+player.w > p.x &&
            player.y < p.y+p.h &&
            player.y+player.h > p.y
        ){

            if(player.dy > 0){
                player.y = p.y-player.h;
                player.dy = 0;
                player.grounded = true;
            }
        }
    });

    level.coins = level.coins.filter(c=>{

        const hit =
            player.x < c.x+20 &&
            player.x+player.w > c.x &&
            player.y < c.y+20 &&
            player.y+player.h > c.y;

        if(hit){
            score++;
            return false;
        }
        return true;
    });

    if(level.coins.length === 0){

        levelIndex++;

        if(levelIndex >= levels.length){
            alert("Gefeliciteerd! Je hebt alle 7 levels uitgespeeld!");
            location.reload();
        }else{
            alert("Level " + levelIndex + " voltooid!");
            resetPlayer();
        }
    }

    if(player.y > canvas.height){
        resetPlayer();
    }

    ui.innerText =
      "Level: " + (levelIndex+1) +
      " | Coins: " + score;
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const level = levels[levelIndex];

    level.platforms.forEach(p=>{
        ctx.fillStyle = "#2e8b57";
        ctx.fillRect(p.x,p.y,p.w,p.h);
    });

    level.coins.forEach(c=>{
        ctx.fillStyle = "gold";
        ctx.beginPath();
        ctx.arc(c.x+10,c.y+10,10,0,Math.PI*2);
        ctx.fill();
    });

    ctx.fillStyle = "red";
    ctx.fillRect(player.x,player.y,player.w,player.h);
}

function gameLoop(){
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
