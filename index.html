<script>

let gamesPlayed=parseInt(localStorage.getItem("played"))||0
let gamesWon=parseInt(localStorage.getItem("won"))||0
let totalCoins=parseInt(localStorage.getItem("coins"))||0

played.innerText=gamesPlayed
won.innerText=gamesWon
coinsTotal.innerText=totalCoins

let difficulty="easy"
let powerType="ice"

let scene,camera,renderer,player
let enemies=[],bullets=[],enemyBullets=[]
let coinObjects=[]
let healthPacks=[]

let keys={}
let yaw=0
let hits=0
let kills=0
let coins=0
let gameActive=false

let shootTimer=0
let shootIndex=0
let aPressed=false

let abilityCooldown=0

let ownedSkins=JSON.parse(localStorage.getItem("skins"))||["default"]
let currentSkin="default"

/* SHOP */

shopButton.onclick=()=>shopMenu.style.display="block"

function closeShop(){
shopMenu.style.display="none"
}

function buySkin(color,cost){

if(totalCoins<cost){
alert("Niet genoeg munten")
return
}

totalCoins-=cost
coinsTotal.innerText=totalCoins
localStorage.setItem("coins",totalCoins)

ownedSkins.push(color)
localStorage.setItem("skins",JSON.stringify(ownedSkins))

currentSkin=color
alert("Skin gekocht!")
}

function selectSkin(color){

if(!ownedSkins.includes(color)){
alert("Niet gekocht!")
return
}

currentSkin=color
alert("Skin geselecteerd!")
}

/* GAME START */

function chooseDifficulty(mode){
difficulty=mode
difficultyMenu.style.display="none"
characterMenu.style.display="block"
}

function startGame(type){

powerType=type

gamesPlayed++
localStorage.setItem("played",gamesPlayed)
played.innerText=gamesPlayed

characterMenu.style.display="none"
hud.style.display="block"

gameActive=true

scene=new THREE.Scene()

camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,2000)

renderer=new THREE.WebGLRenderer()
renderer.setSize(window.innerWidth,window.innerHeight)
document.body.appendChild(renderer.domElement)

let light=new THREE.AmbientLight(0xffffff,1)
scene.add(light)

/* MAP */

let sea=new THREE.Mesh(
new THREE.CircleGeometry(2000,64),
new THREE.MeshBasicMaterial({color:0x1e90ff})
)
sea.rotation.x=-Math.PI/2
scene.add(sea)

let island=new THREE.Mesh(
new THREE.CircleGeometry(600,64),
new THREE.MeshBasicMaterial({color:0x228B22})
)
island.rotation.x=-Math.PI/2
island.position.y=0.1
scene.add(island)

/* PLAYER */

let color=0x00ffff
if(currentSkin==="red")color=0xff0000
if(currentSkin==="blue")color=0x0066ff
if(currentSkin==="gold")color=0xffcc00

player=new THREE.Mesh(
new THREE.BoxGeometry(8,12,8),
new THREE.MeshBasicMaterial({color:color})
)

player.position.y=6
scene.add(player)

/* ENEMIES */

let botCount=5
if(difficulty==="hard")botCount=10
if(difficulty==="impossible")botCount=18

for(let i=0;i<botCount;i++){

let bot=new THREE.Mesh(
new THREE.BoxGeometry(8,12,8),
new THREE.MeshBasicMaterial({color:0xffffff})
)

bot.position.set((Math.random()-0.5)*500,6,(Math.random()-0.5)*500)

bot.userData.freeze=0
bot.userData.noShoot=0
bot.userData.permaFreeze=false

scene.add(bot)
enemies.push(bot)
}

/* COINS */

for(let i=0;i<5;i++){

let coin=new THREE.Mesh(
new THREE.CylinderGeometry(4,4,2,16),
new THREE.MeshBasicMaterial({color:0xffff00})
)

coin.rotation.x=Math.PI/2
coin.position.set((Math.random()-0.5)*500,6,(Math.random()-0.5)*500)

scene.add(coin)
coinObjects.push(coin)
}

/* HEALTH PACKS */

for(let i=0;i<3;i++){

let hpPack=new THREE.Mesh(
new THREE.BoxGeometry(6,6,6),
new THREE.MeshBasicMaterial({color:0xff00ff})
)

hpPack.position.set((Math.random()-0.5)*500,6,(Math.random()-0.5)*500)

scene.add(hpPack)
healthPacks.push(hpPack)
}

/* CONTROLS */

document.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true
if(e.code==="Space")shoot()
if(e.key==="a")aPressed=true
if(e.key==="e")useAbility()
})

document.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false
if(e.key==="a")aPressed=false
})

document.addEventListener("click",shoot)

document.addEventListener("mousemove",e=>{
yaw-=e.movementX*0.002
})

animate()
}

/* SHOOT */

function shoot(){

let bullet=new THREE.Mesh(
new THREE.SphereGeometry(2),
new THREE.MeshBasicMaterial({color:0xffffff})
)

bullet.position.copy(player.position)
bullet.userData.dir=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw))

scene.add(bullet)
bullets.push(bullet)
}

/* ABILITY */

function useAbility(){

if(abilityCooldown>0) return
abilityCooldown=300

for(let bot of enemies){

if(player.position.distanceTo(bot.position)<80){

scene.remove(bot)
kills++

}

}

kills.innerText=kills
}

/* ANIMATE */

function animate(){

requestAnimationFrame(animate)
if(!gameActive)return

/* SPEED MET M */
let speed = keys["m"] ? 8 : 4

if(keys["arrowup"]||keys["z"])player.position.z-=speed
if(keys["arrowdown"]||keys["s"])player.position.z+=speed
if(keys["arrowleft"]||keys["q"])player.position.x-=speed
if(keys["arrowright"]||keys["d"])player.position.x+=speed

/* COINS */

for(let i=coinObjects.length-1;i>=0;i--){
let c=coinObjects[i]
if(player.position.distanceTo(c.position)<10){
scene.remove(c)
coinObjects.splice(i,1)
coins++
document.getElementById("coins").innerText=coins
}
}

/* HEALTH */

for(let i=healthPacks.length-1;i>=0;i--){
let h=healthPacks[i]
if(player.position.distanceTo(h.position)<10){
scene.remove(h)
healthPacks.splice(i,1)
if(hits>0){
hits--
hp.innerText=hits
}
}
}

/* BULLETS */

for(let i=bullets.length-1;i>=0;i--){
let b=bullets[i]
b.position.add(b.userData.dir.clone().multiplyScalar(10))

for(let j=enemies.length-1;j>=0;j--){
let bot=enemies[j]

if(b.position.distanceTo(bot.position)<8){

scene.remove(bot)
enemies.splice(j,1)

kills++
document.getElementById("kills").innerText=kills

scene.remove(b)
bullets.splice(i,1)

if(enemies.length===0){
endGame("GEWONNEN!")
}

break
}
}
}

/* ENEMY AI (FOLLOW PLAYER) */

for(let bot of enemies){

let dir=player.position.clone().sub(bot.position).normalize()
bot.position.add(dir.multiplyScalar(0.6))
}

/* CAMERA */

camera.position.x=player.position.x-Math.sin(yaw)*40
camera.position.z=player.position.z+Math.cos(yaw)*40
camera.position.y=25

camera.lookAt(player.position)

renderer.render(scene,camera)

if(abilityCooldown>0) abilityCooldown--
}

/* END */

function endGame(text){
gameActive=false
endText.innerText=text
gameOver.style.display="block"
}

</script>
