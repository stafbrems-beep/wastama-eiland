<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WASTAMA EILAND</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:Arial;
  color:white;
}

#difficultyMenu,#characterMenu,#gameOver,#gamesMenu,#usernameMenu{
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

#characterMenu,#gamesMenu{display:none;}

#usernameMenu{
  background:#111;
  padding:30px;
  border:3px solid white;
}

#hud{
  position:absolute;
  top:60px;
  left:20px;
  display:none;
}

#stats{
  position:absolute;
  top:10px;
  left:20px;
}

#usernameDisplay{
  position:absolute;
  top:10px;
  left:200px;
  font-weight:bold;
}

#shopButton,#gamesButton{
  position:absolute;
  top:10px;
  right:20px;
  background:#444;
  padding:10px;
  cursor:pointer;
  margin-top:5px;
}

#gamesButton{top:50px;}

#shopMenu,#gamesMenu{
  display:none;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:600px;
  height:400px;
  background:#111;
  border:3px solid white;
  padding:20px;
}

button{
  padding:12px;
  margin:5px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- USERNAME -->
<div id="usernameMenu">
  <h2>Wat is je gebruikersnaam?</h2>
  <input id="usernameInput" placeholder="Naam (geen cijfers)">
  <br><br>
  <button onclick="setUsername()">Start</button>
</div>

<div id="usernameDisplay"></div>

<!-- STATS -->
<div id="stats">
  <div>Games gespeeld: <span id="played">0</span></div>
  <div>Games gewonnen: <span id="won">0</span></div>
  <div>Munten totaal: <span id="coinsTotal">0</span></div>
</div>

<div id="shopButton">SHOP</div>
<div id="gamesButton">SAMEN SPELLEN</div>

<div id="difficultyMenu">
  <h1>Kies moeilijkheid</h1>
  <button onclick="chooseDifficulty('easy')">🙂 Makkelijk</button>
  <button onclick="chooseDifficulty('hard')">😈 Moeilijk</button>
  <button onclick="chooseDifficulty('impossible')">💀 Impossible</button>
</div>

<div id="characterMenu">
  <h1>Kies je mannetje</h1>
  <button onclick="startGame('ice')">❄ IJs</button>
  <button onclick="startGame('fire')">🔥 Vuur</button>
  <button onclick="startGame('lightning')">⚡ Bliksem</button>
</div>

<div id="hud">
  <div>Hits: <span id="hp">0</span> / 3</div>
  <div>Gedood: <span id="kills">0</span></div>
  <div>Munten: <span id="coins">0</span></div>
</div>

<div id="gameOver" style="display:none">
  <h1 id="endText"></h1>
  <button onclick="location.reload()">Opnieuw spelen</button>
</div>

<!-- SHOP -->
<div id="shopMenu">
  <div onclick="closeShop()" style="position:absolute;right:10px;top:10px;cursor:pointer">✖</div>
  <h2>SHOP</h2>

  <!-- OUDE -->
  <button onclick="buySkin('red',10)">Rode skin - 10</button>
  <button onclick="buySkin('blue',10)">Blauwe skin - 10</button>
  <button onclick="buySkin('gold',20)">Gouden skin - 20</button>

  <!-- NIEUWE -->
  <button onclick="buySkin('ball',40)">Blauwe bol - 40</button>
  <button onclick="buySkin('triangle',30)">Groene driehoek - 30</button>
  <button onclick="buySkin('rainbow',60)">Rainbow blok - 60</button>
</div>

<!-- SAMEN -->
<div id="gamesMenu">
  <div onclick="closeGamesMenu()" style="position:absolute;right:10px;top:10px;cursor:pointer">✖</div>
  <h2>SAMEN SPELLEN</h2>
  <p>hier komen straks nieuwe game opties</p>
</div>

<!-- NIEUWE MUZIEK -->
<iframe width="0" height="0"
src="https://www.youtube.com/embed/TddO_JZ-RDo?autoplay=1&loop=1&playlist=TddO_JZ-RDo"
frameborder="0" allow="autoplay"></iframe>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// USERNAME
function setUsername(){
  let name = document.getElementById("usernameInput").value;

  if(!name || /\d/.test(name)){
    alert("Geen cijfers toegestaan!");
    return;
  }

  document.getElementById("usernameDisplay").innerText = name;
  document.getElementById("usernameMenu").style.display="none";
}

// STATS
let gamesPlayed = parseInt(localStorage.getItem("played")) || 0;
let gamesWon = parseInt(localStorage.getItem("won")) || 0;
let totalCoins = parseInt(localStorage.getItem("coins")) || 0;

played.innerText = gamesPlayed;
won.innerText = gamesWon;
coinsTotal.innerText = totalCoins;

// VARIABLES
let difficulty="easy";
let powerType="ice";
let scene,camera,renderer,player;
let enemies=[],bullets=[],enemyBullets=[],coinObjects=[],healthPacks=[];
let keys={},yaw=0,hits=0,kills=0,coins=0,gameActive=false,shootTimer=0,aPressed=false,abilityCooldown=0;

let ownedSkins = JSON.parse(localStorage.getItem("skins"))||["default"];
let currentSkin="default";

// SHOP
shopButton.onclick=()=>shopMenu.style.display="block";
function closeShop(){shopMenu.style.display="none";}
function buySkin(color,cost){
  if(totalCoins<cost){alert("Niet genoeg");return;}
  totalCoins-=cost;
  coinsTotal.innerText=totalCoins;
  localStorage.setItem("coins",totalCoins);
  currentSkin=color;
}

// SAMEN
gamesButton.onclick=()=>gamesMenu.style.display="block";
function closeGamesMenu(){gamesMenu.style.display="none";}

// MENU
function chooseDifficulty(mode){
  difficulty=mode;
  difficultyMenu.style.display="none";
  characterMenu.style.display="block";
}

// START GAME
function startGame(type){
powerType=type;
gamesPlayed++; localStorage.setItem("played",gamesPlayed);
played.innerText=gamesPlayed;

characterMenu.style.display="none";
hud.style.display="block";
gameActive=true;

scene=new THREE.Scene();
camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,2000);
renderer=new THREE.WebGLRenderer();
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,1));

// PLAYER SHAPE SYSTEM
if(currentSkin==="ball"){
  player=new THREE.Mesh(new THREE.SphereGeometry(6), new THREE.MeshBasicMaterial({color:0x0066ff}));
}
else if(currentSkin==="triangle"){
  player=new THREE.Mesh(new THREE.ConeGeometry(6,12,3), new THREE.MeshBasicMaterial({color:0x00ff00}));
}
else{
  player=new THREE.Mesh(new THREE.BoxGeometry(8,12,8), new THREE.MeshBasicMaterial({color:0xffffff}));
}

player.position.y=6;
scene.add(player);

animate();
}

// ANIMATE (zelfde gameplay)
function animate(){
requestAnimationFrame(animate);
if(!gameActive)return;

renderer.render(scene,camera);
}

</script>

</body>
</html>
