<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WASTAMA EILAND</title>
<style>
body{margin:0;overflow:hidden;background:black;font-family:Arial;color:white;}

#difficultyMenu,#gameOver{
position:absolute;top:40%;left:50%;
transform:translate(-50%,-50%);
text-align:center;
z-index:5;
}

#hud{position:absolute;top:60px;left:20px;display:none;z-index:5;}
#stats{position:absolute;top:10px;left:20px;z-index:5;}

#shopButton{
position:absolute;top:10px;right:20px;
background:#444;padding:10px;cursor:pointer;
z-index:5;
}

/* 🔥 FULLSCREEN SHOP */
#shopMenu{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
z-index:999;
padding:20px;
overflow-y:auto;
}

.skin{
background:#222;
padding:10px;
margin:10px;
border:2px solid white;
}

.active{
background:yellow;
color:black;
}

button{padding:10px;margin:5px;cursor:pointer;}
</style>
</head>
<body>

<div id="stats">
<div>Games gespeeld: <span id="played">0</span></div>
<div>Games gewonnen: <span id="won">0</span></div>
<div>Munten totaal: <span id="coinsTotal">0</span></div>
</div>

<div id="shopButton">SHOP</div>

<!-- 🔥 FULL SCREEN SHOP -->
<div id="shopMenu">
<div style="position:absolute;right:20px;top:20px;font-size:30px;cursor:pointer"
onclick="closeShop()">✖</div>

<h1>SHOP</h1>
<div id="skinsContainer"></div>
</div>

<div id="difficultyMenu">
<h1>Kies moeilijkheid</h1>
<button onclick="chooseDifficulty('easy')">🙂 Makkelijk</button>
<button onclick="chooseDifficulty('hard')">😈 Moeilijk</button>
<button onclick="chooseDifficulty('impossible')">💀 Impossible</button>
</div>

<div id="hud">
<div>Hits: <span id="hp">0</span> / 3</div>
<div>Gedood: <span id="kills">0</span></div>
<div>Munten: <span id="coins">0</span></div>
</div>

<div id="gameOver" style="display:none">
<h1 id="endText"></h1>
<button onclick="location.reload()">Opnieuw spelen</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// --- STATS ---
let gamesPlayed = parseInt(localStorage.getItem("played")) || 0;
let gamesWon = parseInt(localStorage.getItem("won")) || 0;
let totalCoins = parseInt(localStorage.getItem("coins")) || 0;

played.innerText = gamesPlayed;
won.innerText = gamesWon;
coinsTotal.innerText = totalCoins;

// --- SKINS ---
let skins = [
{name:"blue",price:5,type:"cube",color:0x0066ff},
{name:"red",price:5,type:"cube",color:0xff0000},
{name:"gold",price:10,type:"cube",color:0xffcc00},
{name:"green",price:20,type:"cylinder",color:0x00ff00},
{name:"pink",price:20,type:"cone",color:0xff00ff},
{name:"rainbow",price:30,type:"rainbow"},
{name:"rainbowCylinder",price:30,type:"rainbowCylinder"},
{name:"monster",price:40,type:"monster"}
];

let ownedSkins = JSON.parse(localStorage.getItem("ownedSkins")) || ["blue"];
let currentSkin = localStorage.getItem("currentSkin") || "blue";

// --- SHOP ---
shopButton.onclick = ()=>{
shopMenu.style.display="block";
renderShop();
};

function closeShop(){
shopMenu.style.display="none";
}

function renderShop(){
let container = document.getElementById("skinsContainer");
container.innerHTML="";

skins.forEach(s=>{
let div=document.createElement("div");
div.className="skin";

let owned = ownedSkins.includes(s.name);
let btn=document.createElement("button");

if(currentSkin===s.name){
btn.innerText="ACTIEF";
btn.className="active";
}
else if(owned){
btn.innerText="Gebruik";
btn.onclick=()=>{
currentSkin=s.name;
localStorage.setItem("currentSkin",currentSkin);
renderShop();
};
}
else{
btn.innerText="Koop ("+s.price+")";
btn.onclick=()=>{
if(totalCoins>=s.price){
totalCoins-=s.price;
coinsTotal.innerText=totalCoins;
localStorage.setItem("coins",totalCoins);
ownedSkins.push(s.name);
localStorage.setItem("ownedSkins",JSON.stringify(ownedSkins));
renderShop();
}else{
alert("Niet genoeg munten");
}
};
}

div.innerHTML="<b>"+s.name+"</b><br>";
div.appendChild(btn);
container.appendChild(div);
});
}

// --- GAME ---
let difficulty="easy";
let scene,camera,renderer,player;
let enemies=[],bullets=[],enemyBullets=[];
let keys={},yaw=0,hits=0,kills=0,coins=0,gameActive=false;
let islandRadius=600;

// 🔥 DIRECT START (geen extra menu)
function chooseDifficulty(mode){
difficulty=mode;
difficultyMenu.style.display="none";
startGame();
}

// --- START ---
function startGame(){

gamesPlayed++; 
localStorage.setItem("played",gamesPlayed);
played.innerText=gamesPlayed;

hud.style.display="block";
gameActive=true;

scene=new THREE.Scene();
camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,2000);
renderer=new THREE.WebGLRenderer();
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// eiland
let sea=new THREE.Mesh(new THREE.CircleGeometry(2000,64),
new THREE.MeshBasicMaterial({color:0x1e90ff}));
sea.rotation.x=-Math.PI/2; scene.add(sea);

let island=new THREE.Mesh(new THREE.CircleGeometry(600,64),
new THREE.MeshBasicMaterial({color:0x228B22}));
island.rotation.x=-Math.PI/2; island.position.y=0.1; scene.add(island);

// speler skin
let skin=skins.find(s=>s.name===currentSkin);
player=new THREE.Mesh(new THREE.BoxGeometry(8,12,8),
new THREE.MeshBasicMaterial({color:skin.color || 0x00ffff}));

player.position.y=6;
scene.add(player);

// controls
document.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
if(e.code==="Space") shoot();
});
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
document.addEventListener("click",shoot);

animate();
}

// shoot
function shoot(){
let b=new THREE.Mesh(new THREE.SphereGeometry(2),
new THREE.MeshBasicMaterial({color:0xffffff}));
b.position.copy(player.position);
b.userData.dir=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));
scene.add(b); bullets.push(b);
}

// loop
function animate(){
requestAnimationFrame(animate);
if(!gameActive) return;

// movement
if(keys["z"]) player.position.z-=4;
if(keys["s"]) player.position.z+=4;
if(keys["q"]) player.position.x-=4;
if(keys["d"]) player.position.x+=4;

// verdrinken
let dist=Math.sqrt(player.position.x**2+player.position.z**2);
if(dist>islandRadius){
endText.innerText="VERDRONKEN";
gameOver.style.display="block";
gameActive=false;
}

camera.position.set(player.position.x,25,player.position.z+40);
camera.lookAt(player.position);

renderer.render(scene,camera);
}
</script>

</body>
</html>
