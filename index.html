<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tygo Jungle Escape</title>

<style>
body{
margin:0;
overflow:hidden;
background:#000;
font-family:Arial;
color:white;
}

#menu{
position:absolute;
top:40%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

#hud{
position:absolute;
top:10px;
left:10px;
display:none;
}

canvas{
display:block;
background:#1b5e20;
}
button{
padding:10px;
margin:5px;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<div id="menu">
<h1>TYGO JUNGLE ESCAPE</h1>
<button onclick="startGame()">START</button>
</div>

<div id="hud">
<div>Level: <span id="level">1</span></div>
<div>Lives: <span id="lives">3</span></div>
<div>Crystals: <span id="crystals">0</span></div>
</div>

<canvas id="game" width="900" height="500"></canvas>

<script>

let canvas=document.getElementById("game")
let ctx=canvas.getContext("2d")

let player={
x:50,y:400,w:30,h:30,
vx:0,vy:0,
speed:4,
jump:10,
grounded:false
}

let keys={}

let level=1
let lives=3
let crystals=0

let platforms=[]
let enemies=[]
let goal={x:850,y:420,w:30,h:50}

document.addEventListener("keydown",e=>keys[e.key]=true)
document.addEventListener("keyup",e=>keys[e.key]=false)

function startGame(){
document.getElementById("menu").style.display="none"
document.getElementById("hud").style.display="block"
loadLevel(1)
gameLoop()
}

function loadLevel(l){

level=l
document.getElementById("level").innerText=level

player.x=50
player.y=400

platforms=[]
enemies=[]

// simpele levels
if(level==1){
platforms=[{x:0,y:470,w:900,h:30}]
enemies=[{x:400,y:440,w:30,h:30,vx:2}]
}

if(level==2){
platforms=[{x:0,y:470,w:900,h:30},{x:200,y:350,w:200,h:20}]
enemies=[{x:500,y:440,w:30,h:30,vx:-2}]
}

if(level==3){
platforms=[{x:0,y:470,w:900,h:30},{x:150,y:380,w:150,h:20},{x:400,y:300,w:150,h:20}]
enemies=[{x:300,y:440,w:30,h:30,vx:3},{x:600,y:440,w:30,h:30,vx:-3}]
}

if(level==4){
platforms=[{x:0,y:470,w:900,h:30},{x:200,y:400,w:150,h:20},{x:450,y:320,w:150,h:20}]
enemies=[{x:250,y:440,w:30,h:30,vx:2},{x:650,y:440,w:30,h:30,vx:-2}]
}

if(level==5){
platforms=[{x:0,y:470,w:900,h:30},{x:300,y:350,w:300,h:20}]
enemies=[{x:400,y:440,w:40,h:40,vx:4}]
}
}

function gameLoop(){

update()
draw()
requestAnimationFrame(gameLoop)
}

function update(){

// beweging
if(keys["ArrowLeft"])player.x-=player.speed
if(keys["ArrowRight"])player.x+=player.speed

// jump
if(keys[" "] && player.grounded){
player.vy=-player.jump
player.grounded=false
}

player.vy+=0.5
player.y+=player.vy

player.grounded=false

// platforms
for(let p of platforms){
if(player.x<p.x+p.w &&
player.x+player.w>p.x &&
player.y<p.y+p.h &&
player.y+player.h>p.y){

player.y=p.y-player.h
player.vy=0
player.grounded=true
}
}

// enemies
for(let e of enemies){
e.x+=e.vx
if(e.x<0||e.x>870)e.vx*=-1

if(collide(player,e)){
damage()
}
}

// goal
if(player.x>goal.x){
nextLevel()
}
}

function draw(){

ctx.clearRect(0,0,900,500)

// player
ctx.fillStyle="cyan"
ctx.fillRect(player.x,player.y,player.w,player.h)

// platforms
ctx.fillStyle="green"
for(let p of platforms){
ctx.fillRect(p.x,p.y,p.w,p.h)
}

// enemies
ctx.fillStyle="red"
for(let e of enemies){
ctx.fillRect(e.x,e.y,e.w,e.h)
}

// goal
ctx.fillStyle="yellow"
ctx.fillRect(goal.x,goal.y,goal.w,goal.h)
}

function collide(a,b){
return a.x<b.x+b.w &&
a.x+a.w>b.x &&
a.y<b.y+b.h &&
a.y+a.h>b.y
}

function damage(){
lives--
document.getElementById("lives").innerText=lives

player.x=50
player.y=400

if(lives<=0){
alert("Game Over")
location.reload()
}
}

function nextLevel(){
if(level<5){
loadLevel(level+1)
player.x=50
player.y=400
}
else{
alert("JE HEBT TYGO GERED!")
location.reload()
}
}

</script>

</body>
</html>
