<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WASTAMA EILAND</title>

<style>
body{margin:0;overflow:hidden;background:black;color:white;font-family:Arial;}
#difficultyMenu,#characterMenu,#gameOver{
position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);text-align:center;
}
#characterMenu{display:none;}
#hud{position:absolute;top:60px;left:20px;display:none;}
#stats{position:absolute;top:10px;left:20px;}
#shopButton{position:absolute;top:10px;right:20px;background:#444;padding:10px;cursor:pointer;}
button{padding:10px;margin:5px;}
</style>
</head>

<body>

<div id="stats">
<div>Games gespeeld: <span id="played">0</span></div>
<div>Games gewonnen: <span id="won">0</span></div>
<div>Munten totaal: <span id="coinsTotal">0</span></div>
</div>

<div id="shopButton">SHOP</div>

<div id="difficultyMenu">
<h1>Kies moeilijkheid</h1>
<button onclick="chooseDifficulty('easy')">🙂</button>
<button onclick="chooseDifficulty('hard')">😈</button>
<button onclick="chooseDifficulty('impossible')">💀</button>
</div>

<div id="characterMenu">
<h1>Kies</h1>
<button onclick="startGame('ice')">❄</button>
<button onclick="startGame('fire')">🔥</button>
<button onclick="startGame('lightning')">⚡</button>
</div>

<div id="hud">
<div>Hits: <span id="hp">0</span>/3</div>
<div>Kills: <span id="kills">0</span></div>
</div>

<div id="gameOver" style="display:none">
<h1 id="endText"></h1>
<button onclick="location.reload()">Restart</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* ================= FIXED STATS ================= */

let gamesPlayed=parseInt(localStorage.getItem("played"))||0
let gamesWon=parseInt(localStorage.getItem("won"))||0
let totalCoins=parseInt(localStorage.getItem("coins"))||0

document.getElementById("played").innerText=gamesPlayed
document.getElementById("won").innerText=gamesWon
document.getElementById("coinsTotal").innerText=totalCoins

/* ================= VARS ================= */

let difficulty="easy"
let impossibleMode="bots"

let scene,camera,renderer,player
let enemies=[],bullets=[],enemyBullets=[]
let keys={},yaw=0
let hits=0,kills=0
let gameActive=false

/* ================= DIFFICULTY ================= */

function chooseDifficulty(mode){
difficulty=mode
difficultyMenu.style.display="none"

if(mode==="impossible"){
showImpossibleChoice()
}else{
characterMenu.style.display="block"
}
}

function showImpossibleChoice(){
let div=document.createElement("div")
div.style.position="absolute"
div.style.top="40%"
div.style.left="50%"
div.style.transform="translate(-50%,-50%)"
div.innerHTML=`
<h1>Impossible</h1>
<button onclick="chooseImpossible('bots')">Bots</button>
<button onclick="chooseImpossible('boss')">Boss</button>
`
document.body.appendChild(div)
}

function chooseImpossible(mode){
impossibleMode=mode
document.querySelector("div").remove()
characterMenu.style.display="block"
}

/* ================= START ================= */

function startGame(){

characterMenu.style.display="none"
hud.style.display="block"
gameActive=true

scene=new THREE.Scene()
camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,2000)
renderer=new THREE.WebGLRenderer()
renderer.setSize(window.innerWidth,window.innerHeight)
document.body.appendChild(renderer.domElement)

scene.add(new THREE.AmbientLight(0xffffff,1))

/* MAP */

let sea=new THREE.Mesh(
new THREE.CircleGeometry(2000,64),
new THREE.MeshBasicMaterial({color:0x1e90ff})
)
sea.rotation.x=-Math.PI/2
scene.add(sea)

let island=new THREE.Mesh(
new THREE.CircleGeometry(600,64),
new THREE.MeshBasicMaterial({color:0x228B22})
)
island.rotation.x=-Math.PI/2
scene.add(island)

/* PLAYER */

player=new THREE.Mesh(
new THREE.BoxGeometry(8,12,8),
new THREE.MeshBasicMaterial({color:0x00ffff})
)
player.position.y=6
scene.add(player)

/* ENEMIES */

function spawnBoss(){
let boss=new THREE.Mesh(
new THREE.BoxGeometry(40,40,40),
new THREE.MeshBasicMaterial({color:0xff0000})
)
boss.position.set(0,20,0)
boss.userData.hp=30
boss.userData.isBoss=true
scene.add(boss)
enemies.push(boss)
}

let count=5

if(difficulty==="hard") count=10
if(difficulty==="impossible"){
if(impossibleMode==="boss"){
spawnBoss()
count=0
}else{
count=20
}
}

for(let i=0;i<count;i++){
let bot=new THREE.Mesh(
new THREE.BoxGeometry(8,12,8),
new THREE.MeshBasicMaterial({color:0xffffff})
)
bot.position.set((Math.random()-0.5)*500,6,(Math.random()-0.5)*500)
bot.userData.hp=1
scene.add(bot)
enemies.push(bot)
}

/* CONTROLS */

document.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true
if(e.code==="Space")shoot()
})

document.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false
})

document.addEventListener("mousemove",e=>{
yaw-=e.movementX*0.002
})

animate()
}

/* ================= SHOOT ================= */

function shoot(){
let b=new THREE.Mesh(
new THREE.SphereGeometry(2),
new THREE.MeshBasicMaterial({color:0xffffff})
)
b.position.copy(player.position)
b.userData.dir=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw))
scene.add(b)
bullets.push(b)
}

/* ================= LOOP ================= */

function animate(){

requestAnimationFrame(animate)
if(!gameActive)return

let speed=keys["m"]?8:4

if(keys["z"])player.position.z-=speed
if(keys["s"])player.position.z+=speed
if(keys["q"])player.position.x-=speed
if(keys["d"])player.position.x+=speed

/* WATER */
if(player.position.length()>600){
endGame("VERDRONKEN 🌊")
}

/* BULLETS */

for(let i=bullets.length-1;i>=0;i--){
let b=bullets[i]
b.position.add(b.userData.dir.clone().multiplyScalar(10))

for(let j=enemies.length-1;j>=0;j--){
let bot=enemies[j]

if(b.position.distanceTo(bot.position)<10){

bot.userData.hp--

if(bot.userData.hp<=0){
scene.remove(bot)
enemies.splice(j,1)
kills++
document.getElementById("kills").innerText=kills
}

scene.remove(b)
bullets.splice(i,1)
break
}
}
}

/* ENEMY */

for(let bot of enemies){

let dir=player.position.clone().sub(bot.position).normalize()
bot.position.add(dir.multiplyScalar(0.5))

if(Math.random()<0.02){
shootBot(bot)
}
}

/* CAMERA */

camera.position.x=player.position.x-Math.sin(yaw)*40
camera.position.z=player.position.z+Math.cos(yaw)*40
camera.position.y=25
camera.lookAt(player.position)

renderer.render(scene,camera)

}

/* ================= BOT SHOOT ================= */

function shootBot(bot){
let dir=player.position.clone().sub(bot.position).normalize()

let b=new THREE.Mesh(
new THREE.SphereGeometry(2),
new THREE.MeshBasicMaterial({color:0xff0000})
)

b.position.copy(bot.position)
b.userData.dir=dir

scene.add(b)
enemyBullets.push(b)
}

/* ================= END ================= */

function endGame(text){
gameActive=false
document.getElementById("endText").innerText=text
gameOver.style.display="block"
}

</script>

</body>
</html>
