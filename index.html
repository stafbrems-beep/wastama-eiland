<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WASTAMA EILAND</title>
<style>
body{margin:0;overflow:hidden;background:black;color:white;font-family:Arial;}

#difficultyMenu,#gameOver{
position:absolute;top:40%;left:50%;
transform:translate(-50%,-50%);
text-align:center;z-index:5;
}

#hud{position:absolute;top:60px;left:20px;display:none;z-index:5;}
#stats{position:absolute;top:10px;left:20px;z-index:5;}

#shopButton{
position:absolute;top:10px;right:20px;
background:#444;padding:10px;cursor:pointer;z-index:5;
}

#shopMenu{
display:none;position:fixed;top:0;left:0;
width:100%;height:100%;
background:black;z-index:999;padding:20px;
overflow-y:auto;
}

.skin{background:#222;padding:10px;margin:10px;border:2px solid white;}
.active{background:yellow;color:black;}
button{padding:10px;margin:5px;}
</style>
</head>
<body>

<div id="stats">
<div>Games gespeeld: <span id="played">0</span></div>
<div>Games gewonnen: <span id="won">0</span></div>
<div>Munten totaal: <span id="coinsTotal">0</span></div>
</div>

<div id="shopButton">SHOP</div>

<div id="shopMenu">
<div style="position:absolute;right:20px;top:20px;font-size:30px;cursor:pointer"
onclick="closeShop()">✖</div>
<h1>SHOP</h1>
<div id="skinsContainer"></div>
</div>

<div id="difficultyMenu">
<h1>Kies moeilijkheid</h1>
<button onclick="chooseDifficulty('easy')">🙂 Makkelijk</button>
<button onclick="chooseDifficulty('hard')">😈 Moeilijk</button>
<button onclick="chooseDifficulty('impossible')">💀 Impossible</button>
</div>

<div id="hud">
<div>Hits: <span id="hp">0</span> / 3</div>
<div>Gedood: <span id="kills">0</span></div>
<div>Munten: <span id="coins">0</span></div>
</div>

<div id="gameOver" style="display:none">
<h1 id="endText"></h1>
<button onclick="location.reload()">Opnieuw spelen</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ---------------- STATS ----------------
let gamesPlayed = parseInt(localStorage.getItem("played"))||0;
let gamesWon = parseInt(localStorage.getItem("won"))||0;
let totalCoins = parseInt(localStorage.getItem("coins"))||0;
played.innerText=gamesPlayed;
won.innerText=gamesWon;
coinsTotal.innerText=totalCoins;

// ---------------- SKINS ----------------
let skins=[
{name:"blue",price:5,color:0x0066ff},
{name:"red",price:5,color:0xff0000},
{name:"gold",price:10,color:0xffcc00}
];

let ownedSkins=JSON.parse(localStorage.getItem("ownedSkins"))||["blue"];
let currentSkin=localStorage.getItem("currentSkin")||"blue";

// ---------------- SHOP ----------------
shopButton.onclick=()=>{shopMenu.style.display="block";renderShop();}
function closeShop(){shopMenu.style.display="none";}

function renderShop(){
let c=document.getElementById("skinsContainer");
c.innerHTML="";
skins.forEach(s=>{
let div=document.createElement("div");
div.className="skin";
let btn=document.createElement("button");

if(currentSkin===s.name){
btn.innerText="ACTIEF";btn.className="active";
}
else if(ownedSkins.includes(s.name)){
btn.innerText="Gebruik";
btn.onclick=()=>{
currentSkin=s.name;
localStorage.setItem("currentSkin",currentSkin);
renderShop();
};
}else{
btn.innerText="Koop ("+s.price+")";
btn.onclick=()=>{
if(totalCoins>=s.price){
totalCoins-=s.price;
coinsTotal.innerText=totalCoins;
localStorage.setItem("coins",totalCoins);
ownedSkins.push(s.name);
localStorage.setItem("ownedSkins",JSON.stringify(ownedSkins));
renderShop();
}
};
}

div.innerHTML="<b>"+s.name+"</b><br>";
div.appendChild(btn);
c.appendChild(div);
});
}

// ---------------- GAME ----------------
let scene,camera,renderer,player;
let enemies=[],bullets=[],enemyBullets=[],coinsArr=[];
let keys={},hits=0,kills=0,coins=0,gameActive=false;

let yaw=0,pitch=0,mouseDown=false;
let islandRadius=1500;

// PLAYER
function createPlayer(){
let skin=skins.find(s=>s.name===currentSkin);
let mesh=new THREE.Mesh(
new THREE.BoxGeometry(8,12,8),
new THREE.MeshBasicMaterial({color:skin.color})
);
mesh.position.y=6;
return mesh;
}

// START
function chooseDifficulty(mode){
difficultyMenu.style.display="none";
startGame();
}

function startGame(){

gamesPlayed++;
localStorage.setItem("played",gamesPlayed);
played.innerText=gamesPlayed;

hud.style.display="block";
gameActive=true;

scene=new THREE.Scene();
camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,4000);
renderer=new THREE.WebGLRenderer();
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// MAP
let island=new THREE.Mesh(
new THREE.CircleGeometry(1500,64),
new THREE.MeshBasicMaterial({color:0x228B22})
);
island.rotation.x=-Math.PI/2;
scene.add(island);

// BOMEN
for(let i=0;i<60;i++){
let t=new THREE.Mesh(new THREE.CylinderGeometry(3,3,25),
new THREE.MeshBasicMaterial({color:0x8b4513}));
let l=new THREE.Mesh(new THREE.ConeGeometry(15,35,10),
new THREE.MeshBasicMaterial({color:0x228B22}));
let x=(Math.random()-0.5)*2500;
let z=(Math.random()-0.5)*2500;
t.position.set(x,12,z);
l.position.set(x,40,z);
scene.add(t,l);
}

// GEBOUWEN
for(let i=0;i<30;i++){
let b=new THREE.Mesh(
new THREE.BoxGeometry(80,150,80),
new THREE.MeshBasicMaterial({color:0x555555})
);
b.position.set((Math.random()-0.5)*2000,75,(Math.random()-0.5)*2000);
scene.add(b);
}

// COINS
for(let i=0;i<20;i++){
let c=new THREE.Mesh(
new THREE.CylinderGeometry(4,4,2,16),
new THREE.MeshBasicMaterial({color:0xffff00})
);
c.rotation.x=Math.PI/2;
c.position.set((Math.random()-0.5)*1200,6,(Math.random()-0.5)*1200);
scene.add(c);
coinsArr.push(c);
}

// PLAYER
player=createPlayer();
scene.add(player);

// ENEMIES
for(let i=0;i<15;i++){
let bot=new THREE.Mesh(
new THREE.BoxGeometry(8,12,8),
new THREE.MeshBasicMaterial({color:0xffffff})
);
bot.position.set((Math.random()-0.5)*1000,6,(Math.random()-0.5)*1000);
bot.userData.dir=new THREE.Vector3(Math.random()-0.5,0,Math.random()-0.5);
scene.add(bot);
enemies.push(bot);
}

// INPUT
document.addEventListener("keydown",e=>{
if(!keys[e.key]){
keys[e.key]=true;
if(e.code==="Space") shoot();
}
});
document.addEventListener("keyup",e=>keys[e.key]=false);
document.addEventListener("click",shoot);

// MOUSE LOOK
document.addEventListener("mousedown",()=>mouseDown=true);
document.addEventListener("mouseup",()=>mouseDown=false);
document.addEventListener("mousemove",(e)=>{
if(!mouseDown) return;
yaw -= e.movementX * 0.003;
pitch -= e.movementY * 0.003;
pitch=Math.max(-1.2,Math.min(1.2,pitch));
});

animate();
}

// SHOOT
function shoot(){
let b=new THREE.Mesh(
new THREE.SphereGeometry(2),
new THREE.MeshBasicMaterial({color:0xffffff})
);
b.position.copy(player.position);
b.userData.dir=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
scene.add(b);
bullets.push(b);
}

// LOOP
function animate(){
requestAnimationFrame(animate);
if(!gameActive) return;

// MOVEMENT (FIXED)
let forward = new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
let right = new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));

if(keys["ArrowUp"]) player.position.add(forward.clone().multiplyScalar(5));
if(keys["ArrowDown"]) player.position.add(forward.clone().multiplyScalar(-5));
if(keys["ArrowLeft"]) player.position.add(right.clone().multiplyScalar(-5));
if(keys["ArrowRight"]) player.position.add(right.clone().multiplyScalar(5));

// COINS
for(let i=coinsArr.length-1;i>=0;i--){
if(player.position.distanceTo(coinsArr[i].position)<10){
scene.remove(coinsArr[i]);
coinsArr.splice(i,1);
coins++;
document.getElementById("coins").innerText=coins;
}
}

// ENEMIES
for(let bot of enemies){
bot.position.add(bot.userData.dir.clone().multiplyScalar(0.5));
if(Math.random()<0.02){
bot.userData.dir=new THREE.Vector3(Math.random()-0.5,0,Math.random()-0.5);
}
}

// BULLETS
for(let i=bullets.length-1;i>=0;i--){
bullets[i].position.add(bullets[i].userData.dir.clone().multiplyScalar(10));

for(let j=enemies.length-1;j>=0;j--){
if(bullets[i].position.distanceTo(enemies[j].position)<8){
scene.remove(enemies[j]);
enemies.splice(j,1);
kills++;
document.getElementById("kills").innerText=kills;

scene.remove(bullets[i]);
bullets.splice(i,1);
break;
}
}
}

// CAMERA (FIXED)
let camDist=60;
camera.position.set(
player.position.x - Math.sin(yaw)*camDist,
player.position.y + 30 + pitch*40,
player.position.z - Math.cos(yaw)*camDist
);

camera.lookAt(player.position);

// PLAYER ROTATE
player.rotation.y = yaw;

renderer.render(scene,camera);
}

</script>

</body>
</html>
