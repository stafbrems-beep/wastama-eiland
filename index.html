<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Arcade Launcher</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Coole geanimeerde arcade-achtergrond */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: radial-gradient(#ffffff 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
            animation: stars 100s linear infinite;
            z-index: 0;
        }

        @keyframes stars {
            from { transform: translate(0, 0); }
            to { transform: translate(-50px, -50px); }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(45deg, #00f2fe, #ff416c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
            text-align: center;
            z-index: 1;
            animation: pulse 2s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.02); }
        }

        .game-grid {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
            padding: 20px;
            z-index: 1;
        }

        .game-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            width: 300px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        /* Glanzend highlight effect op de kaarten */
        .game-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: rotate(45deg);
            transition: 0.6s;
        }

        .game-card:hover::after {
            left: 120%;
        }

        .game-card:hover {
            transform: translateY(-15px);
            background: rgba(15, 23, 42, 0.8);
        }

        /* Wastama Eiland Styling (Neon Rood/Oranje) */
        .card-wastama { border-color: rgba(255, 65, 108, 0.3); }
        .card-wastama:hover { 
            border-color: #ff416c; 
            box-shadow: 0 0 30px rgba(255, 65, 108, 0.6), inset 0 0 15px rgba(255, 65, 108, 0.2); 
        }

        /* Space Portal Runner Styling (Neon Blauw) */
        .card-space { border-color: rgba(79, 172, 254, 0.3); }
        .card-space:hover { 
            border-color: #00f2fe; 
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.6), inset 0 0 15px rgba(0, 242, 254, 0.2); 
        }

        .game-icon { 
            font-size: 65px; 
            margin-bottom: 20px; 
            display: block;
            transition: transform 0.3s ease;
        }
        .game-card:hover .game-icon {
            transform: scale(1.15) rotate(5deg);
        }

        .game-title { 
            font-size: 1.6rem; 
            font-weight: 800; 
            margin-bottom: 25px; 
            display: block;
            letter-spacing: 1px;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            width: 100%;
        }

        .btn-wastama { background: linear-gradient(45deg, #ff4b1f, #ff416c); color: white; }
        .btn-space { background: linear-gradient(45deg, #00f2fe, #4facfe); color: #020617; }

        .game-card:hover .btn {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        /* 🚨 Defect Pop-up (Modal) Styling */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 10;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-box {
            background: #1e293b;
            border: 3px solid #ff416c;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 65, 108, 0.5);
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-box h2 {
            font-size: 2rem;
            color: #ff416c;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .modal-box p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #cbd5e1;
        }

        .btn-close {
            background: #fff;
            color: #0f172a;
            border: none;
            cursor: pointer;
        }
        .btn-close:hover {
            background: #f1f5f9;
        }
    </style>
</head>
<body>

    <h1>🎮 Welke game wil je spelen?</h1>

    <div class="game-grid">
        <!-- Knop 1: Wastama Eiland (Triggert nu de pop-up via JavaScript) -->
        <div onclick="showDefectModal()" class="game-card card-wastama">
            <span class="game-icon">🏝️</span>
            <span class="game-title">Wastama Eiland</span>
            <span class="btn btn-wastama">Speel Nu</span>
        </div>

        <!-- Knop 2: Space Portal Runner (Nu correct gekoppeld naar je nieuwe site) -->
        <a href="https://stafbrems-beep.github.io/space-portal-runner/" class="game-card card-space">
            <span class="game-icon">🚀</span>
            <span class="game-title">Space Portal Runner</span>
            <span class="btn btn-space">Speel Nu</span>
        </a>
    </div>

    <!-- 🚨 Pop-up Venster -->
    <div id="defectModal" class="modal-overlay">
        <div class="modal-box">
            <h2>Oeps! ⚠️</h2>
            <p>De game <strong>Wastama Eiland</strong> is momenteel deffect en kan niet worden gespeeld. Er wordt aan gewerkt!</p>
            <button onclick="closeDefectModal()" class="btn btn-close">Sluiten</button>
        </div>
    </div>

    <script>
        // Functie om de pop-up te tonen
        function showDefectModal() {
            document.getElementById('defectModal').classList.add('active');
        }

        // Functie om de pop-up te sl
