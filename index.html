<script>

/* ================= STATS ================= */

let gamesPlayed=parseInt(localStorage.getItem("played"))||0
let gamesWon=parseInt(localStorage.getItem("won"))||0
let totalCoins=parseInt(localStorage.getItem("coins"))||0

played.innerText=gamesPlayed
won.innerText=gamesWon
coinsTotal.innerText=totalCoins

/* ================= VARS ================= */

let difficulty="easy"
let powerType="ice"
let impossibleMode="bots" // NIEUW

let scene,camera,renderer,player
let enemies=[],bullets=[],enemyBullets=[]
let coinObjects=[]
let healthPacks=[]

let keys={}
let yaw=0
let hits=0
let kills=0
let coins=0
let gameActive=false

let shootTimer=0
let shootIndex=0
let aPressed=false

let abilityCooldown=0

/* ================= SHOP ================= */

shopButton.onclick=()=>shopMenu.style.display="block"
function closeShop(){shopMenu.style.display="none"}

/* ================= DIFFICULTY ================= */

function chooseDifficulty(mode){

difficulty=mode
difficultyMenu.style.display="none"

if(mode==="impossible"){
showImpossibleChoice()
}else{
characterMenu.style.display="block"
}

}

/* ================= NIEUW: IMPOSSIBLE KEUZE ================= */

function showImpossibleChoice(){

let div=document.createElement("div")
div.id="impossibleChoice"
div.style.position="absolute"
div.style.top="40%"
div.style.left="50%"
div.style.transform="translate(-50%,-50%)"
div.style.textAlign="center"

div.innerHTML=`
<h1>Impossible mode</h1>
<button onclick="chooseImpossible('bots')">Veel bots 😈</button>
<button onclick="chooseImpossible('boss')">Boss 👹</button>
`

document.body.appendChild(div)

}

function chooseImpossible(mode){

impossibleMode=mode
document.getElementById("impossibleChoice").remove()
characterMenu.style.display="block"

}

/* ================= START GAME ================= */

function startGame(type){

powerType=type

gamesPlayed++
localStorage.setItem("played",gamesPlayed)
played.innerText=gamesPlayed

characterMenu.style.display="none"
hud.style.display="block"

gameActive=true

scene=new THREE.Scene()

camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,2000)

renderer=new THREE.WebGLRenderer()
renderer.setSize(window.innerWidth,window.innerHeight)
document.body.appendChild(renderer.domElement)

scene.add(new THREE.AmbientLight(0xffffff,1))

/* ================= MAP ================= */

let sea=new THREE.Mesh(
new THREE.CircleGeometry(2000,64),
new THREE.MeshBasicMaterial({color:0x1e90ff})
)
sea.rotation.x=-Math.PI/2
scene.add(sea)

let island=new THREE.Mesh(
new THREE.CircleGeometry(600,64),
new THREE.MeshBasicMaterial({color:0x228B22})
)
island.rotation.x=-Math.PI/2
island.position.y=0.1
scene.add(island)

/* ================= PLAYER ================= */

player=new THREE.Mesh(
new THREE.BoxGeometry(8,12,8),
new THREE.MeshBasicMaterial({color:0x00ffff})
)
player.position.y=6
scene.add(player)

/* ================= ENEMIES ================= */

let botCount=5

if(difficulty==="hard")botCount=10

if(difficulty==="impossible"){

if(impossibleMode==="bots"){
botCount=25
}else{
spawnBoss()
botCount=0
}

}

for(let i=0;i<botCount;i++){

let bot=new THREE.Mesh(
new THREE.BoxGeometry(8,12,8),
new THREE.MeshBasicMaterial({color:0xffffff})
)

bot.position.set((Math.random()-0.5)*500,6,(Math.random()-0.5)*500)

bot.userData.hp=1

scene.add(bot)
enemies.push(bot)

}

/* ================= BOSS ================= */

function spawnBoss(){

let boss=new THREE.Mesh(
new THREE.BoxGeometry(40,40,40),
new THREE.MeshBasicMaterial({color:0xff0000})
)

boss.position.set(0,20,0)
boss.userData.hp=30
boss.userData.isBoss=true

scene.add(boss)
enemies.push(boss)

}

/* ================= COINS ================= */

for(let i=0;i<5;i++){

let coin=new THREE.Mesh(
new THREE.CylinderGeometry(4,4,2,16),
new THREE.MeshBasicMaterial({color:0xffff00})
)

coin.rotation.x=Math.PI/2
coin.position.set((Math.random()-0.5)*500,6,(Math.random()-0.5)*500)

scene.add(coin)
coinObjects.push(coin)

}

/* ================= HEALTH ================= */

for(let i=0;i<3;i++){

let hp=new THREE.Mesh(
new THREE.BoxGeometry(6,6,6),
new THREE.MeshBasicMaterial({color:0xff00ff})
)

hp.position.set((Math.random()-0.5)*500,6,(Math.random()-0.5)*500)

scene.add(hp)
healthPacks.push(hp)

}

/* ================= CONTROLS ================= */

document.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true
if(e.code==="Space")shoot()
if(e.key==="e")useAbility()
})

document.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false
})

document.addEventListener("mousemove",e=>{
yaw-=e.movementX*0.002
})

document.addEventListener("click",shoot)

animate()

}

/* ================= SHOOT ================= */

function shoot(){

let bullet=new THREE.Mesh(
new THREE.SphereGeometry(2),
new THREE.MeshBasicMaterial({color:0xffffff})
)

bullet.position.copy(player.position)
bullet.userData.dir=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw))

scene.add(bullet)
bullets.push(bullet)

}

/* ================= BOSS SHOOT ================= */

function shootBot(bot){

let dir=player.position.clone().sub(bot.position).normalize()

let bullet=new THREE.Mesh(
new THREE.SphereGeometry(3),
new THREE.MeshBasicMaterial({color:0xff0000})
)

bullet.position.copy(bot.position)
bullet.userData.dir=dir

scene.add(bullet)
enemyBullets.push(bullet)

}

/* ================= ABILITY ================= */

function useAbility(){

if(abilityCooldown>0)return
abilityCooldown=300

for(let i=enemies.length-1;i>=0;i--){

if(player.position.distanceTo(enemies[i].position)<80){

scene.remove(enemies[i])
enemies.splice(i,1)

kills++
document.getElementById("kills").innerText=kills

}

}

}

/* ================= LOOP ================= */

function animate(){

requestAnimationFrame(animate)
if(!gameActive)return

/* SPRINT */
let speed=keys["m"]?8:4

if(keys["arrowup"]||keys["z"])player.position.z-=speed
if(keys["arrowdown"]||keys["s"])player.position.z+=speed
if(keys["arrowleft"]||keys["q"])player.position.x-=speed
if(keys["arrowright"]||keys["d"])player.position.x+=speed

/* VERDRINKEN */
if(player.position.length()>600){
endGame("VERDRONKEN 🌊")
}

/* COIN MAGNET */
for(let c of coinObjects){
if(player.position.distanceTo(c.position)<50){
c.position.lerp(player.position,0.1)
}
}

/* COINS */
for(let i=coinObjects.length-1;i>=0;i--){
if(player.position.distanceTo(coinObjects[i].position)<10){
scene.remove(coinObjects[i])
coinObjects.splice(i,1)
coins++
document.getElementById("coins").innerText=coins
}
}

/* HEALTH */
for(let i=healthPacks.length-1;i>=0;i--){
if(player.position.distanceTo(healthPacks[i].position)<10){
scene.remove(healthPacks[i])
healthPacks.splice(i,1)
if(hits>0){
hits--
document.getElementById("hp").innerText=hits
}
}
}

/* BULLETS */
for(let i=bullets.length-1;i>=0;i--){

let b=bullets[i]
b.position.add(b.userData.dir.clone().multiplyScalar(10))

for(let j=enemies.length-1;j>=0;j--){

let bot=enemies[j]

if(b.position.distanceTo(bot.position)<10){

bot.userData.hp--

if(bot.userData.hp<=0){
scene.remove(bot)
enemies.splice(j,1)
kills++
document.getElementById("kills").innerText=kills
}

scene.remove(b)
bullets.splice(i,1)

if(enemies.length===0){
endGame("GEWONNEN!")
}

break
}
}
}

/* ENEMY AI */
for(let bot of enemies){

let dir=player.position.clone().sub(bot.position).normalize()
bot.position.add(dir.multiplyScalar(0.5))

/* boss schiet sneller */
if(bot.userData.isBoss){
if(Math.random()<0.05)shootBot(bot)
}else{
if(Math.random()<0.01)shootBot(bot)
}

}

/* ENEMY BULLETS */
for(let i=enemyBullets.length-1;i>=0;i--){

let b=enemyBullets[i]
b.position.add(b.userData.dir.clone().multiplyScalar(8))

if(b.position.distanceTo(player.position)<8){

hits++
document.getElementById("hp").innerText=hits

scene.remove(b)
enemyBullets.splice(i,1)

if(hits>=3)endGame("GAME OVER")

}
}

/* CAMERA */
camera.position.x=player.position.x-Math.sin(yaw)*40
camera.position.z=player.position.z+Math.cos(yaw)*40
camera.position.y=25

camera.lookAt(player.position)

renderer.render(scene,camera)

if(abilityCooldown>0) abilityCooldown--

}

/* ================= END ================= */

function endGame(text){

gameActive=false
document.getElementById("endText").innerText=text
gameOver.style.display="block"

}

</script>
