<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WASTAMA EILAND</title>
<style>
body{margin:0;overflow:hidden;background:black;font-family:Arial;color:white;}
#difficultyMenu,#characterMenu,#gameOver,#gamesMenu{
position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);text-align:center;}
#characterMenu,#gamesMenu{display:none;}
#hud{position:absolute;top:60px;left:20px;display:none;}
#stats{position:absolute;top:10px;left:20px;}
#shopButton,#gamesButton{
position:absolute;top:10px;right:20px;background:#444;padding:10px;cursor:pointer;margin-top:5px;}
#gamesButton{top:50px;}
#shopMenu,#gamesMenu{
display:none;position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%);
width:600px;height:400px;background:#111;border:3px solid white;padding:20px;}
button{padding:12px;margin:5px;font-size:16px;cursor:pointer;}
</style>
</head>
<body>

<div id="stats">
<div>Games gespeeld: <span id="played">0</span></div>
<div>Games gewonnen: <span id="won">0</span></div>
<div>Munten totaal: <span id="coinsTotal">0</span></div>
</div>

<div id="shopButton">SHOP</div>
<div id="gamesButton">SAMEN SPELLEN</div>

<div id="difficultyMenu">
<h1>Kies moeilijkheid</h1>
<button onclick="chooseDifficulty('easy')">🙂 Makkelijk</button>
<button onclick="chooseDifficulty('hard')">😈 Moeilijk</button>
<button onclick="chooseDifficulty('impossible')">💀 Impossible</button>
</div>

<div id="characterMenu">
<h1>Kies je mannetje</h1>
<button onclick="startGame('ice')">❄ IJs</button>
<button onclick="startGame('fire')">🔥 Vuur</button>
<button onclick="startGame('lightning')">⚡ Bliksem</button>
</div>

<div id="hud">
<div>Hits: <span id="hp">0</span> / 3</div>
<div>Gedood: <span id="kills">0</span></div>
<div>Munten: <span id="coins">0</span></div>
</div>

<div id="gameOver" style="display:none">
<h1 id="endText"></h1>
<button onclick="location.reload()">Opnieuw spelen</button>
</div>

<div id="shopMenu">
<div style="position:absolute;right:10px;top:10px;cursor:pointer" onclick="closeShop()">✖</div>
<h2>SHOP</h2>
<button onclick="buySkin('red',10)">Rode skin - 10 munten</button>
<button onclick="buySkin('blue',10)">Blauwe skin - 10 munten</button>
<button onclick="buySkin('gold',20)">Gouden skin - 20 munten</button>
</div>

<div id="gamesMenu">
<div style="position:absolute;right:10px;top:10px;cursor:pointer" onclick="closeGamesMenu()">✖</div>
<h2>SAMEN SPELLEN</h2>
<p>Hier komen straks nieuwe game opties</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// --- STATS ---
let gamesPlayed = parseInt(localStorage.getItem("played")) || 0;
let gamesWon = parseInt(localStorage.getItem("won")) || 0;
let totalCoins = parseInt(localStorage.getItem("coins")) || 0;
played.innerText = gamesPlayed;
won.innerText = gamesWon;
coinsTotal.innerText = totalCoins;

// --- VARIABLES ---
let difficulty="easy";
let powerType="ice";
let scene,camera,renderer,player;
let enemies=[],bullets=[],enemyBullets=[],coinObjects=[],healthPacks=[];
let keys={},yaw=0,hits=0,kills=0,coins=0,gameActive=false;
let shootTimer=0,aPressed=false,abilityCooldown=0;
let shootInterval=60,shootMode="all";
let islandRadius = 600;

// --- SHOP ---
shopButton.onclick = ()=>shopMenu.style.display="block";
function closeShop(){shopMenu.style.display="none";}
function buySkin(c,cost){
if(totalCoins<cost){alert("Niet genoeg munten");return;}
totalCoins-=cost; coinsTotal.innerText=totalCoins;
localStorage.setItem("coins",totalCoins);
alert("gekocht!");
}

// --- MENU ---
function chooseDifficulty(mode){
difficulty=mode;
difficultyMenu.style.display="none";
characterMenu.style.display="block";
}

// --- START ---
function startGame(type){
powerType=type;
gamesPlayed++; localStorage.setItem("played",gamesPlayed);
played.innerText=gamesPlayed;
characterMenu.style.display="none";
hud.style.display="block";
gameActive=true;

scene=new THREE.Scene();
camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,2000);
renderer=new THREE.WebGLRenderer();
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,1));

// eiland
let sea=new THREE.Mesh(new THREE.CircleGeometry(2000,64),
new THREE.MeshBasicMaterial({color:0x1e90ff}));
sea.rotation.x=-Math.PI/2; scene.add(sea);

let island=new THREE.Mesh(new THREE.CircleGeometry(600,64),
new THREE.MeshBasicMaterial({color:0x228B22}));
island.rotation.x=-Math.PI/2; island.position.y=0.1; scene.add(island);

// player
player=new THREE.Mesh(new THREE.BoxGeometry(8,12,8),
new THREE.MeshBasicMaterial({color:0x00ffff}));
player.position.y=6; scene.add(player);

// bots aantallen
let botCount=8;
if(difficulty==="hard") botCount=14;
if(difficulty==="impossible") botCount=21;

// shoot gedrag
if(difficulty==="easy"){shootInterval=180;shootMode="all";}
if(difficulty==="hard"){shootInterval=120;shootMode="all";}
if(difficulty==="impossible"){shootInterval=30;shootMode="burst";}

// bots
for(let i=0;i<botCount;i++){
let bot=new THREE.Mesh(new THREE.BoxGeometry(8,12,8),
new THREE.MeshBasicMaterial({color:0xffffff}));
bot.position.set((Math.random()-0.5)*500,6,(Math.random()-0.5)*500);
bot.userData.moveDir=new THREE.Vector3(Math.random()-0.5,0,Math.random()-0.5).normalize();
scene.add(bot); enemies.push(bot);
}

// controls
document.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
if(e.code==="Space") shoot();
});
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

animate();
}

// --- SHOOT ---
function shoot(){
let b=new THREE.Mesh(new THREE.SphereGeometry(2),
new THREE.MeshBasicMaterial({color:0xffffff}));
b.position.copy(player.position);
b.userData.dir=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));
scene.add(b); bullets.push(b);
}

function shootBot(bot){
let dir=player.position.clone().sub(bot.position).normalize();
let b=new THREE.Mesh(new THREE.SphereGeometry(2),
new THREE.MeshBasicMaterial({color:0xff0000}));
b.position.copy(bot.position);
b.userData.dir=dir;
scene.add(b); enemyBullets.push(b);
}

// --- END ---
function endGame(t){
gameActive=false;
endText.innerText=t;
gameOver.style.display="block";
}

// --- LOOP ---
function animate(){
requestAnimationFrame(animate);
if(!gameActive) return;

// movement
let speed=4;
if(keys["z"]||keys["arrowup"]) player.position.z-=speed;
if(keys["s"]||keys["arrowdown"]) player.position.z+=speed;
if(keys["q"]||keys["arrowleft"]) player.position.x-=speed;
if(keys["d"]||keys["arrowright"]) player.position.x+=speed;

// 🌊 verdrinken
let dist=Math.sqrt(player.position.x**2+player.position.z**2);
if(dist>islandRadius){
endGame("VERDRONKEN");
}

// bullets
for(let b of bullets){
b.position.add(b.userData.dir.clone().multiplyScalar(10));
for(let i=enemies.length-1;i>=0;i--){
if(b.position.distanceTo(enemies[i].position)<8){
scene.remove(enemies[i]);
enemies.splice(i,1);
kills++; kills.innerText=kills;

if(enemies.length===0){
gamesWon++; localStorage.setItem("won",gamesWon);

// coins per difficulty
let reward=3;
if(difficulty==="hard") reward=5;
if(difficulty==="impossible") reward=7;

totalCoins+=reward;
localStorage.setItem("coins",totalCoins);

endGame("GEWONNEN!");
}
}
}
}

// bots bewegen + schieten
shootTimer++;
for(let bot of enemies){
bot.position.add(bot.userData.moveDir.clone().multiplyScalar(0.5));

if(shootTimer>shootInterval){

if(shootMode==="all"){
shootBot(bot);
}

if(shootMode==="burst"){
if(Math.random()<0.15){
shootBot(bot);
}
}

}
}
if(shootTimer>shootInterval) shootTimer=0;

// enemy bullets
for(let i=enemyBullets.length-1;i>=0;i--){
enemyBullets[i].position.add(enemyBullets[i].userData.dir.clone().multiplyScalar(8));
if(enemyBullets[i].position.distanceTo(player.position)<8){
hits++; hp.innerText=hits;
scene.remove(enemyBullets[i]);
enemyBullets.splice(i,1);
if(hits>=3) endGame("GAME OVER");
}
}

// camera
camera.position.x=player.position.x-Math.sin(yaw)*40;
camera.position.z=player.position.z+Math.cos(yaw)*40;
camera.position.y=25;
camera.lookAt(player.position);

renderer.render(scene,camera);
}
</script>

</body>
</html>
