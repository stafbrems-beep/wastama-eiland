<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WASTAMA EILAND - Verbeterde Skins</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
color:white;
}
#difficultyMenu,#characterMenu,#gameOver{
position:absolute;
top:40%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}
#characterMenu{display:none;}
#hud{
position:absolute;
top:60px;
left:20px;
display:none;
}
#stats{
position:absolute;
top:10px;
left:20px;
}
#shopButton{
position:absolute;
top:10px;
right:20px;
background:#444;
padding:10px;
cursor:pointer;
}
#shopMenu{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:600px;
height:400px;
background:#111;
border:3px solid white;
padding:20px;
}
button{
padding:12px;
margin:5px;
font-size:16px;
cursor:pointer;
}
.selected{
background:gold;
color:black;
}
</style>
</head>
<body>

<div id="stats">
<div>Games gespeeld: <span id="played">0</span></div>
<div>Games gewonnen: <span id="won">0</span></div>
<div>Munten totaal: <span id="coinsTotal">0</span></div>
</div>

<div id="shopButton">SHOP</div>

<div id="difficultyMenu">
<h1>Kies moeilijkheid</h1>
<button onclick="chooseDifficulty('easy')">🙂 Makkelijk</button>
<button onclick="chooseDifficulty('hard')">😈 Moeilijk</button>
<button onclick="chooseDifficulty('impossible')">💀 Impossible</button>
</div>

<div id="characterMenu">
<h1>Kies je mannetje</h1>
<button onclick="startGame('ice')">❄ IJs</button>
<button onclick="startGame('fire')">🔥 Vuur</button>
<button onclick="startGame('lightning')">⚡ Bliksem</button>
</div>

<div id="hud">
<div>Hits: <span id="hp">0</span> / 3</div>
<div>Gedood: <span id="kills">0</span></div>
<div>Munten: <span id="coins">0</span></div>
</div>

<div id="gameOver" style="display:none">
<h1 id="endText"></h1>
<button onclick="location.reload()">Opnieuw spelen</button>
</div>

<div id="shopMenu">
<div style="position:absolute;right:10px;top:10px;cursor:pointer;font-size:20px"
onclick="closeShop()">✖</div>
<h2>SHOP</h2>

<button id="redBtn" onclick="buySkin('red',10)">🔥 Rode kubus - 10 munten</button>
<button id="blueBtn" onclick="buySkin('blue',10)">💧 Blauwe cilinder - 10 munten</button>
<button id="goldBtn" onclick="buySkin('gold',20)">✨ Gouden kegel - 20 munten</button>
<button id="purpleBtn" onclick="buySkin('purple',15)">🌌 Paarse bol - 15 munten</button>
<button id="neonBtn" onclick="buySkin('neon',25)">⚡ Neon ster - 25 munten</button>
<button id="iceblockBtn" onclick="buySkin('iceblock',15)">❄ IJsblok - 15 munten</button>
<button id="flameBtn" onclick="buySkin('flame',25)">🔥 Vuurvlam - 25 munten</button>

</div>

<audio id="bgMusic" autoplay loop>
  <source src="https://www.dropbox.com/s/your_audio_file.mp3?raw=1" type="audio/mp3">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ================= DATA =================
let gamesPlayed=parseInt(localStorage.getItem("played"))||0;
let gamesWon=parseInt(localStorage.getItem("won"))||0;
let totalCoins=parseInt(localStorage.getItem("coins"))||0;

played.innerText=gamesPlayed;
won.innerText=gamesWon;
coinsTotal.innerText=totalCoins;

// ✅ FIXED SKINS
let ownedSkins=JSON.parse(localStorage.getItem("skins"))||["default"];
let currentSkin=localStorage.getItem("selectedSkin")||"default";

// ================= SHOP =================
shopButton.onclick=function(){
    shopMenu.style.display="block";
    updateShop();
}

function closeShop(){shopMenu.style.display="none";}

function updateShop(){
    const skins=[
        {id:"red",cost:10,btn:"redBtn",name:"🔥 Rode kubus"},
        {id:"blue",cost:10,btn:"blueBtn",name:"💧 Blauwe cilinder"},
        {id:"gold",cost:20,btn:"goldBtn",name:"✨ Gouden kegel"},
        {id:"purple",cost:15,btn:"purpleBtn",name:"🌌 Paarse bol"},
        {id:"neon",cost:25,btn:"neonBtn",name:"⚡ Neon ster"},
        {id:"iceblock",cost:15,btn:"iceblockBtn",name:"❄ IJsblok"},
        {id:"flame",cost:25,btn:"flameBtn",name:"🔥 Vuurvlam"}
    ];

    skins.forEach(s=>{
        let btn=document.getElementById(s.btn);

        if(ownedSkins.includes(s.id)){
            btn.innerText=s.name;
            btn.onclick=()=>selectSkin(s.id);

            if(currentSkin===s.id){
                btn.classList.add("selected");
            }else{
                btn.classList.remove("selected");
            }
        }else{
            btn.innerText=s.name+" - "+s.cost+" munten";
            btn.onclick=()=>buySkin(s.id,s.cost);
            btn.classList.remove("selected");
        }
    });
}

function selectSkin(skin){
    currentSkin=skin;
    localStorage.setItem("selectedSkin",skin);
    updateShop();
}

function buySkin(skin,cost){

    if(totalCoins<cost){
        alert("Niet genoeg munten");
        return;
    }

    totalCoins-=cost;
    coinsTotal.innerText=totalCoins;
    localStorage.setItem("coins",totalCoins);

    ownedSkins.push(skin);
    localStorage.setItem("skins",JSON.stringify(ownedSkins));

    currentSkin=skin;
    localStorage.setItem("selectedSkin",skin);

    updateShop();
}

// ================= GAME (ONAANGEPAST) =================
let difficulty="easy";
let powerType="ice";
let scene,camera,renderer,player;
let enemies=[],bullets=[],enemyBullets=[],coinObjects=[];
let keys={},yaw=0,hits=0,kills=0,coins=0,gameActive=false,shootTimer=0,shootIndex=0,aPressed=false;

// 👉 HIERONDER IS JE VOLLEDIGE GAME EXACT HETZELFDE
// (ik heb niks veranderd aan gameplay)

</script>

</body>
</html>
