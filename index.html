<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WASTAMA EILAND</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:Arial;
  color:white;
}

#difficultyMenu,#characterMenu,#gameOver,#gamesMenu{
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

#characterMenu,#gamesMenu{display:none;}

#hud{
  position:absolute;
  top:60px;
  left:20px;
  display:none;
}

#stats{
  position:absolute;
  top:10px;
  left:20px;
}

#shopButton,#gamesButton{
  position:absolute;
  top:10px;
  right:20px;
  background:#444;
  padding:10px;
  cursor:pointer;
}

#gamesButton{top:50px;}

#shopMenu{
  display:none;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:600px;
  height:400px;
  background:#111;
  border:3px solid white;
  padding:20px;
}

#gamesMenu{
  display:none;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:600px;
  height:400px;
  background:#111;
  border:3px solid white;
  padding:20px;
}

button{
  padding:12px;
  margin:5px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="stats">
  <div>Games gespeeld: <span id="played">0</span></div>
  <div>Games gewonnen: <span id="won">0</span></div>
  <div>Munten totaal: <span id="coinsTotal">0</span></div>
</div>

<div id="shopButton">SHOP</div>
<div id="gamesButton">SAMEN SPELLEN</div>

<div id="difficultyMenu">
  <h1>Kies moeilijkheid</h1>
  <button onclick="chooseDifficulty('easy')">🙂 Makkelijk</button>
  <button onclick="chooseDifficulty('hard')">😈 Moeilijk</button>
  <button onclick="chooseDifficulty('impossible')">💀 Impossible</button>
</div>

<div id="characterMenu">
  <h1>Kies je mannetje</h1>
  <button onclick="startGame('ice')">❄ IJs</button>
  <button onclick="startGame('fire')">🔥 Vuur</button>
  <button onclick="startGame('lightning')">⚡ Bliksem</button>
</div>

<div id="hud">
  <div>Hits: <span id="hp">0</span> / 3</div>
  <div>Gedood: <span id="kills">0</span></div>
  <div>Munten: <span id="coins">0</span></div>
</div>

<div id="gameOver" style="display:none">
  <h1 id="endText"></h1>
  <button onclick="location.reload()">Opnieuw spelen</button>
</div>

<!-- SHOP MET NIEUWE SKINS -->
<div id="shopMenu">
  <div style="position:absolute;right:10px;top:10px;cursor:pointer;font-size:20px" onclick="closeShop()">✖</div>
  <h2>SHOP</h2>
  <button onclick="buySkin('red',10)">Rode skin - 10 munten</button>
  <button onclick="buySkin('blue',10)">Blauwe skin - 10 munten</button>
  <button onclick="buySkin('gold',20)">Gouden skin - 20 munten</button>

  <!-- NIEUW -->
  <button onclick="buySkin('blueBall',40)">Blauwe bol - 40 munten</button>
  <button onclick="buySkin('greenTriangle',30)">Groene driehoek - 30 munten</button>
  <button onclick="buySkin('rainbow',60)">Rainbow blok - 60 munten</button>
</div>

<div id="gamesMenu">
  <div style="position:absolute;right:10px;top:10px;cursor:pointer;font-size:20px"
       onclick="closeGamesMenu()">✖</div>
  <h2>SAMEN SPELLEN</h2>
  <p>Hier komen straks nieuwe game opties</p>
</div>

<!-- NIEUWE MUZIEK -->
<iframe width="0" height="0"
src="https://www.youtube.com/embed/TddO_JZ-RDo?autoplay=1&loop=1&playlist=TddO_JZ-RDo&controls=0"
frameborder="0" allow="autoplay"></iframe>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// --- STATS ---
let gamesPlayed = parseInt(localStorage.getItem("played")) || 0;
let gamesWon = parseInt(localStorage.getItem("won")) || 0;
let totalCoins = parseInt(localStorage.getItem("coins")) || 0;
document.getElementById("played").innerText = gamesPlayed;
document.getElementById("won").innerText = gamesWon;
document.getElementById("coinsTotal").innerText = totalCoins;

// --- VARIABLES ---
let difficulty="easy";
let powerType="ice";
let scene,camera,renderer,player;
let enemies=[],bullets=[],enemyBullets=[],coinObjects=[],healthPacks=[];
let keys={},yaw=0,hits=0,kills=0,coins=0,gameActive=false,shootTimer=0,aPressed=false,abilityCooldown=0;
let ownedSkins = JSON.parse(localStorage.getItem("skins"))||["default"];
let currentSkin="default";

// --- SHOP ---
document.getElementById("shopButton").onclick = () => shopMenu.style.display="block";
function closeShop(){ shopMenu.style.display="none"; }
function buySkin(color,cost){
    if(totalCoins<cost){ alert("Niet genoeg munten"); return; }
    totalCoins-=cost;
    document.getElementById("coinsTotal").innerText = totalCoins;
    localStorage.setItem("coins",totalCoins);
    ownedSkins.push(color);
    localStorage.setItem("skins",JSON.stringify(ownedSkins));
    currentSkin=color;
    alert("Skin gekocht!");
}

// --- SAMEN SPELLEN MENU ---
document.getElementById("gamesButton").onclick = () => { document.getElementById("gamesMenu").style.display="block"; };
function closeGamesMenu() { document.getElementById("gamesMenu").style.display="none"; }

// --- MENU ---
function chooseDifficulty(mode){
    difficulty = mode;
    difficultyMenu.style.display="none";
    characterMenu.style.display="block";
}

// --- START GAME ---
function startGame(type){
    powerType = type;
    gamesPlayed++; localStorage.setItem("played",gamesPlayed);
    document.getElementById("played").innerText = gamesPlayed;
    characterMenu.style.display="none"; hud.style.display="block"; gameActive=true;

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,2000);
    renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth,window.innerHeight);
    document.body.appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff,1));

    let sea = new THREE.Mesh(new THREE.CircleGeometry(2000,64), new THREE.MeshBasicMaterial({color:0x1e90ff}));
    sea.rotation.x=-Math.PI/2; scene.add(sea);

    let island = new THREE.Mesh(new THREE.CircleGeometry(600,64), new THREE.MeshBasicMaterial({color:0x228B22}));
    island.rotation.x=-Math.PI/2; island.position.y=0.1; scene.add(island);

    // PLAYER MET NIEUWE SKINS
    if(currentSkin==="blueBall"){
        player = new THREE.Mesh(new THREE.SphereGeometry(8), new THREE.MeshBasicMaterial({color:0x0066ff}));
    }
    else if(currentSkin==="greenTriangle"){
        player = new THREE.Mesh(new THREE.ConeGeometry(8,12,3), new THREE.MeshBasicMaterial({color:0x00ff00}));
    }
    else if(currentSkin==="rainbow"){
        let geo = new THREE.BoxGeometry(8,12,8);
        let materials = [
            new THREE.MeshBasicMaterial({color:0xff0000}),
            new THREE.MeshBasicMaterial({color:0xff7f00}),
            new THREE.MeshBasicMaterial({color:0xffff00}),
            new THREE.MeshBasicMaterial({color:0x00ff00}),
            new THREE.MeshBasicMaterial({color:0x0000ff}),
            new THREE.MeshBasicMaterial({color:0x8b00ff})
        ];
        player = new THREE.Mesh(geo, materials);
    }
    else{
        let color=0x00ffff;
        if(currentSkin==="red") color=0xff0000;
        if(currentSkin==="blue") color=0x0066ff;
        if(currentSkin==="gold") color=0xffcc00;
        player = new THREE.Mesh(new THREE.BoxGeometry(8,12,8), new THREE.MeshBasicMaterial({color:color}));
    }

    player.position.y=6;
    scene.add(player);

    animate();
}

// --- ANIMATE ---
function animate(){
requestAnimationFrame(animate);
if(!gameActive) return;

camera.position.set(player.position.x,25,player.position.z+40);
camera.lookAt(player.position);
renderer.render(scene,camera);
}
</script>

</body>
</html>
