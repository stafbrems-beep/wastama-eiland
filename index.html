<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WASTAMA EILAND - FIXED SHOP</title>

<style>
body{margin:0;overflow:hidden;background:black;color:white;font-family:Arial;}
#shopButton{position:absolute;top:10px;right:20px;background:#444;padding:10px;cursor:pointer;}
#shopMenu{
display:none;
position:absolute;
top:50%;left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:20px;
border:3px solid white;
}
button{padding:10px;margin:5px;cursor:pointer;}
.owned{background:green;}
.selected{background:gold;color:black;}
</style>
</head>

<body>

<div id="shopButton">SHOP</div>

<div id="shopMenu">
<h2>SHOP</h2>
<div id="skins"></div>
<button onclick="closeShop()">Sluiten</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// ================== DATA ==================
let totalCoins = parseInt(localStorage.getItem("coins")) || 50;

let ownedSkins = JSON.parse(localStorage.getItem("skins")) || ["default"];
let currentSkin = localStorage.getItem("selectedSkin") || "default";

const skins = [
{ id:"red", name:"Rode kubus", cost:10 },
{ id:"blue", name:"Blauwe cilinder", cost:10 },
{ id:"gold", name:"Gouden kegel", cost:20 },
{ id:"purple", name:"Paarse bol", cost:15 },
{ id:"neon", name:"Neon ster", cost:25 }
];

// ================== SHOP ==================
shopButton.onclick = () => {
    shopMenu.style.display = "block";
    renderShop();
};

function closeShop(){
    shopMenu.style.display="none";
}

function renderShop(){
    skinsDiv.innerHTML = "";

    skins.forEach(skin => {
        let btn = document.createElement("button");

        if(ownedSkins.includes(skin.id)){
            btn.innerText = skin.name + " (GEKOCHT)";
            btn.classList.add("owned");

            if(currentSkin === skin.id){
                btn.classList.add("selected");
                btn.innerText = skin.name + " (Geselecteerd)";
            }

            btn.onclick = () => selectSkin(skin.id);
        }
        else{
            btn.innerText = skin.name + " - " + skin.cost + " munten";
            btn.onclick = () => buySkin(skin.id, skin.cost);
        }

        skinsDiv.appendChild(btn);
    });
}

// ================== BUY ==================
function buySkin(id, cost){

    if(ownedSkins.includes(id)){
        selectSkin(id);
        return;
    }

    if(totalCoins < cost){
        alert("Niet genoeg munten!");
        return;
    }

    totalCoins -= cost;
    localStorage.setItem("coins", totalCoins);

    ownedSkins.push(id);
    localStorage.setItem("skins", JSON.stringify(ownedSkins));

    selectSkin(id);

    alert("Skin gekocht!");
}

// ================== SELECT ==================
function selectSkin(id){
    currentSkin = id;
    localStorage.setItem("selectedSkin", id);
    renderShop();
}

// ================== GAME ==================
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
let renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// licht
scene.add(new THREE.AmbientLight(0xffffff,1));

// kleur map
let colorMap={
  red:0xff0000,
  blue:0x0066ff,
  gold:0xffcc00,
  purple:0x800080,
  neon:0x00ffea,
  default:0x00ffff
};

// geometry per skin
let geometry;
switch(currentSkin){
    case "red": geometry=new THREE.BoxGeometry(10,10,10); break;
    case "blue": geometry=new THREE.CylinderGeometry(5,5,10,16); break;
    case "gold": geometry=new THREE.ConeGeometry(6,12,16); break;
    case "purple": geometry=new THREE.SphereGeometry(6,16,16); break;
    case "neon": geometry=new THREE.IcosahedronGeometry(6); break;
    default: geometry=new THREE.BoxGeometry(10,10,10);
}

// player
let player = new THREE.Mesh(
    geometry,
    new THREE.MeshBasicMaterial({color: colorMap[currentSkin]})
);
scene.add(player);

// camera
camera.position.z = 30;

// animatie
function animate(){
    requestAnimationFrame(animate);
    player.rotation.x += 0.01;
    player.rotation.y += 0.01;
    renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
