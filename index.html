<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Spring Runner Example</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans flex flex-col items-center justify-center min-h-screen p-4 overflow-hidden">

  <div class="relative w-full max-w-4xl bg-sky-200 rounded-2xl shadow-2xl overflow-hidden border-4 border-slate-700">
    <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-center z-10 bg-slate-900/60 backdrop-blur-md font-bold">
      <div>Afstand: <span id="dist-text" class="text-yellow-400">0 m</span></div>
      <div>Munten: <span id="coin-text" class="text-amber-300">🪙 0</span></div>
      <div id="active-boost" class="hidden px-3 py-1 rounded-full text-xs uppercase tracking-wider animate-pulse"></div>
      <div>High Score: <span id="highscore-text" class="text-green-400">0 m</span></div>
    </div>

    <canvas id="gameCanvas" width="900" height="500" class="w-full h-auto block"></canvas>

    <div id="start-screen" class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm flex flex-col items-center justify-center text-center p-6 z-20">
      <h1 class="text-4xl font-black mb-4 text-amber-400">SPRING RUNNER</h1>
      <p class="text-gray-300 max-w-md mb-6 text-sm">
        Spring over monsters en kloven! Na een veer-lancering of boost land je ALTIJD veilig op land.
      </p>
      <button id="start-btn" class="px-8 py-4 bg-emerald-500 text-slate-900 font-extrabold text-xl rounded-xl shadow-lg">START GAME</button>
    </div>

    <div id="game-over-screen" class="hidden absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center text-center p-6 z-20">
      <h2 class="text-4xl font-black text-red-500 mb-2">GAME OVER!</h2>
      <p id="final-stats" class="text-lg text-slate-300 mb-6"></p>
      <button id="restart-btn" class="px-8 py-4 bg-amber-500 text-slate-900 font-extrabold text-xl rounded-xl shadow-lg">OPNIEUW PROBEREN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const distText = document.getElementById('dist-text');
    const coinText = document.getElementById('coin-text');
    const highscoreText = document.getElementById('highscore-text');
    const boostDisplay = document.getElementById('active-boost');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalStats = document.getElementById('final-stats');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    let highscore = localStorage.getItem('runner_highscore') || 0;
    highscoreText.innerText = `${highscore} m`;

    let isPlaying = false, cameraX = 0, distance = 0, coins = 0, gameSpeed = 5.5, lastPlatformX = 0;

    const player = {
      x: 100, y: 300, width: 32, height: 48, vx: 0, vy: 0,
      gravity: 0.55, jumpForce: -13.5, grounded: false,
      skinColor: '#f1c27d', hasShield: false, boostTimer: 0, boostType: null
    };

    let platforms = [], springs = [], enemies = [], coinsList = [], boostsList = [];

    window.addEventListener('keydown', e => {
      if (['Space', 'ArrowUp', 'KeyW'].includes(e.code) && isPlaying && player.grounded && !player.boostType) {
        player.vy = player.jumpForce;
        player.grounded = false;
      }
    });

    function resetGame() {
      isPlaying = true; cameraX = 0; distance = 0; coins = 0; gameSpeed = 5.5; lastPlatformX = 0;
      player.x = 100; player.y = 250; player.vy = 0; player.grounded = false; player.hasShield = false; player.boostTimer = 0; player.boostType = null;
      platforms = []; springs = []; enemies = []; coinsList = []; boostsList = [];
      platforms.push({ x: 0, y: 380, width: 800, height: 120 });
      lastPlatformX = 800;
      for (let i = 0; i < 5; i++) generateChunk();
      startScreen.classList.add('hidden'); gameOverScreen.classList.add('hidden');
      requestAnimationFrame(gameLoop);
    }

    function ensureSafeLandingPlatform(targetX, targetY) {
      const pWidth = 350;
      platforms.push({ x: targetX - 40, y: targetY, width: pWidth, height: 140 });
      if (targetX + pWidth > lastPlatformX) lastPlatformX = targetX + pWidth;
    }

    function generateChunk() {
      const difficulty = Math.min(distance / 500, 1);
      const gap = 50 + Math.random() * (80 * difficulty);
      const width = Math.max(180, 350 - (80 * difficulty));
      const y = 260 + Math.random() * 110;
      const x = lastPlatformX + gap;

      platforms.push({ x, y, width, height: 140 });

      if (Math.random() < 0.35) {
        const springX = x + 40 + Math.random() * (width - 100);
        springs.push({ x: springX, y: y - 16, width: 32, height: 16, compressed: false });
        ensureSafeLandingPlatform(springX + 360, y);
      }

      if (Math.random() < 0.35 + (0.25 * difficulty)) {
        const types = ['green', 'purple', 'red', 'blue'];
        enemies.push({
          x: x + width / 2, y: y - 28, width: 28, height: 28,
          type: types[Math.floor(Math.random() * types.length)],
          minX: x + 10, maxX: x + width - 38, speed: Math.random() < difficulty ? (1.2 + Math.random() * 1.5) : 0, dir: 1
        });
      }

      if (Math.random() < 0.7) {
        for (let c = 0; c < 3; c++) {
          coinsList.push({ x: x + 30 + c * 25, y: y - 40, radius: 8, collected: false });
        }
      }

      if (Math.random() < 0.25) {
        const types = ['star', 'shield', 'magnet'];
        boostsList.push({ x: x + width / 2, y: y - 65, radius: 12, type: types[Math.floor(Math.random() * types.length)], collected: false });
      }

      lastPlatformX = Math.max(lastPlatformX, x + width);
    }

    function update() {
      gameSpeed = 5.5 + Math.min(distance / 250, 5);
      player.x += gameSpeed;
      distance = Math.floor(player.x / 10);
      cameraX = player.x - 150;

      if (lastPlatformX - player.x < 1000) generateChunk();

      if (player.boostTimer > 0) {
        player.boostTimer--;
        if (player.boostType === 'star') { player.vy = -0.5; player.grounded = false; }
        if (player.boostTimer === 0) {
          ensureSafeLandingPlatform(player.x + 100, Math.min(player.y + 80, 360));
          player.boostType = null;
        }
      }

      if (player.boostType !== 'star') player.vy += player.gravity;
      player.y += player.vy;

      player.grounded = false;
      for (let p of platforms) {
        if (player.x + player.width > p.x && player.x < p.x + p.width && player.y + player.height >= p.y && player.y + player.height <= p.y + 20 && player.vy >= 0) {
          player.y = p.y - player.height; player.vy = 0; player.grounded = true;
        }
      }

      for (let s of springs) {
        if (player.x + player.width > s.x && player.x < s.x + s.width && player.y + player.height >= s.y && player.y + player.height <= s.y + s.height + 10 && player.vy >= 0) {
          s.compressed = true; player.vy = -18; player.grounded = false;
          setTimeout(() => s.compressed = false, 300);
          ensureSafeLandingPlatform(player.x + 380, 320);
        }
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        if (e.speed > 0) { e.x += e.speed * e.dir; if (e.x <= e.minX || e.x >= e.maxX) e.dir *= -1; }
        if (player.x + player.width > e.x && player.x < e.x + e.width && player.y + player.height > e.y && player.y < e.y + e.height) {
          if ((player.vy > 0 && player.y + player.height - player.vy <= e.y + 10) || player.boostType === 'star') {
            enemies.splice(i, 1); player.vy = -9;
          } else if (player.hasShield) {
            player.hasShield = false; enemies.splice(i, 1);
          } else { triggerGameOver(); return; }
        }
      }

      for (let c of coinsList) {
        if (c.collected) continue;
        if (player.boostType === 'magnet') {
          const dx = (player.x + player.width / 2) - c.x, dy = (player.y + player.height / 2) - c.y, dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 180) { c.x += (dx / dist) * 8; c.y += (dy / dist) * 8; }
        }
        if (player.x + player.width > c.x - c.radius && player.x < c.x + c.radius && player.y + player.height > c.y - c.radius && player.y < c.y + c.radius) {
          c.collected = true; coins++;
        }
      }

      for (let b of boostsList) {
        if (b.collected) continue;
        if (player.x + player.width > b.x - b.radius && player.x < b.x + b.radius && player.y + player.height > b.y - b.radius && player.y < b.y + b.radius) {
          b.collected = true;
          if (b.type === 'star') { player.boostType = 'star'; player.boostTimer = 180; }
          else if (b.type === 'shield') player.hasShield = true;
          else if (b.type === 'magnet') { player.boostType = 'magnet'; player.boostTimer = 300; }
        }
      }

      if (player.y > canvas.height + 100) triggerGameOver();

      distText.innerText = `${distance} m`; coinText.innerText = `🪙 ${coins}`;
      if (player.boostType === 'star') { boostDisplay.className = "px-3 py-1 rounded-full text-xs font-bold uppercase bg-amber-400 text-slate-900 block animate-pulse"; boostDisplay.innerText = "⭐ STAR GLIDE"; }
      else if (player.boostType === 'magnet') { boostDisplay.className = "px-3 py-1 rounded-full text-xs font-bold uppercase bg-purple-500 text-white block animate-pulse"; boostDisplay.innerText = "🧲 COIN MAGNET"; }
      else if (player.hasShield) { boostDisplay.className = "px-3 py-1 rounded-full text-xs font-bold uppercase bg-blue-500 text-white block"; boostDisplay.innerText = "🛡️ SCHILD ACTIEF"; }
      else boostDisplay.className = "hidden";
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save(); ctx.translate(-cameraX, 0);

      for (let p of platforms) {
        ctx.fillStyle = '#8B5A2B'; ctx.fillRect(p.x, p.y, p.width, p.height);
        ctx.fillStyle = '#4CAF50'; ctx.fillRect(p.x, p.y, p.width, 16);
      }

      for (let s of springs) {
        ctx.fillStyle = s.compressed ? '#E91E63' : '#FF5722';
        const h = s.compressed ? 8 : 16, yOffset = s.compressed ? 8 : 0;
        ctx.fillRect(s.x, s.y + yOffset, s.width, h);
        ctx.fillStyle = '#FFF'; ctx.fillRect(s.x + 4, s.y + yOffset + 3, s.width - 8, 3);
      }

      for (let c of coinsList) {
        if (c.collected) continue;
        ctx.beginPath(); ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#FFD700'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#B8860B'; ctx.stroke();
      }

      for (let b of boostsList) {
        if (b.collected) continue;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        if (b.type === 'star') ctx.fillStyle = '#FFD700';
        if (b.type === 'shield') ctx.fillStyle = '#2196F3';
        if (b.type === 'magnet') ctx.fillStyle = '#9C27B0';
        ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#FFF'; ctx.stroke();
      }

      for (let e of enemies) {
        ctx.fillStyle = e.type === 'green' ? '#4CAF50' : e.type === 'purple' ? '#9C27B0' : e.type === 'red' ? '#F44336' : '#2196F3';
        ctx.beginPath(); ctx.arc(e.x + e.width / 2, e.y + e.height / 2, e.width / 2, Math.PI, 0, false);
        ctx.lineTo(e.x + e.width, e.y + e.height); ctx.lineTo(e.x, e.y + e.height); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.arc(e.x + 10, e.y + 12, 4, 0, Math.PI * 2); ctx.arc(e.x + 18, e.y + 12, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(e.x + 10, e.y + 12, 2, 0, Math.PI * 2); ctx.arc(e.x + 18, e.y + 12, 2, 0, Math.PI * 2); ctx.fill();
      }

      if (player.hasShield) {
        ctx.beginPath(); ctx.arc(player.x + player.width / 2, player.y + player.height / 2, 28, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(33, 150, 243, 0.3)'; ctx.fill(); ctx.strokeStyle = '#2196F3'; ctx.stroke();
      }

      ctx.fillStyle = '#3E2723'; ctx.fillRect(player.x + 4, player.y + 22, player.width - 8, 26);
      ctx.fillStyle = player.skinColor; ctx.fillRect(player.x + 4, player.y + 6, player.width - 8, 18);
      ctx.fillStyle = '#1A1A1A'; ctx.fillRect(player.x + 2, player.y, player.width - 4, 8);
      ctx.fillStyle = '#000'; ctx.fillRect(player.x + 20, player.y + 12, 3, 4);

      ctx.restore();
    }

    function gameLoop() {
      if (!isPlaying) return;
      update(); draw(); requestAnimationFrame(gameLoop);
    }

    function triggerGameOver() {
      isPlaying = false;
      if (distance > highscore) { highscore = distance; localStorage.setItem('runner_highscore', highscore); highscoreText.innerText = `${highscore} m`; }
      finalStats.innerHTML = `Behaalde Afstand: <strong class="text-yellow-400">${distance} m</strong><br>Verzamelde Munten: <strong class="text-amber-300">🪙 ${coins}</strong>`;
      gameOverScreen.classList.remove('hidden');
    }

    startBtn.addEventListener('click', resetGame);
    restartBtn.addEventListener('click', resetGame);
  </script>
</body>
</html>
