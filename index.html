<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WASTAMA EILAND</title>
<style>
body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
color:white;
}
#usernameOverlay,#difficultyMenu,#characterMenu,#gameOver{
position:absolute;
top:40%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}
#usernameOverlay input{padding:10px;font-size:16px;margin-top:10px;}
#usernameOverlay button{padding:12px;margin-top:10px;font-size:16px;cursor:pointer;}
#characterMenu{display:none;}
#hud{
position:absolute;
top:60px;
left:20px;
display:none;
}
#stats{
position:absolute;
top:10px;
left:20px;
}
#shopButton,#playTogetherButton{
position:absolute;
top:10px;
right:20px;
background:#444;
padding:10px;
cursor:pointer;
margin-left:5px;
}
#playTogetherButton{right:160px;}
#shopMenu,#togetherMenu{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:600px;
height:400px;
background:#111;
border:3px solid white;
padding:20px;
}
button{
padding:12px;
margin:5px;
font-size:16px;
cursor:pointer;
}
#playerNameDisplay{
position:absolute;
top:40px;
left:20px;
font-size:18px;
font-weight:bold;
}
</style>
</head>
<body>

<div id="usernameOverlay">
<h1>Wat is je gebruikersnaam?</h1>
<input type="text" id="usernameInput" placeholder="Typ je naam hier">
<br>
<button onclick="setUsername()">Bevestig</button>
<p id="usernameError" style="color:red;"></p>
</div>

<div id="playerNameDisplay"></div>

<div id="stats">
<div>Games gespeeld: <span id="played">0</span></div>
<div>Games gewonnen: <span id="won">0</span></div>
<div>Munten totaal: <span id="coinsTotal">0</span></div>
</div>

<div id="shopButton">SHOP</div>
<div id="playTogetherButton">Samen Spellen</div>

<div id="difficultyMenu">
<h1>Kies moeilijkheid</h1>
<button onclick="chooseDifficulty('easy')">🙂 Makkelijk</button>
<button onclick="chooseDifficulty('hard')">😈 Moeilijk</button>
<button onclick="chooseDifficulty('impossible')">💀 Impossible</button>
</div>

<div id="characterMenu">
<h1>Kies je mannetje</h1>
<button onclick="startGame('ice')">❄ IJs</button>
<button onclick="startGame('fire')">🔥 Vuur</button>
<button onclick="startGame('lightning')">⚡ Bliksem</button>
</div>

<div id="hud">
<div>Hits: <span id="hp">0</span> / 3</div>
<div>Gedood: <span id="kills">0</span></div>
<div>Munten: <span id="coins">0</span></div>
</div>

<div id="gameOver" style="display:none">
<h1 id="endText"></h1>
<button onclick="location.reload()">Opnieuw spelen</button>
</div>

<div id="shopMenu">
<div style="position:absolute;right:10px;top:10px;cursor:pointer;font-size:20px"
onclick="closeShop()">✖</div>
<h2>SHOP</h2>
<button onclick="buySkin('red',10)">Rode skin - 10 munten</button>
<button onclick="buySkin('blue',10)">Blauwe skin - 10 munten</button>
<button onclick="buySkin('gold',20)">Gouden skin - 20 munten</button>
</div>

<div id="togetherMenu">
<div style="position:absolute;right:10px;top:10px;cursor:pointer;font-size:20px"
onclick="closeTogetherMenu()">✖</div>
<h2>Hier komen straks nieuwe game opties</h2>
</div>

<iframe width="0" height="0"
src="https://www.youtube.com/embed/7MeRV4YxjOM?autoplay=1&loop=1&playlist=7MeRV4YxjOM&controls=0"
frameborder="0" allow="autoplay"></iframe>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// --- USERNAME OVERLAY ---
let username = localStorage.getItem("username") || "";
if(username){
    document.getElementById("usernameOverlay").style.display="none";
    document.getElementById("playerNameDisplay").innerText=username;
}else{
    document.getElementById("usernameOverlay").style.display="block";
}

function setUsername(){
    let input=document.getElementById("usernameInput").value.trim();
    if(!/^[a-zA-Z]+$/.test(input)){
        document.getElementById("usernameError").innerText="Gebruik alleen letters!";
        return;
    }
    username=input;
    localStorage.setItem("username",username);
    document.getElementById("usernameOverlay").style.display="none";
    document.getElementById("playerNameDisplay").innerText=username;
}

// --- STATS ---
let gamesPlayed = parseInt(localStorage.getItem("played")) || 0;
let gamesWon = parseInt(localStorage.getItem("won")) || 0;
let totalCoins = parseInt(localStorage.getItem("coins")) || 0;
document.getElementById("played").innerText = gamesPlayed;
document.getElementById("won").innerText = gamesWon;
document.getElementById("coinsTotal").innerText = totalCoins;

// --- VARIABLES ---
let difficulty="easy";
let powerType="ice";
let scene,camera,renderer,player;
let enemies=[],bullets=[],enemyBullets=[],coinObjects=[],healthPacks=[];
let keys={};
let yaw=0;
let hits=0, kills=0, coins=0;
let gameActive=false;
let shootTimer=0, shootIndex=0, aPressed=false;
let abilityCooldown=0;
let ownedSkins = JSON.parse(localStorage.getItem("skins"))||["default"];
let currentSkin="default";

// --- SHOP ---
document.getElementById("shopButton").onclick = () => shopMenu.style.display="block";
function closeShop(){ shopMenu.style.display="none"; }
function buySkin(color,cost){
    if(totalCoins<cost){ alert("Niet genoeg munten"); return; }
    totalCoins-=cost;
    document.getElementById("coinsTotal").innerText = totalCoins;
    localStorage.setItem("coins",totalCoins);
    ownedSkins.push(color);
    localStorage.setItem("skins",JSON.stringify(ownedSkins));
    currentSkin=color;
    alert("Skin gekocht!");
}

// --- SAMEN SPELLEN MENU ---
document.getElementById("playTogetherButton").onclick = () => togetherMenu.style.display="block";
function closeTogetherMenu(){ togetherMenu.style.display="none"; }

// --- MENU FUNCTIONS ---
function chooseDifficulty(mode){
    difficulty = mode;
    difficultyMenu.style.display="none";
    characterMenu.style.display="block";
}

// --- START GAME ---
// (Hier komt de volledige Three.js game logica van jouw eerdere code, zoals hierboven, ongewijzigd)
</script>
</body>
</html>
