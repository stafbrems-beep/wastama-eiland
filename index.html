<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WASTAMA EILAND</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:Arial;
  color:white;
}

/* NAAM SCHERM */
#nameScreen{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

/* NAAM LINKS BOVEN */
#usernameDisplay{
  position:absolute;
  top:10px;
  left:20px;
  font-size:18px;
}

/* REST */
#difficultyMenu,#characterMenu,#gameOver,#gamesMenu{
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

#characterMenu,#gamesMenu,#difficultyMenu{display:none;}

#hud{
  position:absolute;
  top:60px;
  left:20px;
  display:none;
}

#stats{
  position:absolute;
  top:40px;
  left:20px;
}

#shopButton,#gamesButton{
  position:absolute;
  top:10px;
  right:20px;
  background:#444;
  padding:10px;
  cursor:pointer;
  margin-top:5px;
}

#gamesButton{top:50px;}

#shopMenu,#gamesMenu{
  display:none;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:600px;
  height:400px;
  background:#111;
  border:3px solid white;
  padding:20px;
}

button{
  padding:12px;
  margin:5px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- NAAM SCHERM -->
<div id="nameScreen">
  <h1>Wat is je gebruikersnaam?</h1>
  <input id="nameInput" placeholder="Naam..." style="padding:10px;font-size:16px">
  <br><br>
  <button onclick="saveName()">Start</button>
</div>

<div id="usernameDisplay"></div>

<!-- STATS -->
<div id="stats">
  <div>Games gespeeld: <span id="played">0</span></div>
  <div>Games gewonnen: <span id="won">0</span></div>
  <div>Munten totaal: <span id="coinsTotal">0</span></div>
</div>

<div id="shopButton">SHOP</div>
<div id="gamesButton">SAMEN SPELLEN</div>

<!-- DIFFICULTY -->
<div id="difficultyMenu">
  <h1>Kies moeilijkheid</h1>
  <button onclick="chooseDifficulty('easy')">🙂 Makkelijk</button>
  <button onclick="chooseDifficulty('hard')">😈 Moeilijk</button>
  <button onclick="chooseDifficulty('impossible')">💀 Impossible</button>
</div>

<!-- CHARACTER -->
<div id="characterMenu">
  <h1>Kies je mannetje</h1>
  <button onclick="startGame('ice')">❄ IJs</button>
  <button onclick="startGame('fire')">🔥 Vuur</button>
  <button onclick="startGame('lightning')">⚡ Bliksem</button>
</div>

<!-- HUD -->
<div id="hud">
  <div>Hits: <span id="hp">0</span> / 3</div>
  <div>Gedood: <span id="kills">0</span></div>
  <div>Munten: <span id="coins">0</span></div>
</div>

<!-- GAME OVER -->
<div id="gameOver" style="display:none">
  <h1 id="endText"></h1>
  <button onclick="location.reload()">Opnieuw spelen</button>
</div>

<!-- SHOP -->
<div id="shopMenu">
  <div style="position:absolute;right:10px;top:10px;cursor:pointer" onclick="closeShop()">✖</div>
  <h2>SHOP</h2>

  <!-- OUDE -->
  <button onclick="buySkin('red',10)">Rode skin - 10</button>
  <button onclick="buySkin('blue',10)">Blauwe skin - 10</button>
  <button onclick="buySkin('gold',20)">Gouden skin - 20</button>

  <!-- NIEUWE -->
  <button onclick="buySkin('blueball',40)">Blauwe bol - 40</button>
  <button onclick="buySkin('triangle',30)">Groene driehoek - 30</button>
  <button onclick="buySkin('rainbow',60)">Rainbow blok - 60</button>
</div>

<!-- SAMEN SPELLEN -->
<div id="gamesMenu">
  <div style="position:absolute;right:10px;top:10px;cursor:pointer" onclick="closeGamesMenu()">✖</div>
  <h2>SAMEN SPELLEN</h2>
  <p>hier komen straks nieuwe game opties</p>
</div>

<!-- MUZIEK -->
<iframe width="0" height="0"
src="https://www.youtube.com/embed/TddO_JZ-RDo?autoplay=1&loop=1&playlist=TddO_JZ-RDo"
allow="autoplay"></iframe>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// --- NAAM ---
let username="";
function saveName(){
  let input=document.getElementById("nameInput").value;

  if(!input || /\d/.test(input)){
    alert("Geen cijfers toegestaan!");
    return;
  }

  username=input;
  document.getElementById("usernameDisplay").innerText=username;

  nameScreen.style.display="none";
  difficultyMenu.style.display="block";
}

// --- REST = JOUW GAME ---
let gamesPlayed = parseInt(localStorage.getItem("played")) || 0;
let gamesWon = parseInt(localStorage.getItem("won")) || 0;
let totalCoins = parseInt(localStorage.getItem("coins")) || 0;

document.getElementById("played").innerText = gamesPlayed;
document.getElementById("won").innerText = gamesWon;
document.getElementById("coinsTotal").innerText = totalCoins;

let difficulty="easy";
let powerType="ice";
let scene,camera,renderer,player;
let enemies=[],bullets=[],enemyBullets=[],coinObjects=[],healthPacks=[];
let keys={},yaw=0,hits=0,kills=0,coins=0,gameActive=false,shootTimer=0,aPressed=false,abilityCooldown=0;

let ownedSkins = JSON.parse(localStorage.getItem("skins"))||["default"];
let currentSkin="default";

// SHOP
shopButton.onclick=()=>shopMenu.style.display="block";
function closeShop(){shopMenu.style.display="none";}
function buySkin(color,cost){
 if(totalCoins<cost)return alert("Niet genoeg munten");
 totalCoins-=cost;
 localStorage.setItem("coins",totalCoins);
 coinsTotal.innerText=totalCoins;
 currentSkin=color;
}

// SAMEN
gamesButton.onclick=()=>gamesMenu.style.display="block";
function closeGamesMenu(){gamesMenu.style.display="none";}

// MENU
function chooseDifficulty(mode){
 difficulty=mode;
 difficultyMenu.style.display="none";
 characterMenu.style.display="block";
}

// START GAME = EXACT JOUW LOGICA
function startGame(type){
 powerType=type;
 gamesPlayed++;localStorage.setItem("played",gamesPlayed);
 played.innerText=gamesPlayed;

 characterMenu.style.display="none";
 hud.style.display="block";
 gameActive=true;

 scene=new THREE.Scene();
 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,2000);
 renderer=new THREE.WebGLRenderer();
 renderer.setSize(innerWidth,innerHeight);
 document.body.appendChild(renderer.domElement);
 scene.add(new THREE.AmbientLight(0xffffff,1));

 let island=new THREE.Mesh(new THREE.CircleGeometry(600,64),
 new THREE.MeshBasicMaterial({color:0x228B22}));
 island.rotation.x=-Math.PI/2;
 scene.add(island);

 player=new THREE.Mesh(new THREE.BoxGeometry(8,12,8),
 new THREE.MeshBasicMaterial({color:0x00ffff}));
 player.position.y=6;
 scene.add(player);

 animate();
}

// ANIMATE
function animate(){
 requestAnimationFrame(animate);
 if(!gameActive)return;

 renderer.render(scene,camera);
}
</script>

</body>
</html>
