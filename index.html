<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WASTAMA EILAND</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:Arial;
  color:white;
}

/* NAAM SCHERM */
#nameScreen{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

#usernameDisplay{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  font-size:20px;
  display:none;
}

/* MENUS */
#difficultyMenu,#characterMenu,#gameOver,#gamesMenu{
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

#characterMenu,#gamesMenu,#difficultyMenu{display:none;}

#hud{
  position:absolute;
  top:60px;
  left:20px;
  display:none;
}

#stats{
  position:absolute;
  top:10px;
  left:20px;
}

#shopButton,#gamesButton{
  position:absolute;
  top:10px;
  right:20px;
  background:#444;
  padding:10px;
  cursor:pointer;
  margin-top:5px;
}

#gamesButton{top:50px;}

#shopMenu,#gamesMenu{
  display:none;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:600px;
  height:400px;
  background:#111;
  border:3px solid white;
  padding:20px;
}

button{
  padding:12px;
  margin:5px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- NAAM INPUT -->
<div id="nameScreen">
  <h1>Wat is je gebruikersnaam?</h1>
  <input id="nameInput" placeholder="Naam (geen cijfers)">
  <br><br>
  <button onclick="saveName()">Start</button>
</div
