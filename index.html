<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WASTAMA EILAND - Skins & Muziek</title>
<style>
body{margin:0;overflow:hidden;background:black;font-family:Arial;color:white;}
#difficultyMenu,#characterMenu,#gameOver{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);text-align:center;}
#characterMenu{display:none;}
#hud{position:absolute;top:60px;left:20px;display:none;}
#stats{position:absolute;top:10px;left:20px;}
#shopButton{position:absolute;top:10px;right:20px;background:#444;padding:10px;cursor:pointer;}
#shopMenu{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:450px;background:#111;border:3px solid white;padding:20px;overflow:auto;}
button{padding:12px;margin:5px;font-size:16px;cursor:pointer;}
</style>
</head>
<body>

<div id="stats">
<div>Games gespeeld: <span id="played">0</span></div>
<div>Games gewonnen: <span id="won">0</span></div>
<div>Munten totaal: <span id="coinsTotal">0</span></div>
</div>

<div id="shopButton">SHOP</div>

<div id="difficultyMenu">
<h1>Kies moeilijkheid</h1>
<button onclick="chooseDifficulty('easy')">🙂 Makkelijk</button>
<button onclick="chooseDifficulty('hard')">😈 Moeilijk</button>
<button onclick="chooseDifficulty('impossible')">💀 Impossible</button>
</div>

<div id="characterMenu">
<h1>Kies je mannetje</h1>
<button onclick="startGame('ice')">❄ IJs</button>
<button onclick="startGame('fire')">🔥 Vuur</button>
<button onclick="startGame('lightning')">⚡ Bliksem</button>
</div>

<div id="hud">
<div>Hits: <span id="hp">0</span> / 3</div>
<div>Gedood: <span id="kills">0</span></div>
<div>Munten: <span id="coins">0</span></div>
</div>

<div id="gameOver" style="display:none">
<h1 id="endText"></h1>
<button onclick="restartGame()">Opnieuw spelen</button>
</div>

<div id="shopMenu">
<div style="position:absolute;right:10px;top:10px;cursor:pointer;font-size:20px" onclick="closeShop()">✖</div>
<h2>SHOP</h2>
<div id="skinButtons"></div>
</div>

<iframe id="bgMusic" width="0" height="0"
src="https://www.youtube.com/embed/TddO_JZ-RDo?autoplay=1&loop=1&playlist=TddO_JZ-RDo&controls=0"
frameborder="0" allow="autoplay"></iframe>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
//--- Stats & Skins ---
let gamesPlayed=parseInt(localStorage.getItem("played"))||0;
let gamesWon=parseInt(localStorage.getItem("won"))||0;
let totalCoins=parseInt(localStorage.getItem("coins"))||0;
let ownedSkins=JSON.parse(localStorage.getItem("skins"))||["default"];
let currentSkin=ownedSkins[0];
played.innerText=gamesPlayed;
won.innerText=gamesWon;
coinsTotal.innerText=totalCoins;

let difficulty="easy";
let powerType="ice";
let scene,camera,renderer,player;
let enemies=[],bullets=[],enemyBullets=[],coinObjects=[];
let keys={},yaw=0,hits=0,kills=0,coins=0,gameActive=false,shootTimer=0,shootIndex=0,aPressed=false,botShootTimer=0;

// Skins
let skinsData=[
{name:"Rode kubus", id:"red", geom:"BoxGeometry", color:0xff0000, cost:500},
{name:"Blauwe cilinder", id:"blue", geom:"CylinderGeometry", color:0x0066ff, cost:600},
{name:"Gouden kegel", id:"gold", geom:"ConeGeometry", color:0xffcc00, cost:1000},
{name:"Paarse bol", id:"purple", geom:"SphereGeometry", color:0x800080, cost:800},
{name:"Neon ster", id:"neon", geom:"IcosahedronGeometry", color:0x00ffea, cost:1500},
{name:"IJsblok", id:"iceblock", geom:"BoxGeometry", color:0x99ccff, cost:1200},
{name:"Vuurvlam", id:"flame", geom:"ConeGeometry", color:0xff6600, cost:1800},
{name:"default", geom:"BoxGeometry", color:0x00ffff, cost:0}
];

//--- Shop ---
function updateShop(){
  let container=document.getElementById("skinButtons"); container.innerHTML="";
  for(let s of skinsData){
    if(!ownedSkins.includes(s.id) && s.cost>0){
      let btn=document.createElement("button"); btn.innerText=s.name+" - "+s.cost+" munten";
      btn.onclick=()=>buySkin(s.id,s.cost); container.appendChild(btn);
    } else {
      let btn=document.createElement("button"); btn.innerText="Gebruik "+s.name;
      btn.onclick=()=>{currentSkin=s.id; alert(s.name+" geselecteerd!");};
      container.appendChild(btn);
    }
  }
}
updateShop();
shopButton.onclick=()=>shopMenu.style.display="block";
function closeShop(){shopMenu.style.display="none";}
function buySkin(skin,cost){
  if(totalCoins<cost){alert("Niet genoeg munten");return;}
  totalCoins-=cost; coinsTotal.innerText=totalCoins; localStorage.setItem("coins",totalCoins);
  if(!ownedSkins.includes(skin)){ownedSkins.push(skin); localStorage.setItem("skins",JSON.stringify(ownedSkins));}
  currentSkin=skin; alert("Skin gekocht!"); updateShop();
}

//--- Difficulty ---
function chooseDifficulty(mode){difficulty=mode; difficultyMenu.style.display="none"; characterMenu.style.display="block";}

//--- Start / Restart Game ---
function restartGame(){gameOver.style.display="none";hud.style.display="none";difficultyMenu.style.display="block";}

//--- Event listeners: één keer ---
document.addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.code==="Space")shoot();if(e.key.toLowerCase()==="a")aPressed=true;});
document.addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;if(e.key.toLowerCase()==="a")aPressed=false;});
document.addEventListener("click",shoot);
document.addEventListener("mousemove",e=>{yaw-=e.movementX*0.002;});

//--- Start Game ---
function startGame(type){
  powerType=type;
  gamesPlayed++; localStorage.setItem("played",gamesPlayed); played.innerText=gamesPlayed;
  characterMenu.style.display="none"; hud.style.display="block"; gameActive=true;
  
  // Verwijder oude renderer als die bestaat
  if(renderer){renderer.domElement.remove(); renderer.dispose();}

  // Reset arrays
  enemies=[]; bullets=[]; enemyBullets=[]; coinObjects=[];
  hits=0; kills=0; coins=0; shootTimer=0; shootIndex=0; botShootTimer=0;
  document.getElementById("hp").innerText=hits; document.getElementById("kills").innerText=kills; document.getElementById("coins").innerText=coins;

  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,2000);
  renderer=new THREE.WebGLRenderer(); renderer.setSize(window.innerWidth,window.innerHeight);
  document.body.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,1));

  // Zee en eiland
  let sea=new THREE.Mesh(new THREE.CircleGeometry(2000,64),new THREE.MeshBasicMaterial({color:0x1e90ff}));
  sea.rotation.x=-Math.PI/2; scene.add(sea);
  let island=new THREE.Mesh(new THREE.CircleGeometry(600,64),new THREE.MeshBasicMaterial({color:0x228B22}));
  island.rotation.x=-Math.PI/2; island.position.y=0.1; scene.add(island);

  // Trees
  for(let i=0;i<25;i++){let trunk=new THREE.Mesh(new THREE.CylinderGeometry(2,2,20),new THREE.MeshBasicMaterial({color:0x8b4513}));let leaves=new THREE.Mesh(new THREE.ConeGeometry(10,25,8),new THREE.MeshBasicMaterial({color:0x228B22}));trunk.position.set((Math.random()-0.5)*900,10,(Math.random()-0.5)*900);leaves.position.set(trunk.position.x,25,trunk.position.z);scene.add(trunk);scene.add(leaves);}
  
  // Rocks
  for(let i=0;i<15;i++){let rock=new THREE.Mesh(new THREE.DodecahedronGeometry(15),new THREE.MeshBasicMaterial({color:0x777777}));rock.position.set((Math.random()-0.5)*900,8,(Math.random()-0.5)*900);scene.add(rock);}

  // Player
  let s = skinsData.find(s=>s.id===currentSkin);
  let geom; switch(s.geom){case "BoxGeometry":geom=new THREE.BoxGeometry(8,12,8);break;case "CylinderGeometry":geom=new THREE.CylinderGeometry(6,6,12,16);break;case "ConeGeometry":geom=new THREE.ConeGeometry(8,16,16);break;case "SphereGeometry":geom=new THREE.SphereGeometry(7,16,16);break;case "IcosahedronGeometry":geom=new THREE.IcosahedronGeometry(8,0);break;}
  player=new THREE.Mesh(geom,new THREE.MeshBasicMaterial({color:s.color})); player.position.y=(geom.parameters.height||12)/2; scene.add(player);

  // Bots
  let botCount=(difficulty==="easy")?5:(difficulty==="hard"?10:23);
  for(let i=0;i<botCount;i++){let bot=new THREE.Mesh(new THREE.BoxGeometry(8,12,8),new THREE.MeshBasicMaterial({color:0xffffff}));bot.position.set((Math.random()-0.5)*500,6,(Math.random()-0.5)*500);bot.userData.moveDir=new THREE.Vector3(Math.random()-0.5,0,Math.random()-0.5).normalize();bot.userData.freeze=0;bot.userData.noShoot=0;bot.userData.permaFreeze=false;scene.add(bot);enemies.push(bot);}

  // Coins
  let coinCount=(difficulty==="easy")?5:(difficulty==="hard"?7:10);
  for(let i=0;i<coinCount;i++){let coin=new THREE.Mesh(new THREE.CylinderGeometry(4,4,2,16),new THREE.MeshBasicMaterial({color:0xffff00}));coin.rotation.x=Math.PI/2;coin.position.set((Math.random()-0.5)*500,6,(Math.random()-0.5)*500);scene.add(coin);coinObjects.push(coin);}
  
  animate();
}

//--- Functies: explode, shoot, shootBot, endGame, animate ---
function explode(pos){let geo=new THREE.SphereGeometry(6);let mat=new THREE.MeshBasicMaterial({color:0xff6600});let boom=new THREE.Mesh(geo,mat);boom.position.copy(pos);scene.add(boom);setTimeout(()=>scene.remove(boom),300);}
function shoot(){if(!player) return;let b=new THREE.Mesh(new THREE.SphereGeometry(2),new THREE.MeshBasicMaterial({color:0xffffff}));b.position.copy(player.position);b.userData.dir=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));scene.add(b);bullets.push(b);}
function shootBot(bot){let dir=player.position.clone().sub(bot.position).normalize();let b=new THREE.Mesh(new THREE.SphereGeometry(2),new THREE.MeshBasicMaterial({color:0xff0000}));b.position.copy(bot.position);b.userData.dir=dir;scene.add(b);enemyBullets.push(b);}
function endGame(text){gameActive=false;endText.innerText=text;gameOver.style.display="block";}

//--- Animate ---
function animate(){requestAnimationFrame(animate);if(!gameActive) return;
for(let c of coinObjects)c.rotation.y+=0.05;
if(keys["arrowup"]||keys["z"])player.position.z-=4;if(keys["arrowdown"]||keys["s"])player.position.z+=4;if(keys["arrowleft"]||keys["q"])player.position.x-=4;if(keys["arrowright"]||keys["d"])player.position.x+=4;if(player.position.length()>600)endGame("VERDRONKEN");

// Bullets vs Bots
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.position.add(b.userData.dir.clone().multiplyScalar(10));
for(let j=enemies.length-1;j>=0;j--){let bot=enemies[j];if(b.position.distanceTo(bot.position)<8){explode(bot.position);if(aPressed){if(powerType==="ice")bot.userData.freeze=180;if(powerType==="fire")bot.userData.noShoot=360;if(powerType==="lightning")bot.userData.permaFreeze=true;}scene.remove(bot);enemies.splice(j,1);kills++;document.getElementById("kills").innerText=kills;scene.remove(b);bullets.splice(i,1);if(enemies.length===0){gamesWon++;localStorage.setItem("won",gamesWon);let reward=(difficulty==="easy"?3:(difficulty==="hard"?5:7));totalCoins+=reward+coins;localStorage.setItem("coins",totalCoins);endGame("GEWONNEN!");}break;}}}

// Coins
for(let i=coinObjects.length-1;i>=0;i--){let c=coinObjects[i];if(player.position.distanceTo(c.position)<10){scene.remove(c);coinObjects.splice(i,1);coins++;document.getElementById("coins").innerText=coins;}}

// Enemy movement
for(let bot of enemies){if(bot.userData.permaFreeze)continue;if(bot.userData.freeze>0){bot.userData.freeze--;continue;}bot.position.add(bot.userData.moveDir.clone().multiplyScalar(0.5));if(Math.random()<0.02)bot.userData.moveDir=new THREE.Vector3(Math.random()-0.5,0,Math.random()-0.5).normalize();}

// Impossible: bots schieten tegelijk elke 1 sec
botShootTimer++;if(difficulty==="impossible" && botShootTimer>60){botShootTimer=0;for(let bot of enemies)shootBot(bot);}

// Enemy bullets
for(let i=enemyBullets.length-1;i>=0;i--){let b=enemyBullets[i];b.position.add(b.userData.dir.clone().multiplyScalar(8));if(b.position.distanceTo(player.position)<8){hits++;document.getElementById("hp").innerText=hits;scene.remove(b);enemyBullets.splice(i,1);if(hits>=3)endGame("GAME OVER");}}

// Camera
camera.position.x=player.position.x-Math.sin(yaw)*40;camera.position.z=player.position.z+Math.cos(yaw)*40;camera.position.y=25;camera.lookAt(player.position);
renderer.render(scene,camera);
}
</script>
</body>
</html>
