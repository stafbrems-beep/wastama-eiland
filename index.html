<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WASTAMA VOETBAL 2026</title>
<style>
:root {
  color-scheme: dark;
  --lime: #a6ff00;
  --glass: rgba(8,13,22,.85);
  --line: rgba(255,255,255,.2);
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050b07;
  font-family: 'Segoe UI', system-ui, sans-serif;
}
canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}
#hud {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  pointer-events: none;
  user-select: none;
  z-index: 10;
}
.panel {
  background: var(--glass);
  padding: 10px 20px;
  border-radius: 8px;
  border: 1px solid var(--line);
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  text-align: center;
}
#scoreboard {
  min-width: 240px;
}
#scoreline {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 2px;
  color: #fff;
}
#clockline {
  font-size: 12px;
  color: #888;
  margin-top: 4px;
  font-weight: 600;
}
#status {
  font-size: 14px;
  font-weight: 700;
  color: var(--lime);
  letter-spacing: 1px;
  text-transform: uppercase;
}
</style>
</head>
<body>

<div id="hud">
  <div id="scoreboard" class="panel">
    <div id="scoreline">HOM 00 — 00 AWY</div>
    <div id="clockline">
      <span id="clock">00:00</span> · <span id="half">WASTAMA MATCH</span>
    </div>
  </div>
  <div id="status" class="panel">Aftrap - Gebruik Pijltjestoetsen & Spatiebalk</div>
</div>

<script src="https://jsdelivr.net"></script>

<script>
(() => {
  'use strict';

  const THREE = window.THREE;
  if (!THREE) {
    document.getElementById('status').textContent = 'THREE.JS LAADFOUT';
    return;
  }

  // Veldafmetingen en Constanten
  const PITCH_W = 105;
  const PITCH_H = 68;
  const HALF_W = PITCH_W / 2;
  const HALF_H = PITCH_H / 2;
  const BALL_R = 0.18;
  const MAX_SPEED = 7.5; 
  const ACCEL = 35.0;
  const FRICTION = 4.0;

  // Variabelen van de Engine
  let scene, camera, renderer;
  let ball, ballVelocity = new THREE.Vector3(), ballHasPossession = false, possessor = null;
  let teamA = [], teamB = []; 
  let activePlayer = null;
  let playerIndicator;
  
  let scoreA = 0, scoreB = 0;
  let matchTime = 0; 
  let gameFrozen = false;
  let resetTimer = 0;

  const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

  // Formatie Linies (X en Z posities)
  const formationA = [
    { role: 'GK', x: -48, z: 0 },
    { role: 'DEF', x: -30, z: -15 }, { role: 'DEF', x: -35, z: 0 }, { role: 'DEF', x: -30, z: 15 },
    { role: 'MID', x: -10, z: -20 }, { role: 'MID', x: -12, z: 0 }, { role: 'MID', x: -10, z: 20 },
    { role: 'ATT', x: 15, z: -15 }, { role: 'ATT', x: 20, z: 0 }, { role: 'ATT', x: 15, z: 15 }, { role: 'ATT', x: 5, z: 0 }
  ];

  const formationB = [
    { role: 'GK', x: 48, z: 0 },
    { role: 'DEF', x: 30, z: -15 }, { role: 'DEF', x: 35, z: 0 }, { role: 'DEF', x: 30, z: 15 },
    { role: 'MID', x: 10, z: -20 }, { role: 'MID', x: 12, z: 0 }, { role: 'MID', x: 10, z: 20 },
    { role: 'ATT', x: -15, z: -15 }, { role: 'ATT', x: -20, z: 0 }, { role: 'ATT', x: -15, z: 15 }, { role: 'ATT', x: -5, z: 0 }
  ];

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x152b19); 
    scene.fog = new THREE.FogExp2(0x152b19, 0.006);

    camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 1, 200);
    camera.position.set(0, 36, 46); 
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(15, 50, 25);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    buildPitch();
    buildPlayers();
    buildBall();
    buildIndicator();

    window.addEventListener('keydown', (e) => {
      if (e.key in keys) keys[e.key] = true;
      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        handleSpacebarAction();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key in keys) keys[e.key] = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    resetMatchToKickoff(true);
    animate();
  }

  function buildPitch() {
    const pitchGeo = new THREE.PlaneGeometry(PITCH_W, PITCH_H);
    const pitchMat = new THREE.MeshStandardMaterial({ color: 0x245e2c, roughness: 0.9 });
    const pitchMesh = new THREE.Mesh(pitchGeo, pitchMat);
    pitchMesh.rotation.x = -Math.PI / 2;
    pitchMesh.receiveShadow = true;
    scene.add(pitchMesh);

    const centerCircleGeo = new THREE.RingGeometry(9.15, 9.35, 64);
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
    const centerCircle = new THREE.Mesh(centerCircleGeo, lineMat);
    centerCircle.rotation.x = -Math.PI / 2;
    centerCircle.position.y = 0.02;
    scene.add(centerCircle);

    const centerLineGeo = new THREE.PlaneGeometry(0.2, PITCH_H);
    const centerLine = new THREE.Mesh(centerLineGeo, lineMat);
    centerLine.rotation.x = -Math.PI / 2;
    centerLine.position.y = 0.02;
    scene.add(centerLine);

    buildGoal(-HALF_W);
    buildGoal(HALF_W);
  }

  function buildGoal(xPos) {
    const goalGroup = new THREE.Group();
    const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.1 });
    const postGeo = new THREE.CylinderGeometry(0.1, 0.1, 2.44, 16);
    
    const leftPost = new THREE.Mesh(postGeo, postMat);
    leftPost.position.set(0, 1.22, -3.66);
    goalGroup.add(leftPost);

    const rightPost = new THREE.Mesh(postGeo, postMat);
    rightPost.position.set(0, 1.22, 3.66);
    goalGroup.add(rightPost);

    const barGeo = new THREE.CylinderGeometry(0.1, 0.1, 7.32, 16);
    const crossbar = new THREE.Mesh(barGeo, postMat);
    crossbar.rotation.z = Math.PI / 2;
    crossbar.position.set(0, 2.44, 0);
    goalGroup.add(crossbar);

    goalGroup.position.set(xPos, 0, 0);
    if(xPos < 0) goalGroup.rotation.y = Math.PI / 2;
    else goalGroup.rotation.y = -Math.PI / 2;
    scene.add(goalGroup);
  }

  function createHumanoidMesh(jerseyColor) {
    const group = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: jerseyColor, roughness: 0.5 });
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xffe0bd, roughness: 0.6 });

    const torsoGeo = new THREE.CylinderGeometry(0.35, 0.28, 1.2, 16);
    const torso = new THREE.Mesh(torsoGeo, bodyMat);
    torso.position.y = 1.1;
    torso.castShadow = true;
    group.add(torso);

    const headGeo = new THREE.SphereGeometry(0.24, 16, 16);
    const head = new THREE.Mesh(headGeo, skinMat);
    head.position.y = 1.82;
    head.castShadow = true;
    group.add(head);

    const legGeo = new THREE.CylinderGeometry(0.11, 0.09, 0.6, 16);
    const leftLeg = new THREE.Mesh(legGeo, bodyMat);
    leftLeg.position.set(-0.18, 0.3, 0);
    leftLeg.castShadow = true;
    group.add(leftLeg);

    const rightLeg = new THREE.Mesh(legGeo, bodyMat);
    rightLeg.position.set(0.18, 0.3, 0);
    rightLeg.castShadow = true;
    group.add(rightLeg);

    return { root: group, leftLeg, rightLeg };
  }

  function buildPlayers() {
    formationA.forEach((pos, index) => {
      const p = createHumanoidMesh(0xcc1111);
      p.root.position.set(pos.x, 0, pos.z);
      scene.add(p.root);
      teamA.push({
        id: 'A' + index, team: 'A', role: pos.role, base: new THREE.Vector3(pos.x, 0, pos.z),
        pos: p.root.position, vel: new THREE.Vector3(), meshData: p, hasBall: false
      });
    });

    formationB.forEach((pos, index) => {
      const p = createHumanoidMesh(0x1111cc);
      p.root.position.set(pos.x, 0, pos.z);
      scene.add(p.root);
      teamB.push({
        id: 'B' + index, team: 'B', role: pos.role, base: new THREE.Vector3(pos.x, 0, pos.z),
        pos: p.root.position, vel: new THREE.Vector3(), meshData: p, hasBall: false
      });
    });

    activePlayer = teamA[8]; // De rode centrale aanvaller start als actieve speler
  }

  function buildBall() {
    const ballGeo = new THREE.SphereGeometry(BALL_R, 32, 32);
    const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
    ball = new THREE.Mesh(ballGeo, ballMat);
    ball.position.set(0, BALL_R, 0);
    ball.castShadow = true;
    scene.add(ball);
  }

  function buildIndicator() {
    const indGeo = new THREE.ConeGeometry(0.22, 0.45, 4);
    const indMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    playerIndicator = new THREE.Mesh(indGeo, indMat);
    playerIndicator.rotation.x = Math.PI; 
    scene.add(playerIndicator);
  }

  function handleSpacebarAction() {
    if (gameFrozen || !activePlayer) return;

    if (ballHasPossession && possessor === activePlayer) {
      const distanceToGoal = activePlayer.pos.distanceTo(new THREE.Vector3(HALF_W, 0, 0));

      if (distanceToGoal < 26) {
        // HARD SCHOT OP DOEL
        document.getElementById('status').textContent = "Uithaal op doel!";
        ballHasPossession = false;
        possessor.hasBall = false;
        possessor = null;

        const targetGoal = new THREE.Vector3(HALF_W, 0.4, (Math.random() - 0.5) * 5.2);
Wees voorzichtig met code.
const shootDir = new THREE.Vector3().subVectors(targetGoal, ball.position).normalize();
ballVelocity.copy(shootDir).multiplyScalar(27.0);
} else {
// PASS LOGICA
let bestTeammate = null;
let maxDot = -1;
let lookDir = new THREE.Vector3(1, 0, 0);
if (activePlayer.vel.lengthSq() > 0.1) {
lookDir.copy(activePlayer.vel).normalize();
}
teamA.forEach(teammate => {
if (teammate !== activePlayer && teammate.role !== 'GK') {
const toTeammate = new THREE.Vector3().subVectors(teammate.pos, activePlayer.pos).normalize();
const dot = lookDir.dot(toTeammate);
if (dot > maxDot) {
maxDot = dot;
bestTeammate = teammate;
}
}
});
if (bestTeammate && maxDot > 0.25) {
document.getElementById('status').textContent = "Strakke pass!";
ballHasPossession = false;
possessor.hasBall = false;
possessor = null;
const passDir = new THREE.Vector3().subVectors(bestTeammate.pos, ball.position).normalize();
ballVelocity.copy(passDir).multiplyScalar(16.5);
}
}
}
}
function resetMatchToKickoff(isStart) {
ballVelocity.set(0, 0, 0);
teamA.forEach(p => { p.pos.copy(p.base); p.vel.set(0,0,0); p.hasBall = false; });
teamB.forEach(p => { p.pos.copy(p.base); p.vel.set(0,0,0); p.hasBall = false; });
activePlayer = teamA[8];
if (isStart || scoreB > scoreA) {
possessor = teamA[8];
} else {
possessor = teamB[8];
}
ball.position.set(possessor.pos.x + 0.4, BALL_R, possessor.pos.z);
ballHasPossession = true;
possessor.hasBall = true;
gameFrozen = false;
}
let lastTime = performance.now();
function animate() {
requestAnimationFrame(animate);
const currentTime = performance.now();
let dt = (currentTime - lastTime) / 1000;
if (dt > 0.1) dt = 0.1;
lastTime = currentTime;
if (!gameFrozen) {
matchTime += dt * 4;
updateClockUI();
updateGameplay(dt);
} else {
resetTimer -= dt;
if (resetTimer <= 0) {
resetMatchToKickoff(false);
}
}
// Foutloze TV Broadcast Camera X-volging
camera.position.x += (ball.position.x - camera.position.x) * 0.05;
camera.lookAt(ball.position.x, 0, 0);
if (activePlayer) {
playerIndicator.position.set(activePlayer.pos.x, 2.4 + Math.sin(currentTime * 0.006) * 0.1, activePlayer.pos.z);
playerIndicator.rotation.y += 0.03;
}
renderer.render(scene, camera);
}
function updateClockUI() {
const minutes = Math.floor(matchTime / 60);
const seconds = Math.floor(matchTime % 60);
document.getElementById('clock').textContent =
(minutes < 10 ? '0' : '') + minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
}
function updateGameplay(dt) {
// 1. HANDMATIGE PIJLTJESTOETSEN BESTURING
let moveX = 0, moveZ = 0;
if (keys.ArrowUp) moveZ = -1;
if (keys.ArrowDown) moveZ = 1;
if (keys.ArrowLeft) moveX = -1;
if (keys.ArrowRight) moveX = 1;
let inputDir = new THREE.Vector3(moveX, 0, moveZ);
if (inputDir.lengthSq() > 0) {
inputDir.normalize();
activePlayer.vel.addScaledVector(inputDir, ACCEL * dt);
if (activePlayer.vel.length() > MAX_SPEED) activePlayer.vel.setLength(MAX_SPEED);
} else {
activePlayer.vel.addScaledVector(activePlayer.vel, -FRICTION * dt);
}
activePlayer.pos.addScaledVector(activePlayer.vel, dt);
animateLegs(activePlayer, dt);
limitToPitch(activePlayer.pos);
if (activePlayer.vel.lengthSq() > 0.01) {
activePlayer.meshData.root.lookAt(activePlayer.pos.x + activePlayer.vel.x, activePlayer.pos.y, activePlayer.pos.z + activePlayer.vel.z);
}
// 2. BALL MOTOR LOGICA
if (ballHasPossession && possessor) {
const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(possessor.meshData.root.quaternion);
ball.position.copy(possessor.pos).addScaledVector(forward, 0.45);
ball.position.y = BALL_R;
ballVelocity.set(0, 0, 0);
} else {
ball.position.addScaledVector(ballVelocity, dt);
ballVelocity.addScaledVector(ballVelocity, -GRASS_FRICTION * dt);
checkGoalTriggers();
}
// 3. STRATEGISCH POSITIESYSTEEM + MAX 2 JAGERS
teamA.forEach(p => p.distToBall = p.pos.distanceTo(ball.position));
teamB.forEach(p => p.distToBall = p.pos.distanceTo(ball.position));
let sortedA = [...teamA].sort((a, b) => a.distToBall - b.distToBall);
let sortedB = [...teamB].sort((a, b) => a.distToBall - b.distToBall);
// Team Rood AI partners updaten
teamA.forEach(p => {
if (p === activePlayer) return;
if (p.role === 'GK') { runGoalKeeperAI(p, dt); return; }
const balInZone = isBallInZone(p.role, 'A');
const isTopJager = sortedA.slice(0, 2).includes(p);
if (isTopJager && balInZone && !ballHasPossession) {
moveTowards(p, ball.position, dt);
} else {
moveTowards(p, p.base, dt);
}
});
// Team Blauw AI tegenstanders updaten
const AI_heeft_bal = (possessor && possessor.team === 'B');
teamB.forEach(p => {
if (p.role === 'GK') { runGoalKeeperAI(p, dt); return; }
if (p === possessor) {
const targetGoal = new THREE.Vector3(-HALF_W, 0, 0);
moveTowards(p, targetGoal, dt);
if (p.pos.distanceTo(targetGoal) < 19) {
ballHasPossession = false;
p.hasBall = false;
possessor = null;
const shootDir = new THREE.Vector3().subVectors(targetGoal, ball.position).normalize();
ballVelocity.copy(shootDir).multiplyScalar(22.0);
document.getElementById('status').textContent = "Blauw haalt hard uit!";
}
return;
}
const balInZone = isBallInZone(p.role, 'B');
const isTopJager = sortedB.slice(0, 2).includes(p);
if (isTopJager && !AI_heeft_bal && (balInZone || p.distToBall < 14)) {
moveTowards(p, ball.position, dt);
} else {
let targetPos = p.base.clone();
if (AI_heeft_bal) targetPos.x -= 10;
moveTowards(p, targetPos, dt);
}
});
// 4. BAL VEROWERING & AFPAKKEN (0.8m)
if (!ballHasPossession) {
let allPlayers = [...teamA, ...teamB];
for (let p of allPlayers) {
if (p.role !== 'GK' && p.pos.distanceTo(ball.position) < 0.8) {
ballHasPossession = true;
possessor = p;
p.hasBall = true;
if (p.team === 'A') {
activePlayer = p;
document.getElementById('status').textContent = "Bal onder controle!";
} else {
document.getElementById('status').textContent = "Blauw pakt de bal op!";
}
break;
}
}
} else if (possessor) {
let jagersTeam = (possessor.team === 'A') ? teamB : teamA;
for (let jager of jagersTeam) {
if (jager.role !== 'GK' && jager.pos.distanceTo(possessor.pos) < 0.8) {
possessor.hasBall = false;
possessor = jager;
jager.hasBall = true;
if (jager.team === 'A') {
activePlayer = jager;
document.getElementById('status').textContent = "Bal afgepakt! Omschakeling!";
} else {
document.getElementById('status').textContent = "Blauw voert een tackle uit!";
}
break;
}
}
}
// FIXED: Veilig gecorrigeerde auto-switch bij losse rebounds (Geen crashes meer!)
if (!ballHasPossession && ballVelocity.lengthSq() > 2) {
let validTeammates = teamA.filter(p => p.role !== 'GK');
if (validTeammates.length > 0) {
validTeammates.sort((a, b) => a.pos.distanceTo(ball.position) - b.pos.distanceTo(ball.position));
if (validTeammates[0].pos.distanceTo(ball.position) < 5.0) {
activePlayer = validTeammates[0];
}
}
}
}
function runGoalKeeperAI(p, dt) {
let targetZ = ball.position.z;
if (targetZ > 5.5) targetZ = 5.5;
if (targetZ < -5.5) targetZ = -5.5;
p.vel.set(0, 0, targetZ - p.pos.z);
if(p.vel.lengthSq() > 0.01) {
p.vel.normalize().multiplyScalar(MAX_SPEED * 0.75);
p.pos.addScaledVector(p.vel, dt);
animateLegs(p, dt);
}
}
function moveTowards(p, target, dt) {
let dir = new THREE.Vector3().subVectors(target, p.pos);
dir.y = 0;
if (dir.lengthSq() > 0.1) {
dir.normalize();
p.vel.copy(dir).multiplyScalar(MAX_SPEED * 0.8);
p.pos.addScaledVector(p.vel, dt);
p.meshData.root.lookAt(p.pos.x + p.vel.x, p.pos.y, p.pos.z + p.vel.z);
animateLegs(p, dt);
} else {
p.vel.set(0,0,0);
}
limitToPitch(p.pos);
}
function isBallInZone(role, team) {
const bx = ball.position.x;
if (role === 'DEF') return team === 'A' ? bx < -8 : bx > 8;
if (role === 'MID') return bx >= -25 && bx <= 25;
if (role === 'ATT') return team === 'A' ? bx > -15 : bx < 15;
return true;
}
function animateLegs(player, dt) {
if (player.vel.length() > 0.2) {
const angle = Math.sin(performance.now() * 0.012) * 0.5;
player.meshData.leftLeg.rotation.x = angle;
player.meshData.rightLeg.rotation.x = -angle;
} else {
player.meshData.leftLeg.rotation.x = 0;
player.meshData.rightLeg.rotation.x = 0;
}
}
function limitToPitch(pos) {
if (pos.x < -HALF_W) pos.x = -HALF_W;
if (pos.x > HALF_W) pos.x = HALF_W;
if (pos.z < -HALF_H) pos.z = -HALF_H;
if (pos.z > HALF_H) pos.z = HALF_H;
}
function checkGoalTriggers() {
if (Math.abs(ball.position.z) < 3.8 && ball.position.y < 2.4) {
if (ball.position.x < -HALF_W) {
scoreB++;
triggerGoalSequence("GOAL VOOR BLAUW!");
} else if (ball.position.x > HALF_W) {
scoreA++;
triggerGoalSequence("GOAL!!! JIJ SCOORT VOOR WASTAMA!");
}
}
if (Math.abs(ball.position.x) > HALF_W + 1.5 || Math.abs(ball.position.z) > HALF_H + 1.5) {
if (activePlayer) {
ball.position.set(activePlayer.pos.x, BALL_R, activePlayer.pos.z);
} else {
ball.position.set(0, BALL_R, 0);
}
ballVelocity.set(0,0,0);
}
}
function transformDirection(dir, matrix) {
return dir.clone().applyMatrix4(matrix).normalize();
}
function triggerGoalSequence(msg) {
gameFrozen = true;
resetTimer = 3.0;
document.getElementById('scoreline').textContent =
"HOM " + (scoreA < 10 ? '0' : '') + scoreA + " — " + (scoreB < 10 ? '0' : '') + scoreB + " AWY";
document.getElementById('status').textContent = msg;
}
window.onload = init;
})();
