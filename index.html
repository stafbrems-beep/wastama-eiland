<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tygo Jungle Escape</title>

<style>
body{
margin:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
color:white;
}

#game{
background:#1b5e20;
border:3px solid white;
}
#hud{
position:absolute;
top:20px;
left:20px;
color:white;
}
#menu{
position:absolute;
text-align:center;
}
button{
padding:10px;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<div id="menu">
<h1>TYGO JUNGLE ESCAPE</h1>
<button onclick="startGame()">START</button>
</div>

<div id="hud" style="display:none">
<div>Level: <span id="level">1</span></div>
<div>Lives: <span id="lives">3</span></div>
</div>

<canvas id="game" width="800" height="450"></canvas>

<script>

let canvas=document.getElementById("game")
let ctx=canvas.getContext("2d")

let keys={}

document.addEventListener("keydown",e=>keys[e.key]=true)
document.addEventListener("keyup",e=>keys[e.key]=false)

let player={
x:50,y:350,w:30,h:30,
vx:0,vy:0,
grounded:false
}

let cameraX=0
let level=1
let lives=3

let platforms=[]
let enemies=[]
let levelLength=2000

function startGame(){
document.getElementById("menu").style.display="none"
document.getElementById("hud").style.display="block"
loadLevel(1)
loop()
}

function loadLevel(l){

level=l
document.getElementById("level").innerText=level

player.x=50
player.y=300
player.vx=0
player.vy=0

platforms=[]
enemies=[]

// ===== LEVELS WORDEN STEEDS LANGER + MOEILIJKER =====

let len=1500 + level*800
levelLength=len

// grond
platforms.push({x:0,y:420,w:len,h:50})

// platforms random
for(let i=0;i<level*8;i++){
platforms.push({
x:Math.random()*len,
y:300-Math.random()*200,
w:120,
h:15
})
}

// enemies meer per level
for(let i=0;i<level*4;i++){
enemies.push({
x:200+Math.random()*(len-400),
y:380,
w:30,h:30,
vx:(Math.random()<0.5?-2:2)*level
})
}
}

function loop(){
update()
draw()
requestAnimationFrame(loop)
}

function update(){

// beweging
if(keys["ArrowLeft"])player.x-=5
if(keys["ArrowRight"])player.x+=5

// jump
if(keys[" "] && player.grounded){
player.vy=-10
player.grounded=false
}

player.vy+=0.5
player.y+=player.vy

player.grounded=false

// platforms collision
for(let p of platforms){
if(
player.x<p.x+p.w &&
player.x+player.w>p.x &&
player.y<p.y+p.h &&
player.y+player.h>p.y
){
player.y=p.y-player.h
player.vy=0
player.grounded=true
}
}

// enemies
for(let e of enemies){
e.x+=e.vx

if(e.x<0||e.x>levelLength)e.vx*=-1

if(collide(player,e)){
damage()
}
}

// camera volgt speler vooruit
cameraX=player.x-200

// level einde
if(player.x>levelLength-100){
nextLevel()
}
}

function draw(){

ctx.clearRect(0,0,800,450)

// platforms
ctx.fillStyle="green"
for(let p of platforms){
ctx.fillRect(p.x-cameraX,p.y,p.w,p.h)
}

// enemies
ctx.fillStyle="red"
for(let e of enemies){
ctx.fillRect(e.x-cameraX,e.y,e.w,e.h)
}

// player
ctx.fillStyle="cyan"
ctx.fillRect(player.x-cameraX,player.y,player.w,player.h)
}

function collide(a,b){
return a.x<b.x+b.w &&
a.x+a.w>b.x &&
a.y<b.y+b.h &&
a.y+a.h>b.y
}

function damage(){
lives--
document.getElementById("lives").innerText=lives

player.x=50
player.y=300

if(lives<=0){
alert("GAME OVER")
location.reload()
}
}

function nextLevel(){
if(level<5){
loadLevel(level+1)
player.x=50
}
else{
alert("JE HEBT TYGO GERED!")
location.reload()
}
}

</script>

</body>
</html>
