<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tygo Jungle Escape</title>

<style>
body{
margin:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

canvas{
background:#2e7d32;
border:3px solid white;
}

#hud{
position:absolute;
top:10px;
left:10px;
color:white;
font-size:18px;
display:none;
}

#menu{
position:absolute;
color:white;
text-align:center;
}
button{
padding:10px;
font-size:18px;
}
</style>
</head>

<body>

<div id="menu">
<h1>TYGO JUNGLE ESCAPE</h1>
<button onclick="startGame()">START</button>
</div>

<div id="hud">
<div>Level: <span id="level">1</span></div>
<div>Coins: <span id="coins">0</span></div>
<div>Lives: <span id="lives">3</span></div>
</div>

<canvas id="game" width="800" height="450"></canvas>

<script>

let canvas=document.getElementById("game")
let ctx=canvas.getContext("2d")

let keys={}
document.addEventListener("keydown",e=>keys[e.key]=true)
document.addEventListener("keyup",e=>keys[e.key]=false)

let player={
x:50,y:300,w:30,h:30,
vy:0,
grounded:false
}

let cameraX=0
let level=1
let coins=0
let lives=3

let platforms=[]
let enemies=[]
let spikes=[]
let coinList=[]
let finish={x:0,y:0,w:40,h:80}

function startGame(){
document.getElementById("menu").style.display="none"
document.getElementById("hud").style.display="block"
loadLevel(1)
loop()
}

function loadLevel(l){

level=l
document.getElementById("level").innerText=level

player.x=50
player.y=300
player.vy=0

platforms=[]
enemies=[]
spikes=[]
coinList=[]

// LEVEL LENGTE (groter per level)
let len=2000 + level*1200

// GROND
platforms.push({x:0,y:420,w:len,h:50})

// PLATFORMEN
for(let i=0;i<level*12;i++){
platforms.push({
x:Math.random()*len,
y:250-Math.random()*150,
w:120,
h:15
})
}

// ENEMIES (moeilijker per level)
for(let i=0;i<level*6;i++){
enemies.push({
x:300+Math.random()*(len-600),
y:390,
w:30,h:30,
vx:(Math.random()<0.5?-2:2)*level
})
}

// SPIKES
for(let i=0;i<level*8;i++){
spikes.push({
x:Math.random()*len,
y:400,
w:30,h:20
})
}

// COINS
for(let i=0;i<level*10;i++){
coinList.push({
x:Math.random()*len,
y:200-Math.random()*150,
w:15,h:15,
taken:false
})
}

// FINISH POORT (BELANGRIJK)
finish={
x:len-120,
y:340,
w:40,
h:80
}
}

function loop(){
update()
draw()
requestAnimationFrame(loop)
}

function update(){

// movement
if(keys["ArrowLeft"])player.x-=5
if(keys["ArrowRight"])player.x+=5

// jump
if(keys[" "] && player.grounded){
player.vy=-10
player.grounded=false
}

player.vy+=0.5
player.y+=player.vy

player.grounded=false

// platforms
for(let p of platforms){
if(collide(player,p)){
player.y=p.y-player.h
player.vy=0
player.grounded=true
}
}

// enemies
for(let e of enemies){
e.x+=e.vx
if(e.x<0||e.x>4000)e.vx*=-1

if(collide(player,e))damage()
}

// spikes
for(let s of spikes){
if(collide(player,s))damage()
}

// coins
for(let c of coinList){
if(!c.taken && collide(player,c)){
c.taken=true
coins++
document.getElementById("coins").innerText=coins
}
}

// FINISH CHECK (REALISTISCH)
if(collide(player,finish)){
nextLevel()
}

// camera
cameraX=player.x-200
}

function draw(){

ctx.clearRect(0,0,800,450)

// platforms
ctx.fillStyle="green"
for(let p of platforms){
ctx.fillRect(p.x-cameraX,p.y,p.w,p.h)
}

// spikes
ctx.fillStyle="red"
for(let s of spikes){
ctx.fillRect(s.x-cameraX,s.y,s.w,s.h)
}

// coins
ctx.fillStyle="yellow"
for(let c of coinList){
if(!c.taken){
ctx.fillRect(c.x-cameraX,c.y,c.w,c.h)
}
}

// enemies
ctx.fillStyle="purple"
for(let e of enemies){
ctx.fillRect(e.x-cameraX,e.y,e.w,e.h)
}

// finish POORT
ctx.fillStyle="gold"
ctx.fillRect(finish.x-cameraX,finish.y,finish.w,finish.h)

// player
ctx.fillStyle="cyan"
ctx.fillRect(player.x-cameraX,player.y,player.w,player.h)
}

function collide(a,b){
return a.x<b.x+b.w &&
a.x+a.w>b.x &&
a.y<b.y+b.h &&
a.y+a.h>b.y
}

function damage(){
lives--
document.getElementById("lives").innerText=lives

player.x=50
player.y=300

if(lives<=0){
alert("GAME OVER")
location.reload()
}
}

function nextLevel(){
if(level<5){
loadLevel(level+1)
player.x=50
}
else{
alert("🎉 TYGO HEEFT ALLE LEVELS GEHAALD!")
location.reload()
}
}

</script>

</body>
</html>
