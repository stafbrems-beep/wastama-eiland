<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WASTAMA EILAND MOBILE</title>

<style>
body{margin:0;overflow:hidden;background:black;color:white;font-family:Arial;}

#difficultyMenu,#gameOver{
position:absolute;top:40%;left:50%;
transform:translate(-50%,-50%);
text-align:center;z-index:5;
}

#hud{position:absolute;top:60px;left:20px;display:none;z-index:5;}
#stats{position:absolute;top:10px;left:20px;z-index:5;}

#shopButton{
position:absolute;top:10px;right:20px;
background:#444;padding:10px;cursor:pointer;z-index:5;
}

/* MOBILE CONTROLS */
#mobileControls{
position:fixed;
bottom:20px;
left:20px;
z-index:10;
}

#joystick button{
width:60px;
height:60px;
margin:3px;
font-size:20px;
}

#shootBtn{
position:fixed;
right:20px;
bottom:40px;
width:80px;
height:80px;
font-size:30px;
background:red;
color:white;
border:none;
border-radius:50%;
}

button{padding:10px;margin:5px;}
</style>
</head>

<body>

<div id="stats">
<div>Games gespeeld: <span id="played">0</span></div>
<div>Games gewonnen: <span id="won">0</span></div>
<div>Munten totaal: <span id="coinsTotal">0</span></div>
</div>

<div id="difficultyMenu">
<h1>Kies moeilijkheid</h1>
<button onclick="chooseDifficulty('easy')">🙂 Makkelijk</button>
<button onclick="chooseDifficulty('hard')">😈 Moeilijk</button>
<button onclick="chooseDifficulty('impossible')">💀 Impossible</button>
</div>

<div id="hud">
<div>Hits: <span id="hp">0</span> / 3</div>
<div>Gedood: <span id="kills">0</span></div>
<div>Munten: <span id="coins">0</span></div>
</div>

<div id="gameOver" style="display:none">
<h1 id="endText"></h1>
<button onclick="location.reload()">Opnieuw spelen</button>
</div>

<!-- MOBILE -->
<div id="mobileControls">
  <div id="joystick">
    <button ontouchstart="move('up')" ontouchend="stopMove()">⬆️</button><br>
    <button ontouchstart="move('left')" ontouchend="stopMove()">⬅️</button>
    <button ontouchstart="move('down')" ontouchend="stopMove()">⬇️</button>
    <button ontouchstart="move('right')" ontouchend="stopMove()">➡️</button>
  </div>
  <button id="shootBtn" ontouchstart="shoot()">🔥</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// VARS
let scene,camera,renderer,player;
let enemies=[],bullets=[],enemyBullets=[];
let keys={},touchMove={up:false,down:false,left:false,right:false};
let hits=0,kills=0,gameActive=false;
let shootTimer=0,shootInterval=120;

// MOBILE CONTROL
function move(dir){touchMove[dir]=true;}
function stopMove(){touchMove={up:false,down:false,left:false,right:false};}

// PLAYER
function createPlayer(){
return new THREE.Mesh(
new THREE.BoxGeometry(8,12,8),
new THREE.MeshBasicMaterial({color:0x00aaff})
);
}

// START
function chooseDifficulty(mode){
difficultyMenu.style.display="none";
startGame(mode);
}

function startGame(mode){
gameActive=true;
hud.style.display="block";

scene=new THREE.Scene();
camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,2000);
renderer=new THREE.WebGLRenderer();
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// eiland
let island=new THREE.Mesh(
new THREE.CircleGeometry(600,64),
new THREE.MeshBasicMaterial({color:0x228B22})
);
island.rotation.x=-Math.PI/2;
scene.add(island);

// player
player=createPlayer();
player.position.y=6;
scene.add(player);

// enemies
let count=10;
if(mode==="hard") count=15;
if(mode==="impossible") count=20;

for(let i=0;i<count;i++){
let bot=new THREE.Mesh(
new THREE.BoxGeometry(8,12,8),
new THREE.MeshBasicMaterial({color:0xffffff})
);
bot.position.set((Math.random()-0.5)*500,6,(Math.random()-0.5)*500);
bot.userData.dir=new THREE.Vector3(Math.random()-0.5,0,Math.random()-0.5);
scene.add(bot);
enemies.push(bot);
}

// controls
document.addEventListener("keydown",e=>{
keys[e.key]=true;
if(e.code==="Space") shoot();
});
document.addEventListener("keyup",e=>keys[e.key]=false);

// click fix mobile
document.addEventListener("click",()=>{
if(!("ontouchstart" in window)) shoot();
});

animate();
}

// SHOOT
function shoot(){
let b=new THREE.Mesh(
new THREE.SphereGeometry(2),
new THREE.MeshBasicMaterial({color:0xffffff})
);
b.position.copy(player.position);
b.userData.dir=new THREE.Vector3(0,0,-1);
scene.add(b);
bullets.push(b);
}

// BOT SHOOT
function shootBot(bot){
let dir=player.position.clone().sub(bot.position).normalize();
let b=new THREE.Mesh(
new THREE.SphereGeometry(2),
new THREE.MeshBasicMaterial({color:0xff0000})
);
b.position.copy(bot.position);
b.userData.dir=dir;
scene.add(b);
enemyBullets.push(b);
}

// LOOP
function animate(){
requestAnimationFrame(animate);
if(!gameActive) return;

// movement
if(keys["ArrowUp"]||touchMove.up) player.position.z-=4;
if(keys["ArrowDown"]||touchMove.down) player.position.z+=4;
if(keys["ArrowLeft"]||touchMove.left) player.position.x-=4;
if(keys["ArrowRight"]||touchMove.right) player.position.x+=4;

// bullets
for(let b of bullets){b.position.z-=10;}

// bots move
for(let bot of enemies){
bot.position.add(bot.userData.dir.clone().multiplyScalar(0.5));
if(Math.random()<0.02){
bot.userData.dir=new THREE.Vector3(Math.random()-0.5,0,Math.random()-0.5);
}
}

// bots shoot
shootTimer++;
if(shootTimer>shootInterval){
let bot=enemies[Math.floor(Math.random()*enemies.length)];
if(bot) shootBot(bot);
shootTimer=0;
}

// enemy bullets
for(let eb of enemyBullets){
eb.position.add(eb.userData.dir.clone().multiplyScalar(8));
}

// camera
camera.position.set(player.position.x,25,player.position.z+40);
camera.lookAt(player.position);

renderer.render(scene,camera);
}

</script>

</body>
</html>
