<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WASTAMA EILAND - SHOP FIX</title>

<style>
body{margin:0;overflow:hidden;background:black;color:white;font-family:Arial;}
#shopButton{position:absolute;top:10px;right:20px;background:#444;padding:10px;cursor:pointer;}
#shopMenu{
display:none;
position:absolute;
top:50%;left:50%;
transform:translate(-50%,-50%);
width:600px;height:400px;
background:#111;border:3px solid white;padding:20px;
}
button{padding:10px;margin:5px;cursor:pointer;}
</style>
</head>

<body>

<div id="shopButton">SHOP</div>

<div id="shopMenu">
<div onclick="closeShop()" style="cursor:pointer;position:absolute;right:10px;">✖</div>
<h2>SHOP</h2>

<button onclick="buySkin('red',10)">🔥 Rode kubus</button>
<button onclick="buySkin('blue',10)">💧 Blauwe cilinder</button>
<button onclick="buySkin('gold',20)">✨ Gouden kegel</button>

</div>

<script>
// ================= FIX =================

// skins opslaan
let ownedSkins = JSON.parse(localStorage.getItem("skins")) || ["default"];
let currentSkin = localStorage.getItem("selectedSkin") || "default";
let totalCoins = parseInt(localStorage.getItem("coins")) || 100;

// shop openen
shopButton.onclick = () => shopMenu.style.display="block";
function closeShop(){shopMenu.style.display="none";}

// kopen / selecteren
function buySkin(skin,cost){

    // als je hem al hebt → selecteer
    if(ownedSkins.includes(skin)){
        currentSkin = skin;
        localStorage.setItem("selectedSkin", skin);
        alert("Skin geselecteerd!");
        return;
    }

    // anders kopen
    if(totalCoins < cost){
        alert("Niet genoeg munten!");
        return;
    }

    totalCoins -= cost;
    localStorage.setItem("coins", totalCoins);

    ownedSkins.push(skin);
    localStorage.setItem("skins", JSON.stringify(ownedSkins));

    currentSkin = skin;
    localStorage.setItem("selectedSkin", skin);

    alert("Skin gekocht!");
}

</script>

</body>
</html>
