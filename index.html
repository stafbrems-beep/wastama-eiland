<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Launcher</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 30px;
        }

        .button-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .game-btn {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background-color: #0f3460;
            border: 2px solid #e94560;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .game-btn:hover {
            background-color: #e94560;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Welke game wil je spelen?</h1>

    <div class="button-container">
        <!-- Knop 1: Wastama Eiland -->
        <a href="https://stafbrems-beep.github.io/wastama-eiland/" class="game-btn">Wastama Eiland</a>
        
        <!-- Knop 2: Space Portal Runner -->
        <a href="Space%20Portal%20Runner%20(1).html" class="game-btn">Space Portal Runner</a>
    </div>

</body>
</html>
