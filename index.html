<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WASTAMA EILAND V2</title>
<style>
body{margin:0;overflow:hidden;background:black;color:white;font-family:Arial;}
#hud{position:absolute;top:10px;left:10px;z-index:5;}
#difficultyMenu,#gameOver{
position:absolute;top:40%;left:50%;
transform:translate(-50%,-50%);
text-align:center;z-index:5;
}
button{padding:10px;margin:5px;}

/* 🎯 crosshair */
#crosshair{
position:absolute;
top:50%;left:50%;
width:10px;height:10px;
margin-left:-5px;margin-top:-5px;
border:2px solid white;
border-radius:50%;
z-index:10;
}
</style>
</head>
<body>

<div id="crosshair"></div>

<div id="hud">
HP: <span id="hp">0</span>/3 |
Kills: <span id="kills">0</span>
</div>

<div id="difficultyMenu">
<h1>Difficulty</h1>
<button onclick="chooseDifficulty('easy')">Easy</button>
<button onclick="chooseDifficulty('hard')">Hard</button>
<button onclick="chooseDifficulty('impossible')">Impossible</button>
</div>

<div id="gameOver" style="display:none">
<h1 id="endText"></h1>
<button onclick="location.reload()">Restart</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

let scene,camera,renderer,player;
let enemies=[],bullets=[],enemyBullets=[],buildings=[];
let keys={},hits=0,kills=0;
let difficulty="easy";
let smartBots=2;
let shootCooldown=0;

function chooseDifficulty(d){
difficulty=d;
if(d==="easy") smartBots=2;
if(d==="hard") smartBots=3;
if(d==="impossible") smartBots=5;
difficultyMenu.style.display="none";
startGame();
}

function startGame(){

scene=new THREE.Scene();
camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,4000);
renderer=new THREE.WebGLRenderer();
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// 🌍 MAP
let ground=new THREE.Mesh(
new THREE.CircleGeometry(2000,64),
new THREE.MeshBasicMaterial({color:0x228B22})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// 🏢 BUILDINGS
for(let i=0;i<30;i++){
let b=new THREE.Mesh(
new THREE.BoxGeometry(60,120,60),
new THREE.MeshBasicMaterial({color:0x555555})
);
b.position.set((Math.random()-0.5)*3000,60,(Math.random()-0.5)*3000);
scene.add(b);
buildings.push(b);
}

// 🌳 BOMEN
for(let i=0;i<50;i++){
let t=new THREE.Mesh(
new THREE.CylinderGeometry(2,2,20),
new THREE.MeshBasicMaterial({color:0x8b4513})
);
let l=new THREE.Mesh(
new THREE.ConeGeometry(12,30,8),
new THREE.MeshBasicMaterial({color:0x228B22})
);
let x=(Math.random()-0.5)*3000;
let z=(Math.random()-0.5)*3000;
t.position.set(x,10,z);
l.position.set(x,30,z);
scene.add(t,l);
}

// 🧍 PLAYER
player=new THREE.Mesh(
new THREE.BoxGeometry(10,15,10),
new THREE.MeshBasicMaterial({color:0x00ff00})
);
player.position.y=8;
scene.add(player);

// 🤖 ENEMIES
for(let i=0;i<25;i++){
let bot=new THREE.Mesh(
new THREE.BoxGeometry(10,15,10),
new THREE.MeshBasicMaterial({color:0xffffff})
);
bot.position.set((Math.random()-0.5)*2000,8,(Math.random()-0.5)*2000);
bot.userData.smart=i<smartBots;
bot.userData.dir=new THREE.Vector3(Math.random()-0.5,0,Math.random()-0.5);
scene.add(bot);
enemies.push(bot);
}

// 🎮 INPUT
document.addEventListener("keydown",e=>{
if(!keys[e.key]){
keys[e.key]=true;
if(e.code==="Space") shoot();
}
});
document.addEventListener("keyup",e=>keys[e.key]=false);
document.addEventListener("click",shoot);

animate();
}

// 🔫 SHOOT (cooldown)
function shoot(){
if(shootCooldown>0) return;

shootCooldown=10;

let b=new THREE.Mesh(
new THREE.SphereGeometry(2),
new THREE.MeshBasicMaterial({color:0xffffff})
);
b.position.copy(player.position);

let dir=new THREE.Vector3();
camera.getWorldDirection(dir);
b.userData.dir=dir;

scene.add(b);
bullets.push(b);
}

// 💥 EXPLOSIE
function explode(pos){
let e=new THREE.Mesh(
new THREE.SphereGeometry(5),
new THREE.MeshBasicMaterial({color:0xff0000})
);
e.position.copy(pos);
scene.add(e);

setTimeout(()=>scene.remove(e),200);
}

// 🤖 BOT SHOOT
function shootBot(bot){
let dir=player.position.clone().sub(bot.position).normalize();

let b=new THREE.Mesh(
new THREE.SphereGeometry(2),
new THREE.MeshBasicMaterial({color:0xff0000})
);
b.position.copy(bot.position);
b.userData.dir=dir;

scene.add(b);
enemyBullets.push(b);
}

// 🎬 LOOP
function animate(){
requestAnimationFrame(animate);

// cooldown
if(shootCooldown>0) shootCooldown--;

// movement
let mx=0,mz=0;
if(keys["ArrowUp"]) mz--;
if(keys["ArrowDown"]) mz++;
if(keys["ArrowLeft"]) mx--;
if(keys["ArrowRight"]) mx++;

let len=Math.sqrt(mx*mx+mz*mz);
if(len>0){mx/=len;mz/=len;}

player.position.x+=mx*5;
player.position.z+=mz*5;

// 🤖 bots
for(let bot of enemies){

if(bot.userData.smart){

// cover systeem
let target=player.position.clone();

// soms cover zoeken
if(Math.random()<0.005){
let b=buildings[Math.floor(Math.random()*buildings.length)];
if(b) target=b.position;
}

let dir=target.clone().sub(bot.position).normalize();
bot.position.add(dir.multiplyScalar(0.7));

if(Math.random()<0.02) shootBot(bot);

}else{
bot.position.add(bot.userData.dir.clone().multiplyScalar(0.5));
if(Math.random()<0.02){
bot.userData.dir=new THREE.Vector3(Math.random()-0.5,0,Math.random()-0.5);
}
}
}

// bullets
for(let i=bullets.length-1;i>=0;i--){
bullets[i].position.add(bullets[i].userData.dir.clone().multiplyScalar(12));

for(let j=enemies.length-1;j>=0;j--){
if(bullets[i].position.distanceTo(enemies[j].position)<10){
explode(enemies[j].position);

scene.remove(enemies[j]);
enemies.splice(j,1);

kills++;
document.getElementById("kills").innerText=kills;

scene.remove(bullets[i]);
bullets.splice(i,1);
break;
}
}
}

// enemy bullets
for(let i=enemyBullets.length-1;i>=0;i--){
enemyBullets[i].position.add(enemyBullets[i].userData.dir.clone().multiplyScalar(8));

if(enemyBullets[i].position.distanceTo(player.position)<10){
hits++;
document.getElementById("hp").innerText=hits;

scene.remove(enemyBullets[i]);
enemyBullets.splice(i,1);

if(hits>=3){
endText.innerText="GAME OVER";
gameOver.style.display="block";
}
}
}

// camera
camera.position.lerp(
new THREE.Vector3(player.position.x,40,player.position.z+60),
0.1
);
camera.lookAt(player.position);

renderer.render(scene,camera);
}

</script>
</body>
</html>
