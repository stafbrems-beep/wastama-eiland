<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Super Platform Adventure</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#87CEEB;
}
canvas{
    display:block;
}
#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:24px;
    font-family:Arial;
}
</style>
</head>

<body>

<div id="ui"></div>
<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let cameraX = 0;
let score = 0;
let lives = 3;
let level = 1;

const keys = {};

document.addEventListener("keydown",e=>{
    keys[e.key]=true;
});

document.addEventListener("keyup",e=>{
    keys[e.key]=false;
});

const player={
    x:100,
    y:300,
    w:50,
    h:60,
    dx:0,
    dy:0,
    speed:7,
    jump:-18,
    grounded:false,
    shootPower:false,
    shootTimer:0
};

let bullets=[];
let enemies=[];
let coins=[];
let powerups=[];
let platforms=[];

function createLevel(n){

    enemies=[];
    coins=[];
    powerups=[];
    platforms=[];

    const levelLength=12000;

    platforms.push({
        x:0,
        y:650,
        w:levelLength,
        h:100
    });

    for(let i=500;i<levelLength;i+=400){

        platforms.push({
            x:i,
            y:400+Math.sin(i/500)*120,
            w:200,
            h:25
        });

        coins.push({
            x:i+100,
            y:300+Math.sin(i/500)*120
        });
    }

    for(let i=800;i<levelLength;i+=700){

        enemies.push({
            x:i,
            y:600,
            w:50,
            h:50,
            dir:1
        });
    }

    for(let i=2000;i<levelLength;i+=2500){

        powerups.push({
            x:i,
            y:550,
            w:40,
            h:40
        });
    }
}

createLevel(1);

function shoot(){

    if(!player.shootPower) return;

    bullets.push({
        x:player.x+25,
        y:player.y+20,
        dx:12
    });
}

document.addEventListener("keydown",e=>{

    if(e.key==="f"){
        shoot();
    }

});

function rectHit(a,b){

    return (
        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y
    );
}

function update(){

    if(keys["a"]||keys["ArrowLeft"])
        player.dx=-player.speed;
    else if(keys["d"]||keys["ArrowRight"])
        player.dx=player.speed;
    else
        player.dx=0;

    if((keys["w"]||keys[" "])&&player.grounded){

        player.dy=player.jump;
        player.grounded=false;
    }

    player.dy+=0.8;

    player.x+=player.dx;
    player.y+=player.dy;

    player.grounded=false;

    platforms.forEach(p=>{

        if(
            player.x < p.x+p.w &&
            player.x+player.w > p.x &&
            player.y+player.h > p.y &&
            player.y+player.h < p.y+30 &&
            player.dy>=0
        ){
            player.y=p.y-player.h;
            player.dy=0;
            player.grounded=true;
        }
    });

    enemies.forEach(e=>{
        e.x+=e.dir*2;

        if(Math.random()<0.01)
            e.dir*=-1;

        if(rectHit(player,e)){
            lives--;

            player.x=100;

            if(lives<=0){
                alert("Game Over");
                location.reload();
            }
        }
    });

    bullets.forEach(b=>{
        b.x+=b.dx;
    });

    enemies = enemies.filter(enemy=>{

        let alive=true;

        bullets.forEach(b=>{

            if(
                b.x>enemy.x &&
                b.x<enemy.x+enemy.w &&
                b.y>enemy.y &&
                b.y<enemy.y+enemy.h
            ){
                alive=false;
                score+=100;
            }
        });

        return alive;
    });

    coins=coins.filter(c=>{

        let hit=
            Math.abs(player.x-c.x)<40 &&
            Math.abs(player.y-c.y)<40;

        if(hit){
            score+=10;
            return false;
        }

        return true;
    });

    powerups=powerups.filter(p=>{

        let hit=
            Math.abs(player.x-p.x)<50 &&
            Math.abs(player.y-p.y)<50;

        if(hit){

            player.shootPower=true;
            player.shootTimer=1800;

            return false;
        }

        return true;
    });

    if(player.shootPower){

        player.shootTimer--;

        if(player.shootTimer<=0){
            player.shootPower=false;
        }
    }

    if(player.x>11500){

        level++;

        if(level>7){

            alert("Je hebt alle 7 levels voltooid!");
            location.reload();
        }

        createLevel(level);

        player.x=100;
    }

    cameraX=player.x-canvas.width/2;

    document.getElementById("ui").innerHTML=
    `
    Level: ${level}
    Score: ${score}
    Levens: ${lives}
    ${player.shootPower ? "POWER SHOT ACTIEF" : ""}
    `;
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();
    ctx.translate(-cameraX,0);

    platforms.forEach(p=>{

        ctx.fillStyle="green";
        ctx.fillRect(p.x,p.y,p.w,p.h);
    });

    coins.forEach(c=>{

        ctx.fillStyle="gold";

        ctx.beginPath();
        ctx.arc(c.x,c.y,12,0,Math.PI*2);
        ctx.fill();
    });

    powerups.forEach(p=>{

        ctx.fillStyle="purple";
        ctx.fillRect(p.x,p.y,p.w,p.h);
    });

    enemies.forEach(e=>{

        ctx.fillStyle="red";
        ctx.fillRect(e.x,e.y,e.w,e.h);
    });

    bullets.forEach(b=>{

        ctx.fillStyle="yellow";
        ctx.fillRect(b.x,b.y,12,6);
    });

    ctx.fillStyle="blue";
    ctx.fillRect(
        player.x,
        player.y,
        player.w,
        player.h
    );

    ctx.restore();
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
