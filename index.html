<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WASTAMA EILAND</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
color:white;
}

#difficultyMenu,#characterMenu,#gameOver{
position:absolute;
top:40%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

#characterMenu{display:none;}

#hud{
position:absolute;
top:60px;
left:20px;
display:none;
}

#stats{
position:absolute;
top:10px;
left:20px;
}

#shopButton{
position:absolute;
top:10px;
right:20px;
background:#444;
padding:10px;
cursor:pointer;
}

#shopMenu{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:600px;
height:400px;
background:#111;
border:3px solid white;
padding:20px;
}

button{
padding:12px;
margin:5px;
font-size:16px;
cursor:pointer;
}
</style>
</head>

<body>

<div id="stats">
<div>Games gespeeld: <span id="played">0</span></div>
<div>Games gewonnen: <span id="won">0</span></div>
<div>Munten totaal: <span id="coinsTotal">0</span></div>
</div>

<div id="shopButton">SHOP</div>

<div id="difficultyMenu">
<h1>Kies moeilijkheid</h1>
<button onclick="chooseDifficulty('easy')">🙂 Makkelijk</button>
<button onclick="chooseDifficulty('hard')">😈 Moeilijk</button>
<button onclick="chooseDifficulty('impossible')">💀 Impossible</button>
</div>

<div id="characterMenu">
<h1>Kies je mannetje</h1>
<button onclick="startGame('ice')">❄ IJs</button>
<button onclick="startGame('fire')">🔥 Vuur</button>
<button onclick="startGame('lightning')">⚡ Bliksem</button>
</div>

<div id="hud">
<div>Hits: <span id="hp">0</span> / 3</div>
<div>Gedood: <span id="kills">0</span></div>
<div>Munten: <span id="coins">0</span></div>
</div>

<div id="gameOver" style="display:none">
<h1 id="endText"></h1>
<button onclick="location.reload()">Opnieuw spelen</button>
</div>

<div id="shopMenu">
<div style="position:absolute;right:10px;top:10px;cursor:pointer;font-size:20px"
onclick="closeShop()">✖</div>

<h2>SHOP</h2>
<button onclick="buySkin('red',10)">Rode skin - 10 munten</button>
<button onclick="buySkin('blue',10)">Blauwe skin - 10 munten</button>
<button onclick="buySkin('gold',20)">Gouden skin - 20 munten</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ================= TOEGEVOEGD =================
let impossibleMode="bots";

// --- STATS ---
let gamesPlayed = parseInt(localStorage.getItem("played")) || 0;
let gamesWon = parseInt(localStorage.getItem("won")) || 0;
let totalCoins = parseInt(localStorage.getItem("coins")) || 0;

document.getElementById("played").innerText = gamesPlayed;
document.getElementById("won").innerText = gamesWon;
document.getElementById("coinsTotal").innerText = totalCoins;

// --- VARIABLES ---
let difficulty="easy";
let powerType="ice";

let scene,camera,renderer,player;
let enemies=[],bullets=[],enemyBullets=[],coinObjects=[],healthPacks=[];

let keys={};
let yaw=0;
let hits=0, kills=0, coins=0;
let gameActive=false;
let shootTimer=0, shootIndex=0, aPressed=false;
let abilityCooldown=0;

let ownedSkins = JSON.parse(localStorage.getItem("skins"))||["default"];
let currentSkin="default";

// --- SHOP ---
document.getElementById("shopButton").onclick = () => shopMenu.style.display="block";
function closeShop(){ shopMenu.style.display="none"; }
function buySkin(color,cost){
    if(totalCoins<cost){ alert("Niet genoeg munten"); return; }
    totalCoins-=cost;
    document.getElementById("coinsTotal").innerText = totalCoins;
    localStorage.setItem("coins",totalCoins);
    ownedSkins.push(color);
    localStorage.setItem("skins",JSON.stringify(ownedSkins));
    currentSkin=color;
    alert("Skin gekocht!");
}

// --- MENU FUNCTIONS ---
function chooseDifficulty(mode){
    difficulty = mode;
    difficultyMenu.style.display="none";

    if(mode==="impossible"){
        showImpossibleChoice();
    }else{
        characterMenu.style.display="block";
    }
}

// ================= NIEUW =================
function showImpossibleChoice(){
let div=document.createElement("div");
div.id="impossibleChoice";
div.style.position="absolute";
div.style.top="40%";
div.style.left="50%";
div.style.transform="translate(-50%,-50%)";
div.style.textAlign="center";
div.innerHTML=`
<h1>Impossible mode</h1>
<button onclick="chooseImpossible('bots')">Veel bots 😈</button>
<button onclick="chooseImpossible('boss')">Boss 👹</button>
`;
document.body.appendChild(div);
}

function chooseImpossible(mode){
impossibleMode=mode;
document.getElementById("impossibleChoice").remove();
characterMenu.style.display="block";
}

// --- START GAME ---
function startGame(type){
    powerType = type;
    gamesPlayed++; localStorage.setItem("played",gamesPlayed);
    document.getElementById("played").innerText = gamesPlayed;

    characterMenu.style.display="none";
    hud.style.display="block";
    gameActive=true;

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,2000);
    renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth,window.innerHeight);
    document.body.appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff,1));

    let sea = new THREE.Mesh(new THREE.CircleGeometry(2000,64), new THREE.MeshBasicMaterial({color:0x1e90ff}));
    sea.rotation.x=-Math.PI/2; scene.add(sea);
    let island = new THREE.Mesh(new THREE.CircleGeometry(600,64), new THREE.MeshBasicMaterial({color:0x228B22}));
    island.rotation.x=-Math.PI/2; island.position.y=0.1; scene.add(island);

    let color=0x00ffff;
    player = new THREE.Mesh(new THREE.BoxGeometry(8,12,8), new THREE.MeshBasicMaterial({color:color}));
    player.position.y=6; scene.add(player);

    let botCount=5;
    if(difficulty==="hard") botCount=10;
    if(difficulty==="impossible"){
        if(impossibleMode==="bots") botCount=25;
        else botCount=0;
    }

    for(let i=0;i<botCount;i++){
        let bot=new THREE.Mesh(new THREE.BoxGeometry(8,12,8), new THREE.MeshBasicMaterial({color:0xffffff}));
        bot.position.set((Math.random()-0.5)*500,6,(Math.random()-0.5)*500);
        bot.userData.moveDir=new THREE.Vector3(Math.random()-0.5,0,Math.random()-0.5).normalize();
        scene.add(bot); enemies.push(bot);
    }

    // ===== BOSS =====
    if(difficulty==="impossible" && impossibleMode==="boss"){
        let boss=new THREE.Mesh(new THREE.BoxGeometry(40,40,40), new THREE.MeshBasicMaterial({color:0xff0000}));
        boss.position.set(0,20,0);
        boss.userData.hp=30;
        boss.userData.isBoss=true;
        scene.add(boss);
        enemies.push(boss);
    }

    document.addEventListener("keydown", e=>{
        keys[e.key.toLowerCase()]=true;
        if(e.code==="Space") shoot();
    });
    document.addEventListener("keyup", e=>keys[e.key.toLowerCase()]=false);
    document.addEventListener("mousemove", e=>{ yaw-=e.movementX*0.002; });

    animate();
}

function shoot(){
    let bullet=new THREE.Mesh(new THREE.SphereGeometry(2), new THREE.MeshBasicMaterial({color:0xffffff}));
    bullet.position.copy(player.position);
    bullet.userData.dir=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));
    scene.add(bullet); bullets.push(bullet);
}

function shootBot(bot){
    let dir=player.position.clone().sub(bot.position).normalize();
    let bullet=new THREE.Mesh(new THREE.SphereGeometry(2), new THREE.MeshBasicMaterial({color:0xff0000}));
    bullet.position.copy(bot.position); bullet.userData.dir=dir;
    scene.add(bullet); enemyBullets.push(bullet);
}

function endGame(text){
gameActive=false;
document.getElementById("endText").innerText=text;
gameOver.style.display="block";
}

function animate(){
requestAnimationFrame(animate);
if(!gameActive)return;

// ===== VERDRINKEN =====
if(player.position.length()>600){
endGame("VERDRONKEN 🌊");
}

renderer.render(scene,camera);
}

</script>

</body>
</html>
